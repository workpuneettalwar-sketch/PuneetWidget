                  self.l_pos = self._label(r2, "Pos --", self.f_txt, WHITE)
                  self.l_pos.pack(side="left", padx=(12, 0))
                  r3 = tk.Frame(top, bg=BG)
                  r3.pack(fill="x")
                  self.l_pnl2 = self._label(r3, "PnL --", self.f_pnl, GREY)
                  self.l_pnl2.pack(side="left")
                  self.l_pos2 = self._label(r3, "Pos --", self.f_txt, WHITE)
                  self.l_pos2.pack(side="left", padx=(12, 0))
                  self.l_adx = self._label(top, "ADX --", self.f_txt, ADX_FG)
                  self.l_adx.configure(justify="left")
                  self.l_adx.pack(fill="x", pady=(3, 0))
                  top.bind("<Configure>", lambda e: self.l_adx.configure(wraplength=max(60, e.width)))

                  # BELOW the separator: the index list, always open
                  # RIGHT: the index list, always open
                  right.columnconfigure(0, weight=11, uniform="col")
                  right.columnconfigure(1, weight=10, uniform="col")
                  right.columnconfigure(2, weight=16, uniform="col")
                  self.row_w = []
                  self.row_on = []
                  for i in range(MAX_ROWS):
                      n = self._label(right, "", self.f_idxb, WHITE)
                      p = self._label(right, "--", self.f_idx, WHITE, "e")
                      c = self._label(right, "", self.f_idxb, GREY, "e")
                      n.grid(row=i, column=0, sticky="ew")
                      p.grid(row=i, column=1, sticky="ew")
                      c.grid(row=i, column=2, sticky="ew")
                      self.row_w.append((n, p, c))
                      self.row_on.append(True)
                      right.rowconfigure(i, weight=1, uniform="row")

                  # corner mark for resizing (used when there is no title bar)
                  self.grip = tk.Label(root, text="\u25E2", bg=BG, fg="#8A9098", cursor="size_nw_se", font=(FONT, 9))
                  self.grip.bind("<ButtonPress-1>", self._grip_press)
                  self.grip.bind("<B1-Motion>", self._grip_drag)
                  self.grip.bind("<ButtonRelease-1>", self._grip_release)

                  self.v_top = tk.BooleanVar(root, value=self.cfg["topmost"])
                  self.v_frame = tk.BooleanVar(root, value=not self.cfg["frameless"])
                  self.v_clear = tk.BooleanVar(root, value=self.cfg["transparent"])
                  self.menu = tk.Menu(root, tearoff=0)
                  self.menu.add_command(label="Settings", command=self.open_settings)
                  self.menu.add_checkbutton(label="Always on top", variable=self.v_top, command=self._menu_toggle)
                  self.menu.add_checkbutton(label="Show title bar", variable=self.v_frame, command=self._menu_toggle)
                  self.menu.add_checkbutton(label="Fully transparent background", variable=self.v_clear, command=self._menu_toggle)
                  self.menu.add_separator()
                  self.menu.add_command(label="Exit", command=self.quit)
                  root.bind("<Button-3>", self._popup)
                  root.bind("<ButtonPress-1>", self._press)
                  root.bind("<B1-Motion>", self._drag)
                  root.bind("<ButtonRelease-1>", self._release)
                  root.protocol("WM_DELETE_WINDOW", self.quit)

                  self._place_window()
                  self.apply_look()
                  self._loop(self.fast_tick, 0.5)     # independent loops: a slow ADX / index request never delays the PnL
                  self._loop(self.sf_tick, 1.0)
                  self._loop(self.adx_tick, 1.5)
                  self._loop(self.index_tick, 1.0)
                  root.after(100, self._ui_tick)

              @staticmethod
              def _label(parent, text, font, fg, anchor="w"):
                  return tk.Label(parent, text=text, font=font, bg=BG, fg=fg, anchor=anchor, padx=0, pady=0, bd=0)

              # ---- window position, size and look
              def _place_window(self):
                  root, cfg = self.root, self.cfg
                  w = cfg["w"] or int(430 * self.scale)
                  h = cfg["h"] or int(560 * self.scale)
                  x, y = cfg["x"], cfg["y"]
                  try:      # keep it reachable if a second screen was unplugged
                      vx, vy = root.winfo_vrootx(), root.winfo_vrooty()
                      vw = max(root.winfo_vrootwidth(), root.winfo_screenwidth())
                      vh = max(root.winfo_vrootheight(), root.winfo_screenheight())
                      x = max(vx, min(x, vx + vw - 120))
                      y = max(vy, min(y, vy + vh - 80))
                  except Exception:
                      pass
                  root.geometry("%dx%d+%d+%d" % (w, h, x, y))

              def _remember_window(self):
                  try:
                      m = re.match(r"(\d+)x(\d+)\+(-?\d+)\+(-?\d+)", self.root.geometry())
                      if m:
                          w, h, x, y = (int(g) for g in m.groups())
                          self.cfg.update({"w": w, "h": h, "x": x, "y": y})
                  except Exception:
                      pass

              def apply_look(self):
                  root, cfg = self.root, self.cfg
                  try:
                      root.attributes("-alpha", max(0.3, min(1.0, cfg["alpha"] / 100.0)))
                      root.attributes("-topmost", bool(cfg["topmost"]))
                  except Exception:
                      pass
                  try:      # Windows shows nothing where the window has exactly this colour: only the text stays
                      root.attributes("-transparentcolor", BG if cfg["transparent"] else "")
                  except Exception:
                      pass
                  frameless = bool(cfg["frameless"])
                  if frameless != self._frameless:
                      first = self._frameless is None
                      self._frameless = frameless
                      try:
                          if not first:
                              root.withdraw()
                          root.overrideredirect(frameless)
                          if not first:
                              root.deiconify()
                      except Exception:
                          pass
                      if frameless:
                          self.grip.place(relx=1.0, rely=1.0, anchor="se")
                      else:
                          self.grip.place_forget()
                  ts, isz = cfg["tsize"], cfg["isize"]
                  self.f_big.configure(size=ts + 3)
                  self.f_pnl.configure(size=ts + 1)
                  self.f_txt.configure(size=ts)
                  self.f_idx.configure(size=isz)
                  self.f_idxb.configure(size=isz)
                  self.v_top.set(bool(cfg["topmost"]))
                  self.v_frame.set(not frameless)
                  self.v_clear.set(bool(cfg["transparent"]))

              def _menu_toggle(self):
                  self.cfg["topmost"] = bool(self.v_top.get())
                  self.cfg["frameless"] = not bool(self.v_frame.get())
                  self.cfg["transparent"] = bool(self.v_clear.get())
                  self.apply_look()
                  save_cfg(self.cfg)

              def _popup(self, e):
                  try:
                      self.menu.tk_popup(e.x_root, e.y_root)
                  finally:
                      self.menu.grab_release()

              def _press(self, e):
                  self._dragged = False
                  self._press_at = (e.x_root, e.y_root, self.root.winfo_x(), self.root.winfo_y())

              def _drag(self, e):
                  if self._press_at is None or not self._frameless:
                      return
                  x0, y0, wx, wy = self._press_at
                  dx, dy = e.x_root - x0, e.y_root - y0
                  if abs(dx) + abs(dy) > 4:
                      self._dragged = True
                  if self._dragged:
                      self.root.geometry("+%d+%d" % (wx + dx, wy + dy))

              def _release(self, e):
                  self._press_at = None
                  if self._dragged:
                      self._remember_window()
                      save_cfg(self.cfg)

              def _click(self, action):
                  """Buttons react on release, and only when the press was not the start of a drag."""
                  if not self._dragged:
                      action()

              def _grip_press(self, e):
                  self._grip_at = (e.x_root, e.y_root, self.root.winfo_width(), self.root.winfo_height())
                  return "break"

              def _grip_drag(self, e):
                  if self._grip_at is not None:
                      x0, y0, w0, h0 = self._grip_at
                      self.root.geometry("%dx%d" % (max(300, w0 + e.x_root - x0), max(140, h0 + e.y_root - y0)))
                  return "break"

              def _grip_release(self, e):
                  self._grip_at = None
                  self._remember_window()
                  save_cfg(self.cfg)
                  return "break"

              def quit(self):
                  self._remember_window()
                  save_cfg(self.cfg)
                  self.root.destroy()

              # ---- buttons
              def open_settings(self):
                  if self.settings is not None and self.settings.alive():
                      self.settings.win.lift()
                      self.settings.win.focus_force()
                      return
                  self.settings = Settings(self)

              def show_text(self, title, text):
                  win = tk.Toplevel(self.root)
                  win.title(title)
                  win.attributes("-topmost", True)
                  box = tk.Text(win, width=84, height=min(30, max(6, text.count("\n") + 3)), wrap="word", font=("Consolas", 10))
                  box.insert("1.0", text)
                  box.configure(state="disabled")
                  box.pack(fill="both", expand=True, padx=10, pady=(10, 4))
                  tk.Button(win, text="OK", width=10, command=win.destroy).pack(pady=(0, 10))

              def run_test(self, title, fn):
                  """Runs a check in the background and shows its text when it is ready."""
                  def work():
                      try:
                          out = fn()
                      except Exception as e:
                          out = "Error: " + (str(e) or type(e).__name__)
                      self.uiq.put(lambda: self.show_text(title, out))
                  threading.Thread(target=work, daemon=True).start()

              # ---- background loops (they only fill self.st / self.rows; the window is drawn by _ui_tick)
              @staticmethod
              def _loop(fn, delay):
                  def run():
                      while True:
                          try:
                              fn()
                          except Exception:
                              pass
                          time.sleep(delay)
                  threading.Thread(target=run, daemon=True).start()

              @staticmethod
              def _res(f, timeout=6):
                  try:
                      return f.result(timeout=timeout)
                  except Exception:
                      return None

              def fast_tick(self):
                  """BTC price + main account PnL and positions. Repeats as fast as Delta answers."""
                  cfg = self.cfg
                  p = self.pool.submit(self.feeds.mark, SYMBOL)
                  n = self.pool.submit(fetch_pnl, cfg, "")
                  self.st["price"] = self._res(p)
                  r = self._res(n)
                  self.st["pnl"] = r if r is not None else (None, self.st["pnl"][1])

              def sf_tick(self):
                  """2nd Delta account PnL, on its own loop so it never slows the main PnL."""
                  self.st["pnl2"] = fetch_pnl(self.cfg, "2")

              def _adx_one(self, tf):
                  h, l, c = self.feeds.candles(tf)
                  return adx_calc(h, l, c)

              def adx_tick(self):
                  tfs = cfg_tfs(self.cfg)
                  futs = [self.pool.submit(self._adx_one, tf) for tf in tfs]
                  parts = []
                  for tf, f in zip(tfs, futs):
                      v = self._res(f)
                      parts.append("%s --" % tf if v is None else "%s %.1f" % (tf, v))
                  self.st["adx"] = "ADX " + " | ".join(parts)

              def _index_job(self, spec):
                  try:
                      price = self.feeds.quote(spec)[0]
                      prev = self.feeds.prev_map.get(spec.upper())
                      if prev is None:
                          prev = self.feeds.prev_for(spec)
                      ref = self.refs.prev(spec, price)
                      own = False
                      if prev is None:
                          prev = ref
                          own = ref is not None
                      self.rows[spec] = (price, prev, own)
                  except Exception:
                      self.rows[spec] = None
                  finally:
                      with self.busy_lock:
                          self.busy.discard(spec)

              def index_tick(self):
                  """Every row is fetched on its own thread, so one slow source only delays its own row."""
                  names = index_list(self.cfg)
                  for _, spec in names:
                      with self.busy_lock:
                          if spec in self.busy:      # previous request for this row still running
                              continue
                          self.busy.add(spec)
                      try:
                          self.idx_pool.submit(self._index_job, spec)
                      except Exception:
                          with self.busy_lock:
                              self.busy.discard(spec)
                  # Nifty next to BTC: fetched here even if its row is hidden from the list
                  row = self.rows.get("NIFTY")
                  if row is not None:
                      self.st["nifty"] = row[0]
                  elif all(s != "NIFTY" for _, s in names):
                      self.st["nifty"] = self._res(self.pool.submit(lambda: self.feeds.quote("NIFTY")[0]))
                  else:
                      self.st["nifty"] = None

              # ---- drawing (main thread only)
              def _set(self, w, text, fg=None):
                  new = (text, fg)
                  if self.shown.get(w) != new:
                      self.shown[w] = new
                      if fg is None:
                          w.configure(text=text)
                      else:
                          w.configure(text=text, fg=fg)

              def draw(self):
                  st, cfg = self.st, self.cfg
                  rate = cfg_rate(cfg)
                  price = st["price"]
                  self._set(self.l_price, "BTC --" if price is None else "BTC " + "{:,.1f}".format(price))
                  nifty = st["nifty"]
                  self._set(self.l_nifty, "| Nifty --" if nifty is None else "| Nifty " + "{:,.0f}".format(nifty))
                  for lp, lpos, key in ((self.l_pnl, self.l_pos, "pnl"), (self.l_pnl2, self.l_pos2, "pnl2")):
                      text, colour, pos = fmt_pnl(st[key][0], st[key][1], rate)
                      self._set(lp, text, colour)
                      self._set(lpos, pos)
                  self._set(self.l_adx, st["adx"])
                  names = index_list(cfg)
                  for i in range(MAX_ROWS):
                      on = i < len(names)
                      wn, wp, wc = self.row_w[i]
                      if on != self.row_on[i]:
                          self.row_on[i] = on
                          for w in (wn, wp, wc):
                              if on:
                                  w.grid()
                              else:
                                  w.grid_remove()
                          self.right.rowconfigure(i, weight=1 if on else 0, uniform="row" if on else "")
                      if not on:
                          continue
                      label, spec = names[i]
                      self._set(wn, label)
                      row = self.rows.get(spec)
                      if row is None:
                          self._set(wp, "--")
                          self._set(wc, "", GREY)
                          continue
                      self._set(wp, fmt_price(spec, row[0]))
                      text, colour = fmt_change(spec, row[0], row[1], row[2])
                      self._set(wc, text, colour)

              def _ui_tick(self):
                  while True:
                      try:
                          job = self.uiq.get_nowait()
                      except queue.Empty:
                          break
                      try:
                          job()
                      except Exception:
                          pass
                  try:
                      self.draw()
                  except Exception:
                      pass
                  self.root.after(200, self._ui_tick)


          # ---------------------------------------------------------------- settings window
          class Settings:
              def __init__(self, app):
                  self.app = app
                  cfg = app.cfg
                  self.vars = {}
                  win = self.win = tk.Toplevel(app.root)
                  self.v_title = tk.BooleanVar(win, value=not cfg["frameless"])
                  win.title(APP + " settings")
                  win.geometry("%dx%d" % (int(660 * app.scale), int(680 * app.scale)))
                  win.attributes("-topmost", True)
                  bar = tk.Frame(win, pady=8)
                  bar.pack(side="bottom", fill="x")
                  tk.Button(bar, text="Save and close", width=18, command=self.close).pack()
                  sb = tk.Scrollbar(win, orient="vertical")
                  sb.pack(side="right", fill="y")
                  canvas = tk.Canvas(win, highlightthickness=0, yscrollcommand=sb.set)
                  canvas.pack(side="left", fill="both", expand=True)
                  sb.configure(command=canvas.yview)
                  body = self.body = tk.Frame(canvas, padx=16, pady=10)
                  item = canvas.create_window((0, 0), window=body, anchor="nw")
                  body.bind("<Configure>", lambda e: canvas.configure(scrollregion=canvas.bbox("all")))
                  canvas.bind("<Configure>", lambda e: canvas.itemconfigure(item, width=e.width))
                  win.bind("<MouseWheel>", lambda e: canvas.yview_scroll(-1 if e.delta > 0 else 1, "units"))
                  win.protocol("WM_DELETE_WINDOW", self.close)

                  self.head("LOOK")
                  self.check("transparent", "Fully transparent background: only the text shows, the desktop is visible behind it")
                  self.slider("alpha", "Opacity of the whole widget in % (30 = faint, 100 = solid; this fades the text too)", 30, 100)
                  self.slider("tsize", "Text size, top part: prices, PnL, Pos and ADX", 6, 60)
                  self.slider("isize", "Text size, index list", 6, 60)
                  self.check("topmost", "Always on top of other windows")
                  tk.Checkbutton(body, text="Show a normal title bar (off = plain widget: drag it to move, drag the corner mark to resize)",
                                 variable=self.v_title, command=self.live, anchor="w").pack(fill="x")

                  self.head("MAIN DELTA ACCOUNT")
                  self.field("relay", "Relay URL (fixed-IP server), e.g. https://1-2-3-4.sslip.io")
                  self.field("rtoken", "Relay token")
                  self.field("key", "Delta API key (read-only; optional backup if relay is down)")
                  self.field("secret", "Delta API secret (optional backup)", secret=True)
                  self.field("pnlsrc", "PnL source: blank = widget calculation (recommended). Type delta to use Delta's own field "
                                       "(known to be wrong for options)")
                  self.field("fee", "Fee per open position in rupees, subtracted from PnL. Try 12. Blank = none")
                  self.field("rate", "USD-to-INR rate for PnL (blank = 85, Delta's fixed rate; type usd to show dollars)")
                  self.field("tfs", "ADX timeframes, comma-separated (blank = 5m,15m,1h; options 1m,3m,5m,15m,30m,1h,4h)")
                  self.button("Test PnL (shows raw Delta numbers)", lambda: self.test_pnl(""))
                  self.button("Open Delta API page (to whitelist an IP)", lambda: webbrowser.open(DELTA_KEYS_PAGE))

                  self.head("2ND DELTA ACCOUNT (the Secure Folder account on the phone)")
                  self.field("key2", "2nd account Delta API key (read-only key is enough)")
                  self.field("secret2", "2nd account Delta API secret", secret=True)
                  self.field("relay2", "2nd account relay URL (optional; must be set up for the 2nd account's key)")
                  self.field("rtoken2", "2nd account relay token (optional)")
                  self.field("pnlsrc2", "2nd account PnL source: blank = widget calculation (recommended); type delta for Delta's own field")
                  self.field("fee2", "2nd account fee per open position in rupees. Blank = none")
                  self.button("Test PnL of 2nd account", lambda: self.test_pnl("2"))

                  self.head("INDEX LIST")
                  self.field("hide", "Hide rows, comma-separated (e.g. SILVER,CRUDE). Names: NIFTY GIFT MIDCAP SMALL VIX BTC ETH XAU GOLD "
                                     "SILVER DOW NASDAQ CRUDE USDINR. A * after a change means it is measured against the widget's own "
                                     "saved close of the previous day")
                  self.note("Extra prices (%d slots): a name and a symbol. Symbols: SOLUSD (Delta), idx:nifty-bank idx:sensex "
                            "(angelone.in/indices/<name>), yahoo:^NSEBANK, bullions:mcx bullions:24k bullions:22k bullions:silver"
                            % CUSTOM_SLOTS)
                  for i in range(1, CUSTOM_SLOTS + 1):
                      row = tk.Frame(body)
                      row.pack(fill="x", pady=1)
                      tk.Label(row, text="Index %d  name" % i, width=13, anchor="w").pack(side="left")
                      self.entry(row, "c%dl" % i, 16).pack(side="left")
                      tk.Label(row, text="  symbol").pack(side="left")
                      self.entry(row, "c%ds" % i, 30).pack(side="left", fill="x", expand=True)
                  self.button("Test gold (bullions.co.in)", lambda: app.run_test("Gold check", app.feeds.bullions_debug))
                  self.button("Test prices (shows each source)", lambda: app.run_test("Index check", app.feeds.index_debug))
                  self.note("Settings are kept in " + CFG_DIR)

              def alive(self):
                  try:
                      return bool(self.win.winfo_exists())
                  except Exception:
                      return False

              # ---- building blocks
              def head(self, text):
                  tk.Label(self.body, text=text, font=(FONT, 11, "bold"), anchor="w").pack(fill="x", pady=(16, 2))

              def note(self, text):
                  tk.Label(self.body, text=text, anchor="w", justify="left", wraplength=int(600 * self.app.scale)).pack(fill="x", pady=(8, 0))

              def entry(self, parent, key, width, secret=False):
                  v = self.vars[key] = tk.StringVar(self.win, value=self.app.cfg[key])
                  return tk.Entry(parent, textvariable=v, width=width, show="*" if secret else "")

              def field(self, key, hint, secret=False):
                  self.note(hint)
                  self.entry(self.body, key, 70, secret).pack(fill="x")

              def slider(self, key, title, lo, hi):
                  self.note(title)
                  v = self.vars[key] = tk.IntVar(self.win, value=self.app.cfg[key])
                  tk.Scale(self.body, from_=lo, to=hi, orient="horizontal", variable=v,
                           command=lambda _v: self.live()).pack(fill="x")

              def check(self, key, text):
                  v = self.vars[key] = tk.BooleanVar(self.win, value=self.app.cfg[key])
                  tk.Checkbutton(self.body, text=text, variable=v, command=self.live, anchor="w").pack(fill="x", pady=(8, 0))

              def button(self, text, command):
                  tk.Button(self.body, text=text, command=command, anchor="w", padx=8).pack(anchor="w", pady=(8, 0))

              # ---- reading the form
              def collect(self):
                  new = dict(self.app.cfg)
                  for k, v in self.vars.items():
                      try:
                          new[k] = v.get()
                      except Exception:
                          pass
                  new["frameless"] = not bool(self.v_title.get())
                  new = clean_cfg(new)
                  return new

              def live(self):
                  """Sliders and tick boxes act at once, so the result is visible while choosing."""
                  self.app.cfg = self.collect()
                  self.app.apply_look()

              def test_pnl(self, sfx):
                  c = self.collect()
                  rate = cfg_rate(c)
                  self.app.run_test("PnL check" if not sfx else "2nd account PnL check",
                                    lambda: pnl_debug(c["key" + sfx], c["secret" + sfx], c["relay" + sfx], c["rtoken" + sfx],
                                                      rate if rate > 0 else 85.0, c["pnlsrc" + sfx].lower(), c["fee" + sfx].lower()))

              def close(self):
                  self.app._remember_window()
                  new = self.collect()
                  for k in ("x", "y", "w", "h"):
                      new[k] = self.app.cfg[k]
                  self.app.cfg = new
                  save_cfg(new)
                  self.app.apply_look()
                  self.win.destroy()


          def main():
              try:      # sharp text on high-resolution laptop screens
                  import ctypes
                  ctypes.windll.shcore.SetProcessDpiAwareness(1)   # type: ignore[attr-defined]
              except Exception:
                  pass
              try:
                  App().root.mainloop()
              except Exception:
                  import traceback
                  try:
                      os.makedirs(CFG_DIR, exist_ok=True)
                      with open(LOG_FILE, "a", encoding="utf-8") as f:
                          f.write(time.strftime("%Y-%m-%d %H:%M:%S\n") + traceback.format_exc() + "\n")
                  except Exception:
                      pass
                  raise


          if __name__ == "__main__":
              main()
          END_OF_FILE_X
      - name: Check source
        run: |
          python -m py_compile widget_windows.py
          python -c "import widget_windows; print('source ok')"
      - name: Build exe
        run: |
          python -m pip install "pyinstaller>=6,<7"
          # one plain .exe: no console window, no UPX packing (packed files are what antivirus tools flag most)
          pyinstaller --onefile --noconsole --noupx --clean --name widget-windows widget_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: widget-windows-exe
          path: dist/widget-windows.exe
