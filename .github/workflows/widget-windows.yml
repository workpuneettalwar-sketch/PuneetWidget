                  self.l_gear = self._label(r1, "\u2699", self.f_txt, GREY)
                  self.l_gear.configure(cursor="hand2")
                  self.l_gear.pack(side="right")
                  self.l_gear.bind("<ButtonRelease-1>", lambda e: self._click(self.open_settings))
                  self.l_nifty = self._label(r1, "| Nifty --", self.f_big, WHITE)
