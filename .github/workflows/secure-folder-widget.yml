name: Build Secure Folder Widget
on:
  push:
    paths:
      - '.github/workflows/secure-folder-widget.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p sf-widget && cd sf-widget
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'END_OF_FILE_X'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.sfwidget"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.sfwidget"; minSdk = 26; targetSdk = 34
                  versionCode = (project.findProperty("verCode") as String?)?.toIntOrNull() ?: 1
                  versionName = "1.0"
              }
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"; keyAlias = "androiddebugkey"; keyPassword = "android"
                  }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.core:core-ktx:1.13.1") }
          END_OF_FILE_X

          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'END_OF_FILE_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>
              <application android:label="@string/app_name" android:icon="@drawable/ic_app"
                  android:theme="@android:style/Theme.Material.Light.DarkActionBar">

                  <activity android:name=".SettingsActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <!-- Main profile: invisible step between a widget tap and the Secure Folder app -->
                  <activity android:name=".LaunchActivity" android:exported="false"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar"
                      android:excludeFromRecents="true" android:noHistory="true" android:taskAffinity=""/>

                  <!-- Secure Folder copy: one launcher entry per widget button (hidden in the main profile) -->
                  <activity android:name=".SlotActivity" android:exported="true"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar"
                      android:excludeFromRecents="true" android:noHistory="true" android:taskAffinity=""/>
                  <activity-alias android:name=".Slot0" android:targetActivity=".SlotActivity" android:exported="true"
                      android:label="SF Button 1" android:icon="@drawable/ic_app">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity-alias>
                  <activity-alias android:name=".Slot1" android:targetActivity=".SlotActivity" android:exported="true"
                      android:label="SF Button 2" android:icon="@drawable/ic_app">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity-alias>
                  <activity-alias android:name=".Slot2" android:targetActivity=".SlotActivity" android:exported="true"
                      android:label="SF Button 3" android:icon="@drawable/ic_app">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity-alias>
                  <activity-alias android:name=".Slot3" android:targetActivity=".SlotActivity" android:exported="true"
                      android:label="SF Button 4" android:icon="@drawable/ic_app">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity-alias>

                  <receiver android:name=".WidgetProvider" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info"/>
                  </receiver>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
                  </receiver>
                  <service android:name=".UpdateService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="live widget refresh"/>
                  </service>
              </application>
          </manifest>
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/sfwidget'
          cat > 'app/src/main/java/com/sfwidget/Activities.kt' <<'END_OF_FILE_X'
          package com.sfwidget

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.widget.Toast

          /** Normal phone: a widget button was pressed. */
          class LaunchActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val slot = intent.getIntExtra("slot", 0).coerceIn(0, 3)
                  val err = try { Xp.open(this, slot) } catch (e: Exception) { e.message ?: e.javaClass.simpleName }
                  if (err != null) Toast.makeText(this, err, Toast.LENGTH_LONG).show()
                  finish()
              }
          }

          /** Secure Folder copy: "SF Button 1..4". Opens the app picked for that button inside Secure Folder. */
          class SlotActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val slot = (intent.component?.className ?: "").lastOrNull()?.digitToIntOrNull()?.coerceIn(0, 3) ?: 0
                  val pkg = Prefs.slotPkg(this, slot)
                  val launch = if (pkg.isEmpty()) null else packageManager.getLaunchIntentForPackage(pkg)
                  if (launch != null) {
                      startActivity(launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } else {
                      Toast.makeText(this, "Pick the app for button ${slot + 1} in this Secure Folder copy", Toast.LENGTH_LONG).show()
                      startActivity(Intent(this, SettingsActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  }
                  finish()
              }
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/sfwidget'
          cat > 'app/src/main/java/com/sfwidget/Delta.kt' <<'END_OF_FILE_X'
          package com.sfwidget

          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import javax.crypto.Mac
          import javax.crypto.spec.SecretKeySpec

          object Delta {
              const val BASE = "https://api.india.delta.exchange"

              private fun get(path: String, query: String, key: String?, secret: String?,
                              url: String? = null, token: String? = null): JSONObject {
                  val q = if (query.isEmpty()) "" else "?$query"
                  val c = URL(url ?: (BASE + path + q)).openConnection() as HttpURLConnection
                  c.connectTimeout = 3000; c.readTimeout = 3000
                  c.setRequestProperty("User-Agent", "sf-widget")
                  c.setRequestProperty("Accept", "application/json")
                  if (token != null) {
                      c.setRequestProperty("X-Token", token)
                  } else if (key != null && secret != null) {
                      val ts = (System.currentTimeMillis() / 1000).toString()
                      val mac = Mac.getInstance("HmacSHA256")
                      mac.init(SecretKeySpec(secret.toByteArray(), "HmacSHA256"))
                      val sig = mac.doFinal(("GET" + ts + path + q).toByteArray()).joinToString("") { "%02x".format(it) }
                      c.setRequestProperty("api-key", key)
                      c.setRequestProperty("timestamp", ts)
                      c.setRequestProperty("signature", sig)
                  }
                  val code = c.responseCode
                  val body = (if (code in 200..299) c.inputStream else c.errorStream).bufferedReader().readText()
                  c.disconnect()
                  val j = try { JSONObject(body) } catch (e: Exception) { throw Exception("HTTP $code") }
                  if (!j.optBoolean("success", true)) {
                      val e = j.optJSONObject("error")
                      var msg = e?.optString("code") ?: j.optString("error", "api error")
                      val ip = Regex("""\d{1,3}(\.\d{1,3}){3}""").find(e?.optJSONObject("context")?.toString() ?: "")?.value
                      if (ip != null) msg += " $ip"
                      throw Exception(msg)
                  }
                  return j
              }

              @Volatile var pnlErr = ""

              private fun positions(relay: String, token: String, key: String, secret: String) =
                  (if (relay.isNotEmpty()) get("/positions", "", null, null, relay.trimEnd('/') + "/positions", token)
                   else get("/v2/positions/margined", "", key, secret)).getJSONArray("result")

              private fun num(o: org.json.JSONObject?, k: String): Double? = o?.optString(k, "")?.toDoubleOrNull()

              private fun symOf(p: org.json.JSONObject): String =
                  p.optString("product_symbol", "").ifEmpty { p.optJSONObject("product")?.optString("symbol") ?: "" }

              /** Own calculation: size x contract_value x (mark - entry). Null when any input is missing or implausible. */
              private fun recompute(p: org.json.JSONObject, size: Double): Double? {
                  val entry = num(p, "entry_price") ?: return null
                  if (entry <= 0.0) return null                      // an entry of 0 would turn PnL into the position's full value
                  val sym = symOf(p)
                  if (sym.isEmpty()) return null
                  val t = get("/v2/tickers/$sym", "", null, null).getJSONObject("result")
                  val cv = num(p.optJSONObject("product"), "contract_value") ?: num(t, "contract_value") ?: return null
                  val mark = num(t, "mark_price") ?: return null
                  return size * cv * (mark - entry)
              }

              /** One consistent source: the live own calculation. Delta's reported figure is only a fallback. */
              /** Fee setting: "" = none, "auto" = subtract the position's own commission field, number = rupees per open position. */
              @Volatile var feeMode = ""
              @Volatile var rateInr = 85.0
              private fun feeUsd(p: org.json.JSONObject): Double {
                  if (feeMode.isEmpty()) return 0.0
                  if (feeMode == "auto") return Math.abs(num(p, "commission") ?: 0.0)
                  val inr = feeMode.toDoubleOrNull() ?: return 0.0
                  return inr / (if (rateInr > 0) rateInr else 85.0)
              }

              @Volatile var pnlMode = ""   // "" / "delta" = Delta's own figure first, "own" = own calculation first

              /**
               * Default: use Delta's own unrealized_pnl (exactly what its app shows, same server, same instant),
               * but fall back to the own calculation when it is missing or absurdly far from it (guards the old
               * "market value instead of PnL" problem). Mode "own" prefers the own calculation.
               */
              private fun pick(api: Double?, own: Double?): Double {
                  // Delta's unrealized_pnl field turned out to be wrong for option positions, so the own calculation
                  // (size x contract value x (mark - entry)) is the default. Mode "delta" prefers Delta's field.
                  if (pnlMode == "delta") return api ?: own ?: 0.0
                  return own ?: api ?: 0.0
              }

              /** Background threads for fetching all option prices at the same time. */
              private val fetchPool = java.util.concurrent.Executors.newCachedThreadPool { r -> Thread(r).apply { isDaemon = true } }

              /** PnL (USD) and number of open positions. */
              fun pnl(key: String, secret: String, relay: String = "", token: String = ""): Pair<Double, Int> {
                  val r = positions(relay, token, key, secret)
                  val jobs = ArrayList<Triple<org.json.JSONObject, Double, java.util.concurrent.Future<Double?>>>()
                  for (i in 0 until r.length()) {
                      val p = r.getJSONObject(i)
                      val size = p.optString("size", "0").toDoubleOrNull() ?: 0.0
                      if (size == 0.0) continue
                      // all prices are requested at the same moment, so the sum is one consistent snapshot
                      jobs.add(Triple(p, size, fetchPool.submit(java.util.concurrent.Callable<Double?> {
                          try { recompute(p, size) } catch (_: Exception) { null } })))
                  }
                  var sum = 0.0
                  for ((p, _, f) in jobs) {
                      val own = try { f.get(4, java.util.concurrent.TimeUnit.SECONDS) } catch (_: Exception) { null }
                      sum += pick(num(p, "unrealized_pnl"), own) - feeUsd(p)
                  }
                  return Pair(sum, jobs.size)
              }

              /** Human-readable dump used by the "Test PnL" button in settings. */
              fun pnlDebug(key: String, secret: String, relay: String, token: String, rate: Double): String {
                  val r = positions(relay, token, key, secret)
                  val sb = StringBuilder()
                  var total = 0.0; var open = 0
                  for (i in 0 until r.length()) {
                      val p = r.getJSONObject(i)
                      val size = p.optString("size", "0").toDoubleOrNull() ?: 0.0
                      if (size == 0.0) continue
                      open++
                      val api = num(p, "unrealized_pnl")
                      val own = try { recompute(p, size) } catch (e: Exception) { null }
                      val used = pick(api, own)
                      sb.append("${symOf(p)}  size=${p.optString("size")}  entry=${p.optString("entry_price")}\n")
                      sb.append("  Delta unrealized_pnl: ${api ?: "missing"}\n")
                      sb.append("  own calculation: ${own ?: "n/a"}\n")
                      sb.append("  commission field: ${p.optString("commission", "missing")}   fee applied: ${"%.4f".format(feeUsd(p))}\n")
                      sb.append("  used: $used   (Rs ${"%.2f".format(used * rate)})\n")
                      total += used - feeUsd(p)
                  }
                  if (open == 0) return "No open positions."
                  sb.append("\nTotal: $${"%.4f".format(total)}  x ${"%.2f".format(rate)} = Rs ${"%.2f".format(total * rate)}\n")
                  return sb.toString()
              }

          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/sfwidget'
          cat > 'app/src/main/java/com/sfwidget/Prefs.kt' <<'END_OF_FILE_X'
          package com.sfwidget

          import android.content.Context

          object Prefs {
              fun sp(c: Context) = c.getSharedPreferences("w", Context.MODE_PRIVATE)
              fun alpha(c: Context) = sp(c).getInt("alpha", 180)
              fun tsize(c: Context) = sp(c).getInt("tsize", 16)
              fun str(c: Context, k: String) = sp(c).getString(k, "")!!.trim()

              /** Delta India's fixed USD-INR rate is 85. Blank = 85, type "usd" to show dollars, or any number to override. */
              fun rate(c: Context): Double {
                  val v = str(c, "rate")
                  return when {
                      v.isEmpty() -> 85.0
                      v.equals("usd", true) -> 0.0
                      else -> v.toDoubleOrNull() ?: 85.0
                  }
              }

              /** Package name picked for widget button i (0..3); empty = button hidden. */
              fun slotPkg(c: Context, i: Int) = str(c, "slot$i")
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/sfwidget'
          cat > 'app/src/main/java/com/sfwidget/SettingsActivity.kt' <<'END_OF_FILE_X'
          package com.sfwidget

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.widget.*
          import androidx.core.widget.doAfterTextChanged

          class SettingsActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  if (Build.VERSION.SDK_INT >= 33 && Xp.inMain())
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 1)
                  val sp = Prefs.sp(this)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 40, 40, 40) }
                  fun label(t: String, big: Boolean = false) = root.addView(TextView(this).apply {
                      text = t; setPadding(0, 32, 0, 0); if (big) { textSize = 18f; setTypeface(typeface, android.graphics.Typeface.BOLD) }
                  })
                  fun dialog(title: String, work: () -> String) {
                      Toast.makeText(this, "Checking...", Toast.LENGTH_SHORT).show()
                      Thread {
                          val out = try { work() } catch (e: Exception) { "Error: " + (e.message ?: e.javaClass.simpleName) }
                          runOnUiThread { AlertDialog.Builder(this).setTitle(title).setMessage(out).setPositiveButton("OK", null).show() }
                      }.start()
                  }
                  fun button(t: String, f: () -> Unit) = root.addView(Button(this).apply { text = t; setOnClickListener { f() } })

                  label(if (Xp.inMain()) "This copy: NORMAL PHONE (shows the widget)"
                        else "This copy: SECURE FOLDER (opens apps for the widget buttons)", true)

                  button("Test Secure Folder link") { dialog("Secure Folder link") { Xp.diag(this) } }

                  // ---- app pickers: same as the main widget; the picked app's own icon is shown on the button
                  label("Widget buttons (2 per row, 2 rows)", true)
                  label(if (Xp.inMain()) "Pick an app for each button. Apps marked [SF] were seen inside Secure Folder; other apps open their Secure Folder copy when pressed."
                        else "Secure Folder copy: pick the SAME 4 apps as on the normal phone (used when the widget opens apps through this copy).")
                  for (i in 0 until 4) {
                      val btn = Button(this)
                      fun refresh() { btn.text = "Button ${i + 1}: " + Xp.name(this, Prefs.slotPkg(this, i)) }
                      refresh()
                      btn.setOnClickListener {
                          val pm = packageManager
                          val names = LinkedHashMap<String, String>()   // package -> name shown in the list
                          for ((_, a) in Xp.otherApps(this))
                              names.putIfAbsent(a.componentName.packageName, "[SF] " + a.label)
                          for (r in pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)) {
                              val p = r.activityInfo.packageName
                              if (p != packageName) names.putIfAbsent(p, r.loadLabel(pm).toString())
                          }
                          val list = names.entries.sortedBy { it.value.removePrefix("[SF] ").lowercase() }
                          AlertDialog.Builder(this).setTitle("Button ${i + 1}")
                              .setItems((listOf("None (empty slot)") + list.map { it.value }).toTypedArray()) { _, k ->
                                  sp.edit().putString("slot$i", if (k == 0) "" else list[k - 1].key).apply()
                                  refresh(); WidgetProvider.start(this)
                              }.show()
                      }
                      root.addView(btn)
                  }

                  fun field(k: String, hint: String) {
                      label(hint)
                      root.addView(EditText(this).apply {
                          setText(sp.getString(k, "")); setSingleLine()
                          doAfterTextChanged { sp.edit().putString(k, it.toString().trim()).apply() }
                      })
                  }

                  // ---- widget side
                  label("PnL (2nd Delta account)", true)
                  if (!Xp.inMain()) label("These matter only in the normal-phone copy, where the widget is.")
                  fun seek(title: String, maxV: Int, init: Int, save: (Int) -> Unit) {
                      label(title)
                      root.addView(SeekBar(this).apply {
                          max = maxV; progress = init
                          setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { save(p) }
                              override fun onStartTrackingTouch(s: SeekBar?) {}
                              override fun onStopTrackingTouch(s: SeekBar?) {}
                          })
                      })
                  }
                  seek("Widget transparency (left = clear, right = solid)", 255, Prefs.alpha(this)) { sp.edit().putInt("alpha", it).apply() }
                  seek("Text size for PnL and Pos (11-22)", 11, Prefs.tsize(this) - 11) { sp.edit().putInt("tsize", it + 11).apply() }
                  field("key", "Delta API key of the 2nd account (read-only key is enough)")
                  field("secret", "Delta API secret of the 2nd account")
                  field("relay", "Relay URL (optional, fixed-IP server). Must be set up for the 2nd account's key")
                  field("rtoken", "Relay token (optional)")
                  field("pnlsrc", "PnL source: blank = widget calculation (recommended). Type delta to use Delta's own field")
                  field("fee", "Fee per open position in rupees, subtracted from PnL. Blank = none")
                  field("rate", "USD-to-INR rate (blank = 85, Delta's fixed rate; type usd to show dollars)")

                  button("Test PnL (shows raw Delta numbers)") {
                      val rate = Prefs.rate(this)
                      Delta.feeMode = Prefs.str(this, "fee").lowercase(); Delta.rateInr = rate
                      Delta.pnlMode = Prefs.str(this, "pnlsrc").lowercase()
                      dialog("PnL check") {
                          Delta.pnlDebug(Prefs.str(this, "key"), Prefs.str(this, "secret"), Prefs.str(this, "relay"),
                              Prefs.str(this, "rtoken"), if (rate > 0) rate else 85.0)
                      }
                  }
                  button("Open Delta API page (to whitelist an IP)") {
                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://india.delta.exchange/app/account/manageapikeys")))
                  }

                  setContentView(ScrollView(this).apply { addView(root) })
                  WidgetProvider.start(this)
              }

              override fun onPause() { super.onPause(); WidgetProvider.start(this) }
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/sfwidget'
          cat > 'app/src/main/java/com/sfwidget/UpdateService.kt' <<'END_OF_FILE_X'
          package com.sfwidget

          import android.app.*
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder
          import android.util.TypedValue
          import android.view.View
          import android.widget.RemoteViews
          import androidx.core.graphics.drawable.toBitmap
          import java.util.Locale
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit

          class UpdateService : Service() {
              private val loop = Executors.newSingleThreadScheduledExecutor()
              private var started = false

              private val btnIds = listOf(R.id.b0, R.id.b1, R.id.b2, R.id.b3)

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("w", "Widget refresh", NotificationManager.IMPORTANCE_MIN))
                  val n = Notification.Builder(this, "w").setContentTitle("Secure Folder widget running")
                      .setSmallIcon(android.R.drawable.ic_lock_lock).build()
                  if (Build.VERSION.SDK_INT >= 34) startForeground(2, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(2, n)
              }

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  initWidget()
                  if (!started) {
                      started = true
                      loop.scheduleWithFixedDelay({ try { tick() } catch (_: Throwable) {} }, 0, 1000, TimeUnit.MILLISECONDS)
                  }
                  return START_STICKY
              }

              private fun ids() = AppWidgetManager.getInstance(this)
                  .getAppWidgetIds(ComponentName(this, WidgetProvider::class.java))

              /** Full update: icons, labels and click targets. Text is refreshed by tick(). */
              private fun initWidget() {
                  val rv = RemoteViews(packageName, R.layout.widget)
                  val pkgs = (0 until 4).map { Prefs.slotPkg(this, it) }
                  for (i in 0 until 4) {
                      if (pkgs[i].isEmpty()) { rv.setViewVisibility(btnIds[i], View.INVISIBLE); continue }
                      rv.setViewVisibility(btnIds[i], View.VISIBLE)
                      rv.setImageViewBitmap(btnIds[i], Xp.icon(this, pkgs[i]).toBitmap(96, 96))
                      val tap = Intent(this, LaunchActivity::class.java).putExtra("slot", i)
                          .setData(Uri.parse("sfw://slot/$i"))
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_NO_ANIMATION)
                      rv.setOnClickPendingIntent(btnIds[i], PendingIntent.getActivity(this, 20 + i, tap,
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT))
                  }
                  rv.setViewVisibility(R.id.row1, if (pkgs[0].isNotEmpty() || pkgs[1].isNotEmpty()) View.VISIBLE else View.GONE)
                  rv.setViewVisibility(R.id.row2, if (pkgs[2].isNotEmpty() || pkgs[3].isNotEmpty()) View.VISIBLE else View.GONE)
                  rv.setOnClickPendingIntent(R.id.gear, PendingIntent.getActivity(this, 3,
                      Intent(this, SettingsActivity::class.java), PendingIntent.FLAG_IMMUTABLE))
                  AppWidgetManager.getInstance(this).updateAppWidget(ids(), rv)
              }

              /** Relay first (fixed IP); if it fails and a direct key is saved, try direct. */
              private fun fetchPnl(): Pair<Double, Int>? {
                  val key = Prefs.str(this, "key"); val sec = Prefs.str(this, "secret")
                  val relay = Prefs.str(this, "relay"); val rtok = Prefs.str(this, "rtoken")
                  Delta.pnlMode = Prefs.str(this, "pnlsrc").lowercase()
                  Delta.feeMode = Prefs.str(this, "fee").lowercase()
                  Delta.rateInr = Prefs.rate(this)
                  val direct = key.isNotEmpty() && sec.isNotEmpty()
                  if (relay.isEmpty() && !direct) { Delta.pnlErr = "add API key in app"; return null }
                  try {
                      val r = Delta.pnl(key, sec, relay, rtok); Delta.pnlErr = ""; return r
                  } catch (e: Exception) {
                      if (relay.isNotEmpty() && direct) {
                          try { val r = Delta.pnl(key, sec); Delta.pnlErr = ""; return r }
                          catch (e2: Exception) { Delta.pnlErr = e2.message ?: e2.javaClass.simpleName; return null }
                      }
                      Delta.pnlErr = e.message ?: e.javaClass.simpleName
                      return null
                  }
              }

              private fun tick() {
                  val pnl = fetchPnl()
                  val rv = RemoteViews(packageName, R.layout.widget)
                  val L = Locale.US
                  rv.setInt(R.id.bg, "setImageAlpha", Prefs.alpha(this))
                  val ts = Prefs.tsize(this).toFloat()
                  rv.setTextViewTextSize(R.id.pnl, TypedValue.COMPLEX_UNIT_SP, ts + 2f)
                  rv.setTextViewTextSize(R.id.pos, TypedValue.COMPLEX_UNIT_SP, ts)
                  if (pnl == null) {
                      rv.setTextViewText(R.id.pnl, "PnL: " + Delta.pnlErr.ifEmpty { "--" }); rv.setTextColor(R.id.pnl, 0xFFAAAAAA.toInt())
                      rv.setTextViewText(R.id.pos, "Pos --")
                  } else {
                      val rate = Prefs.rate(this)
                      val v = if (rate > 0) pnl.first * rate else pnl.first
                      val sym = if (rate > 0) "₹" else "$"
                      rv.setTextViewText(R.id.pnl, String.format(L, "PnL %s%s%,.2f", if (v < 0) "-" else "+", sym, Math.abs(v)))
                      rv.setTextColor(R.id.pnl, if (v >= 0) 0xFF4CD964.toInt() else 0xFFFF5A5F.toInt())
                      rv.setTextViewText(R.id.pos, "Pos ${pnl.second}")
                  }
                  AppWidgetManager.getInstance(this).partiallyUpdateAppWidget(ids(), rv)
              }

              override fun onDestroy() { loop.shutdownNow(); super.onDestroy() }
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/sfwidget'
          cat > 'app/src/main/java/com/sfwidget/WidgetProvider.kt' <<'END_OF_FILE_X'
          package com.sfwidget

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent

          class WidgetProvider : AppWidgetProvider() {
              override fun onUpdate(c: Context, m: AppWidgetManager, ids: IntArray) = start(c)
              override fun onEnabled(c: Context) = start(c)
              override fun onDisabled(c: Context) { c.stopService(Intent(c, UpdateService::class.java)) }

              companion object {
                  fun hasWidget(c: Context): Boolean = try {
                      AppWidgetManager.getInstance(c).getAppWidgetIds(ComponentName(c, WidgetProvider::class.java)).isNotEmpty()
                  } catch (_: Exception) { false }

                  /** The refresh service runs only where a widget is actually placed (not in the Secure Folder copy). */
                  fun start(c: Context) {
                      Xp.syncAliases(c)
                      if (!hasWidget(c)) return
                      try { c.startForegroundService(Intent(c, UpdateService::class.java)) } catch (_: Exception) {}
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) = WidgetProvider.start(c)
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/sfwidget'
          cat > 'app/src/main/java/com/sfwidget/Xp.kt' <<'END_OF_FILE_X'
          package com.sfwidget

          import android.app.Activity
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.CrossProfileApps
          import android.content.pm.LauncherActivityInfo
          import android.content.pm.LauncherApps
          import android.content.pm.PackageManager
          import android.graphics.drawable.Drawable
          import android.os.Build
          import android.os.Process
          import android.os.UserHandle

          /** Opening apps that live in Secure Folder (a separate Android profile) from the home-screen widget. */
          object Xp {
              private const val SF_PKG = "com.samsung.knox.securefolder"

              /** 0 = normal phone profile; Secure Folder runs as another user (usually 150). */
              fun userId(): Int = Process.myUid() / 100000
              fun inMain(): Boolean = userId() == 0

              fun slotComponent(c: Context, i: Int) = ComponentName(c.packageName, "com.sfwidget.Slot$i")

              /** The 4 "SF Button" launcher entries are needed only in the Secure Folder copy; hide them on the normal phone. */
              fun syncAliases(c: Context) {
                  val state = if (inMain()) PackageManager.COMPONENT_ENABLED_STATE_DISABLED
                              else PackageManager.COMPONENT_ENABLED_STATE_ENABLED
                  for (i in 0 until 4) try {
                      c.packageManager.setComponentEnabledSetting(slotComponent(c, i), state, PackageManager.DONT_KILL_APP)
                  } catch (_: Exception) {}
              }

              fun otherProfiles(c: Context): List<UserHandle> = try {
                  c.getSystemService(LauncherApps::class.java).profiles.filter { it != Process.myUserHandle() }
              } catch (_: Exception) { emptyList() }

              /** Apps of Secure Folder, when the system lets this app see them (empty otherwise). */
              fun otherApps(c: Context): List<Pair<UserHandle, LauncherActivityInfo>> {
                  val la = c.getSystemService(LauncherApps::class.java)
                  return otherProfiles(c).flatMap { u ->
                      try { la.getActivityList(null, u).map { u to it } } catch (_: Exception) { emptyList() }
                  }.filter { it.second.componentName.packageName != c.packageName }
              }

              private fun twinProfiles(c: Context): List<UserHandle> =
                  if (Build.VERSION.SDK_INT >= 28) try { c.getSystemService(CrossProfileApps::class.java).targetUserProfiles }
                  catch (_: Exception) { emptyList() } else emptyList()

              /** Icon for a picked package: the Secure Folder app's own icon if visible, else the normal-phone install's icon. */
              fun icon(c: Context, pkg: String): Drawable {
                  otherApps(c).firstOrNull { it.second.componentName.packageName == pkg }?.let {
                      try { return it.second.getIcon(0) } catch (_: Exception) {}
                  }
                  return try { c.packageManager.getApplicationIcon(pkg) }
                  catch (_: Exception) { c.getDrawable(android.R.drawable.sym_def_app_icon)!! }
              }

              /** Name of a picked package, from Secure Folder or the normal phone. */
              fun name(c: Context, pkg: String): String {
                  if (pkg.isEmpty()) return "empty"
                  otherApps(c).firstOrNull { it.second.componentName.packageName == pkg }?.let { return it.second.label.toString() }
                  return try { c.packageManager.getApplicationLabel(c.packageManager.getApplicationInfo(pkg, 0)).toString() }
                  catch (_: Exception) { pkg }
              }

              /**
               * Called from the widget tap (normal phone). Tries, in order:
               * 1. Direct: the system lets us see Secure Folder's apps -> start the picked app there.
               * 2. Twin: this same app is installed inside Secure Folder -> start its "SF Button" entry, which opens the app.
               * 3. Fallback: open Secure Folder itself.
               * Returns a message only when it could not open the app.
               */
              fun open(a: Activity, i: Int): String? {
                  val pkg = Prefs.slotPkg(a, i)
                  val la = a.getSystemService(LauncherApps::class.java)
                  otherApps(a).firstOrNull { it.second.componentName.packageName == pkg }?.let { (u, info) ->
                      try { la.startMainActivity(info.componentName, u, null, null); return null } catch (_: Exception) {}
                  }
                  if (Build.VERSION.SDK_INT >= 28) {
                      val cpa = a.getSystemService(CrossProfileApps::class.java)
                      for (u in twinProfiles(a)) {
                          try { cpa.startMainActivity(slotComponent(a, i), u); return null } catch (_: Exception) {}
                      }
                  }
                  val sf = a.packageManager.getLaunchIntentForPackage(SF_PKG)
                  if (sf != null) {
                      a.startActivity(sf.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      return "Could not reach the app in Secure Folder directly. Install Secure Folder Widget inside Secure Folder too."
                  }
                  return "Secure Folder not found"
              }

              /** For the "Test Secure Folder link" button. */
              fun diag(c: Context): String {
                  val sb = StringBuilder()
                  sb.append("This copy runs in: ").append(if (inMain()) "normal phone (user 0)" else "Secure Folder (user ${userId()})").append("\n\n")
                  val apps = otherApps(c)
                  sb.append("Direct way - other profiles visible: ${otherProfiles(c).size}, apps seen there: ${apps.size}\n")
                  for (i in 0 until 4) {
                      val pkg = Prefs.slotPkg(c, i)
                      if (pkg.isEmpty()) continue
                      val seen = apps.any { it.second.componentName.packageName == pkg }
                      sb.append("  Button ${i + 1} ${name(c, pkg)}: ${if (seen) "found in Secure Folder" else "not seen"}\n")
                  }
                  val tp = twinProfiles(c)
                  sb.append("\nTwin way - profiles with this app installed: ${tp.size}\n\n")
                  sb.append(when {
                      !inMain() -> "This is the Secure Folder copy. Pick the same 4 apps here (needed only for the twin way)."
                      apps.isNotEmpty() -> "OK: buttons open Secure Folder apps directly."
                      tp.isNotEmpty() -> "OK: buttons go through the copy inside Secure Folder. Pick the same 4 apps in that copy."
                      else -> "Not linked yet. Install this same APK inside Secure Folder, open it there once, pick the apps, then test again."
                  })
                  return sb.toString()
              }
          }
          END_OF_FILE_X

