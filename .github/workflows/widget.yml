          cat > 'app/src/main/java/com/btcwidget/UpdateService.kt' <<'END_OF_FILE_X'
          package com.btcwidget

          import android.app.*
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.drawable.Drawable
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder
          import android.util.TypedValue
          import android.view.View
          import android.widget.RemoteViews
          import androidx.core.graphics.drawable.toBitmap
          import java.util.Locale
          import java.util.concurrent.Callable
          import java.util.concurrent.Executors
          import java.util.concurrent.Future
          import java.util.concurrent.TimeUnit

          class UpdateService : Service() {
              companion object {
                  /** Lock tick box: ticked (green) = trade buttons work; empty (grey) = buttons do nothing. */
                  fun showLock(rv: RemoteViews, on: Boolean) {
                      rv.setTextViewText(R.id.mlock, if (on) "☑ Lock" else "☐ Lock")
                      rv.setTextColor(R.id.mlock, if (on) 0xFF4CD964.toInt() else 0xFFAAAAAA.toInt())
                  }
              }

              private val pool = Executors.newFixedThreadPool(16)
              private val loop = Executors.newScheduledThreadPool(4)
              private var started = false

              /** 4 rows x 6 icon places (btn1..btn24); the 12 apps are laid out in as many per row as the widget width allows. */
              private fun place(n: Int) = resources.getIdentifier("btn$n", "id", packageName)
              private fun rowId(r: Int) = resources.getIdentifier("row$r", "id", packageName)

              /** How many app icons fit in one row at the widget's current width (max 6). */
              private fun iconsPerRow(): Int {
                  val m = AppWidgetManager.getInstance(this)
                  val id = ids().firstOrNull() ?: return 6
                  val w = m.getAppWidgetOptions(id).getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 0)
                  if (w <= 0) return 6
                  return ((w - 16) / 50).coerceIn(2, 6)
              }

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("w", "Widget refresh", NotificationManager.IMPORTANCE_MIN))
                  val n = Notification.Builder(this, "w").setContentTitle("Stock Widget running")
                      .setSmallIcon(android.R.drawable.ic_dialog_info).build()
                  if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(1, n)
              }

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  initWidget()
                  if (!started) {
                      started = true
                      // three independent loops: a slow ADX / gold / Nifty request can never delay the PnL
                      loop.scheduleWithFixedDelay({ try { fastTick() } catch (_: Throwable) {} }, 0, 500, TimeUnit.MILLISECONDS)
                      loop.scheduleWithFixedDelay({ try { adxTick() } catch (_: Throwable) {} }, 0, 1500, TimeUnit.MILLISECONDS)
                      loop.scheduleWithFixedDelay({ try { extraTick() } catch (_: Throwable) {} }, 0, 1000, TimeUnit.MILLISECONDS)
                      loop.scheduleWithFixedDelay({ try { sfTick() } catch (_: Throwable) {} }, 0, 1000, TimeUnit.MILLISECONDS)
                  }
                  return START_STICKY
              }

              private fun ids() = AppWidgetManager.getInstance(this)
                  .getAppWidgetIds(ComponentName(this, WidgetProvider::class.java))

              private fun icon(pkg: String): Bitmap {
                  val d: Drawable = try { packageManager.getApplicationIcon(pkg) }
                  catch (e: Exception) { getDrawable(android.R.drawable.sym_def_app_icon)!! }
                  return d.toBitmap(96, 96)
              }

              private fun open(code: Int, pkg: String): PendingIntent? {
                  val i = packageManager.getLaunchIntentForPackage(pkg) ?: return null
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return PendingIntent.getActivity(this, code, i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
              }

              /** Full update: icons + click targets. Text is refreshed by tick(). */
              private fun initWidget() {
                  val rv = RemoteViews(packageName, R.layout.widget)
                  Prefs.migrateSlots(this)
                  val pkgs = Prefs.SLOT_KEYS.map { Prefs.str(this, it) }
                  val last = pkgs.indexOfLast { it.isNotEmpty() }      // trailing empty slots take no space
                  val cols = iconsPerRow()
                  for (n in 1..24) rv.setViewVisibility(place(n), View.GONE)
                  val used = BooleanArray(5)
                  for (i in 0..last) {
                      val r = i / cols; val c = i % cols
                      if (r > 3) break
                      val v = place(r * 6 + c + 1)
                      used[r + 1] = true
                      val pkg = pkgs[i]
                      if (pkg.isEmpty()) { rv.setViewVisibility(v, View.INVISIBLE); continue }
                      rv.setViewVisibility(v, View.VISIBLE)
                      rv.setImageViewBitmap(v, icon(pkg))
                      open(10 + i, pkg)?.let { rv.setOnClickPendingIntent(v, it) }
                  }
                  for (r in 1..4) rv.setViewVisibility(rowId(r), if (used[r]) View.VISIBLE else View.GONE)
                  rv.setOnClickPendingIntent(R.id.idxbtn, PendingIntent.getActivity(this, 4,
                      Intent(this, IndexActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK), PendingIntent.FLAG_IMMUTABLE))
                  rv.setOnClickPendingIntent(R.id.chartbtn, PendingIntent.getActivity(this, 5,
                      Intent(this, ChartLaunch::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK), PendingIntent.FLAG_IMMUTABLE))
                  showLock(rv, Prefs.armed(this))
                  rv.setOnClickPendingIntent(R.id.mlock, PendingIntent.getBroadcast(this, 30,
                      Intent(this, WidgetProvider::class.java).setAction(Prefs.ACTION_LOCK),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT))
                  for ((i, pair) in listOf(R.id.mle to "le", R.id.mlx to "lx", R.id.mse to "se", R.id.msx to "sx").withIndex()) {
                      rv.setOnClickPendingIntent(pair.first, PendingIntent.getActivity(this, 20 + i,
                          Intent(this, ManualActivity::class.java).putExtra("k", pair.second).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT))
                  }
                  rv.setOnClickPendingIntent(R.id.stratbtn, PendingIntent.getActivity(this, 6,
                      Intent(this, ChartLaunch::class.java).putExtra("k", "stratlink").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK), PendingIntent.FLAG_IMMUTABLE))
                  AppWidgetManager.getInstance(this).updateAppWidget(ids(), rv)
                  com.btcwidget.tt.TtService.start(this)   // puts the Tradetron lines back after the full redraw
              }

              private fun <T> async(f: () -> T): Future<T?> = pool.submit(Callable<T?> { try { f() } catch (e: Exception) { null } })

              /** Relay first (fixed IP); if it fails and a direct key is saved, try direct. */
              @Volatile private var pnlErr2 = ""

              /** Same as before, for one account. sfx = "" for the main account, "2" for the Secure Folder account. */
              private fun fetchPnl(key: String, sec: String, relay: String, rtok: String, sfx: String = ""): Pair<Double, Int>? {
                  val mode = Prefs.str(this, "pnlsrc$sfx").lowercase()
                  val fee = Prefs.str(this, "fee$sfx").lowercase()
                  val rate = Prefs.rate(this)
                  fun setErr(m: String) { if (sfx.isEmpty()) Delta.pnlErr = m else pnlErr2 = m }
                  val direct = key.isNotEmpty() && sec.isNotEmpty()
                  if (relay.isEmpty() && !direct) { setErr(if (sfx.isEmpty()) "add relay or API key in app" else "add 2nd account key in app"); return null }
                  try {
                      val r = Delta.pnl(key, sec, relay, rtok, mode, fee, rate); setErr(""); return r
                  } catch (e: Exception) {
                      if (relay.isNotEmpty() && direct) {
                          try { val r = Delta.pnl(key, sec, "", "", mode, fee, rate); setErr(""); return r }
                          catch (e2: Exception) { setErr(e2.message ?: e2.javaClass.simpleName); return null }
                      }
                      setErr(e.message ?: e.javaClass.simpleName)
                      return null
                  }
              }

              /** Writes one account's PnL and position count into the given text views. */
              private fun showPnl(rv: RemoteViews, pnlId: Int, posId: Int, pnl: Pair<Double, Int>?, err: String) {
                  val L = Locale.US
                  val ts = Prefs.tsize(this).toFloat()
                  rv.setTextViewTextSize(pnlId, TypedValue.COMPLEX_UNIT_SP, ts + 2f)
                  rv.setTextViewTextSize(posId, TypedValue.COMPLEX_UNIT_SP, ts)
                  if (pnl == null) {
                      rv.setTextViewText(pnlId, "PnL: " + err.ifEmpty { "--" }); rv.setTextColor(pnlId, 0xFFAAAAAA.toInt())
                      rv.setTextViewText(posId, "Pos --")
                  } else {
                      val rate = Prefs.rate(this)
                      val v = if (rate > 0) pnl.first * rate else pnl.first
                      val sym = if (rate > 0) "" else "$"   // rupees: no symbol; dollars: $
                      rv.setTextViewText(pnlId, String.format(L, "PnL %s%s%,.2f", if (v < 0) "-" else "+", sym, Math.abs(v)))
                      rv.setTextColor(pnlId, if (v >= 0) 0xFF4CD964.toInt() else 0xFFFF5A5F.toInt())
                      rv.setTextViewText(posId, "Pos ${pnl.second}")
                  }
              }

              private fun <T> Future<T?>.res(): T? = try { get(6, TimeUnit.SECONDS) } catch (_: Exception) { null }

              private fun update(rv: RemoteViews) = AppWidgetManager.getInstance(this).partiallyUpdateAppWidget(ids(), rv)

              /** BTC price + PnL + positions. Repeats as fast as Delta answers. */
              private fun fastTick() {
                  val key = Prefs.str(this, "key"); val sec = Prefs.str(this, "secret")
                  val relay = Prefs.str(this, "relay"); val rtok = Prefs.str(this, "rtoken")
                  val p = async { Delta.price() }
                  val n = async { fetchPnl(key, sec, relay, rtok) }
                  val price = p.res(); val pnl = n.res()
                  val rv = RemoteViews(packageName, R.layout.widget)
                  val L = Locale.US
                  rv.setInt(R.id.bg, "setImageAlpha", Prefs.alpha(this))
                  rv.setTextViewText(R.id.price, if (price == null) "BTC --" else String.format(L, "BTC %,.1f", price))
                  showPnl(rv, R.id.pnl, R.id.pos, pnl, Delta.pnlErr)
                  update(rv)
              }

              /** Secure Folder account PnL (own loop, every second like the old Secure Folder widget, so it never slows the main PnL). */
              private fun sfTick() {
                  val pnl2 = fetchPnl(Prefs.str(this, "key2"), Prefs.str(this, "secret2"),
                      Prefs.str(this, "relay2"), Prefs.str(this, "rtoken2"), "2")
                  val rv = RemoteViews(packageName, R.layout.widget)
                  showPnl(rv, R.id.pnl2, R.id.pos2, pnl2, pnlErr2)
                  update(rv)
              }

              /** ADX for the chosen timeframes. */
              private fun adxTick() {
                  val tfs = Prefs.tfs(this)
                  val a = tfs.map { tf -> async { val (h, l, c) = Delta.candles(tf); Adx.calc(h, l, c)?.first } }
                  val vals = tfs.zip(a.map { it.res() })
                  val rv = RemoteViews(packageName, R.layout.widget)
                  rv.setTextViewTextSize(R.id.adx, TypedValue.COMPLEX_UNIT_SP, Prefs.tsize(this).toFloat())
                  rv.setTextViewText(R.id.adx, "ADX " + vals.joinToString(" | ") { (tf, v) ->
                      if (v == null) "$tf --" else String.format(Locale.US, "%s %.1f", tf, v) })
                  update(rv)
              }

              /** Nifty next to BTC; Gold, Silver and Gift are polled too so their own previous-day record stays current. */
              private fun extraTick() {
                  val specs = listOf("NIFTY", "GOLD", "SILVER", "GIFT")
                  val x = specs.map { sp -> async { Delta.priceFor(sp) } }
                  val vals = x.map { it.res() }
                  specs.zip(vals).forEach { (sp, v) -> if (v != null) Prefs.refPrev(this, sp, v) }
                  val rv = RemoteViews(packageName, R.layout.widget)
                  rv.setTextViewText(R.id.nifty, vals[0]?.let { String.format(Locale.US, "Nifty %,.0f", it) } ?: "Nifty --")
                  update(rv)
              }

              override fun onDestroy() { loop.shutdownNow(); pool.shutdownNow(); super.onDestroy() }
          }
          END_OF_FILE_X

