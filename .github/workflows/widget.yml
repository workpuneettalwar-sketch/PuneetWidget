          package com.btcwidget

          import android.app.Activity
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.util.Locale
          import java.util.concurrent.Executors

          /** Pop-up opened from the widget's INDICES button: every index with change vs the previous session. */
          class IndexActivity : Activity() {
              private val names = ArrayList<Pair<String, String>>().apply { addAll(listOf(
                  "Nifty 50" to "NIFTY", "Bank Nifty" to "BANKNIFTY", "Gift Nifty" to "GIFT", "Midcap 100" to "MIDCAP", "Smallcap 100" to "SMALL", "India VIX" to "VIX",
                  "BTC" to "BTC", "ETH" to "ETH", "XAUUSD" to "XAU", "Gold" to "GOLD", "Silver" to "SILVER",
                  "Dow Jones" to "DOW", "Nasdaq" to "NASDAQ", "Crude Oil" to "CRUDE")) }
              private val srcs = java.util.concurrent.ConcurrentHashMap<Int, String>()
              private val pool = Executors.newFixedThreadPool(9)
              private val ui = Handler(Looper.getMainLooper())
              private val rows = ArrayList<Triple<TextView, TextView, TextView>>()
              @Volatile private var running = true
              private var foot: TextView? = null

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  names.add("USD/INR" to "USDINR")
                  val d = resources.displayMetrics.density
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding((16 * d).toInt(), (12 * d).toInt(), (16 * d).toInt(), (12 * d).toInt()) }
                  root.addView(TextView(this).apply { text = "Prices vs previous close"; textSize = 17f; setTypeface(null, Typeface.BOLD) })
                  for ((label, _) in names) {
                      val r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, (7 * d).toInt(), 0, (7 * d).toInt()) }
                      val a = TextView(this).apply { text = label; textSize = 15f; setTypeface(null, Typeface.BOLD) }
                      val p = TextView(this).apply { text = "--"; textSize = 15f; gravity = Gravity.END }
                      val c = TextView(this).apply { text = ""; textSize = 15f; gravity = Gravity.END; setTypeface(null, Typeface.BOLD) }
                      r.addView(a, LinearLayout.LayoutParams(0, -2, 1.1f))
                      r.addView(p, LinearLayout.LayoutParams(0, -2, 1.0f))
                      r.addView(c, LinearLayout.LayoutParams(0, -2, 1.5f))
                      root.addView(r)
                      rows.add(Triple(a, p, c))
                  }
                  foot = TextView(this).apply { textSize = 11f; setTextColor(Color.GRAY); setPadding(0, (8 * d).toInt(), 0, 0) }
                  root.addView(foot)
                  setContentView(root)
                  loop()
              }

              private fun loop() {
                  if (!running) return
                  for ((i, e) in names.withIndex()) {
                      val spec = e.second
                      pool.execute {
                          var price: Double? = null; var prev: Double? = null; var own = false
                          try {
                              val q = Delta.quote(spec); price = q.first; srcs[i] = q.second
                              prev = Delta.prevMap[spec] ?: Delta.prevFor(spec)
                              val ref = Prefs.refPrev(this, spec, price)
                              if (prev == null) { prev = ref; own = ref != null }
                          } catch (_: Exception) {}
                          val pr = price; val pv = prev; val o = own
                          ui.post { if (running) show(i, pr, pv, o) }
                      }
                  }
                  ui.postDelayed({ loop() }, 1000)
              }

              private fun show(i: Int, price: Double?, prev: Double?, own: Boolean) {
                  val (_, p, c) = rows[i]
                  if (price != null && prev != null) { /* shown below */ }
                  val spec = names[i].second
                  if (price == null) { p.text = "--"; c.text = ""; return }
                  val inr = Delta.isInr(spec)
                  val fx = spec == "USDINR"
                  p.text = if (fx) String.format(Locale.US, "₹%.2f", price) else if (inr) String.format(Locale.US, "₹%,.0f", price)
                           else if (price >= 10000) String.format(Locale.US, "%,.0f", price) else String.format(Locale.US, "%,.1f", price)
                  if (prev == null || prev <= 0.0) { c.text = "n/a"; c.setTextColor(Color.GRAY); return }
                  val diff = price - prev
                  val pct = diff / prev * 100.0
                  val pts = if (fx) String.format(Locale.US, "%+.2f", diff) else if (Math.abs(diff) >= 100) String.format(Locale.US, "%+,.0f", diff) else String.format(Locale.US, "%+,.1f", diff)
                  c.text = String.format(Locale.US, "%s (%+.2f%%)%s", pts, pct, if (own) "*" else "")
                  c.setTextColor(if (diff >= 0) Color.rgb(0, 150, 60) else Color.rgb(210, 40, 40))
                  foot?.text = "Sources: " + names.indices.joinToString(", ") { k -> names[k].second + "=" + (srcs[k] ?: "-") } +
                      "\n* change is vs the widget's own saved close of the previous day"
              }

              override fun onDestroy() { running = false; pool.shutdownNow(); super.onDestroy() }
          }
          END_OF_FILE_X

