          cat > 'app/src/main/assets/probe.js' <<'END_OF_FILE_X'
          (function () {
            if (window.__ttInit) return;
            window.__ttInit = true;

            var SET = { active: 1, liveentered: 1, livetranching: 1, paused: 1, blocked: 1, errorexecution: 1, error: 1,
              exitpending: 1, exited: 1, archived: 1, awaitingoneclick: 1 };
            function norm(s) { return String(s).toLowerCase().replace(/[^a-z]/g, ''); }
            function isStatus(v) { return typeof v === 'string' && v.length > 0 && v.length < 32 && SET[norm(v)] === 1; }

            function findStatus(o) {
              var k, v, k2;
              for (k in o) { v = o[k]; if (isStatus(v) && /status|state/i.test(k)) return v; }
              for (k in o) { v = o[k]; if (isStatus(v)) return v; }
              for (k in o) {
                v = o[k];
                if (v && typeof v === 'object' && !Array.isArray(v)) {
                  for (k2 in v) { if (isStatus(v[k2])) return v[k2]; }
                }
              }
              return null;
            }

            function findName(o) {
              var k, v, k2;
              for (k in o) { v = o[k]; if (typeof v === 'string' && /^(strategy_?name|template_?name|deployment_?name|name|title)$/i.test(k) && v.trim()) return v.trim(); }
              for (k in o) {
                v = o[k];
                if (v && typeof v === 'object' && !Array.isArray(v) && /template|strategy|deployment/i.test(k)) {
                  for (k2 in v) { if (typeof v[k2] === 'string' && /^(name|title|strategy_?name|template_?name)$/i.test(k2) && v[k2].trim()) return v[k2].trim(); }
                }
              }
              for (k in o) {
                v = o[k];
                if (typeof v === 'string' && v.length > 2 && v.length < 80 && /[a-z]/i.test(v) && !isStatus(v) &&
                    !/^https?:|^\d{4}-\d\d-\d\d|@/.test(v)) return v.trim();
              }
              return '';
            }

            function findSid(o) {
              var k, v;
              for (k in o) { v = o[k]; if (/^(sid|deployment_?id|deployed_?id)$/i.test(k) && (typeof v === 'number' || /^\d+$/.test(String(v)))) return String(v); }
              for (k in o) { v = o[k]; if (/^id$/i.test(k) && (typeof v === 'number' || /^\d+$/.test(String(v)))) return String(v); }
              return '';
            }

            function extract(j) {
              var best = null, bestCnt = 0, queue = [[j, 0]], seen = 0;
              while (queue.length && seen < 5000) {
                var it = queue.shift(), o = it[0], d = it[1];
                seen++;
                if (!o || typeof o !== 'object' || d > 7) continue;
                if (Array.isArray(o)) {
                  var cnt = 0;
                  for (var i = 0; i < o.length; i++) { if (o[i] && typeof o[i] === 'object' && !Array.isArray(o[i]) && findStatus(o[i])) cnt++; }
                  if (cnt > bestCnt && cnt >= Math.max(1, Math.floor(o.length / 2))) { best = o; bestCnt = cnt; }
                  for (var a = 0; a < o.length && a < 300; a++) queue.push([o[a], d + 1]);
                } else {
                  for (var k in o) queue.push([o[k], d + 1]);
                }
              }
              var rows = [];
              if (!best) return rows;
              for (var b = 0; b < best.length; b++) {
                var x = best[b];
                if (!x || typeof x !== 'object') continue;
                var s = findStatus(x);
                if (!s) continue;
                rows.push({ n: findName(x).slice(0, 60), s: s, id: findSid(x) });
              }
              return rows;
            }

            function countStatusLines(t) {
              var c = 0, ls = String(t).split('\n');
              for (var i = 0; i < ls.length; i++) if (isStatus(ls[i].trim())) c++;
              return c;
            }

            function domRows() {
              var out = [], seen = [], els = document.querySelectorAll('body *');
              for (var i = 0; i < els.length; i++) {
                var e = els[i];
                var t = (e.textContent || '').trim();
                if (!isStatus(t)) continue;
                var deeper = false;
                for (var c = 0; c < e.children.length; c++) { if ((e.children[c].textContent || '').trim() === t) { deeper = true; break; } }
                if (deeper) continue;
                if (e.closest('select,option,[role=option],[role=menu],[role=menuitem],[role=listbox],[role=tab],nav,header,button')) continue;
                if (e.getClientRects().length === 0) continue;
                var row = e.closest('tr');
                if (!row) {
                  row = e;
                  for (var d = 0; d < 10 && row.parentElement && row.parentElement !== document.body; d++) {
                    var p = row.parentElement, pt = p.innerText || '';
                    if (countStatusLines(pt) > 1 || pt.length > 700) break;
                    row = p;
                  }
                }
                if (seen.indexOf(row) >= 0) continue;
                seen.push(row);
                var all = row.innerText || '';
                var lines = all.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
                var name = '';
                for (var k = 0; k < lines.length; k++) {
                  var s = lines[k];
                  if (isStatus(s) || s.length < 3) continue;
                  if (/^[\d\s.,:+\-()%₹$]+$/.test(s)) continue;
                  if (/^(sid|live|offline|run|capital|p\s*&?\s*l|pnl|broker|multiplier|positions?|open|total|status|strategy)\b/i.test(s) && s.length < 16) continue;
                  name = s; break;
                }
                var m = all.match(/\b(9\d{8})\b/);
                out.push({ n: name.slice(0, 60), s: t, id: m ? m[1] : '' });
              }
              return out;
            }

            // ---- capture the dashboard's own data request so it can be repeated cheaply
            function consider(url, method, body, hdrs, text) {
              try {
                if (!text || text.length > 4000000) return;
                if (!/entered|exited|paused|active|error|blocked/i.test(text)) return;
                var j = JSON.parse(text);
                var rows = extract(j);
                if (rows.length && rows.length >= (window.__ttBest || 0) && (!method || /^get$/i.test(method) || typeof body === 'string')) {
                  window.__ttBest = rows.length;
                  window.__ttReq = { url: new URL(url, location.href).href, method: method || 'GET', body: body, hdrs: hdrs || {} };
                  window.__ttRows = rows;
                  window.__ttAt = Date.now();
                }
              } catch (e) {}
            }

            var of = window.fetch;
            window.__ttOrigFetch = of ? of.bind(window) : null;
            if (of) {
              window.fetch = function (input, init) {
                var url = (typeof input === 'string') ? input : (input && input.url);
                var m = (init && init.method) || (input && input.method) || 'GET';
                var b = init && init.body;
                var h = {};
                try {
                  var hh = (init && init.headers) || (input && input.headers);
                  if (hh) { if (hh.forEach) hh.forEach(function (v, k) { h[k] = v; }); else for (var k in hh) h[k] = hh[k]; }
                } catch (e) {}
                return of.apply(this, arguments).then(function (r) {
                  try { r.clone().text().then(function (t) { consider(url, m, typeof b === 'string' ? b : null, h, t); }); } catch (e) {}
                  return r;
                });
              };
            }

            var XP = XMLHttpRequest.prototype, XO = XP.open, XS = XP.send, XH = XP.setRequestHeader;
            XP.open = function (m, u) { this.__m = m; this.__u = u; this.__h = {}; return XO.apply(this, arguments); };
            XP.setRequestHeader = function (k, v) { try { if (this.__h) this.__h[k] = v; } catch (e) {} return XH.apply(this, arguments); };
            XP.send = function (b) {
              var x = this;
              try {
                x.addEventListener('load', function () {
                  try {
                    var t = (x.responseType === '' || x.responseType === 'text') ? x.responseText
                      : (x.responseType === 'json' ? JSON.stringify(x.response) : null);
                    consider(x.__u, x.__m, typeof b === 'string' ? b : null, x.__h, t);
                  } catch (e) {}
                });
              } catch (e) {}
              return XS.apply(this, arguments);
            };

            window.__ttTick = async function () {
              var res = { href: location.href };
              if (/login|signin|sign-in|register/i.test(location.pathname)) { res.login = true; return res; }
              var rows = null, src = '', q = window.__ttReq;
              if (q && q.url && window.__ttOrigFetch) {
                try {
                  var init = { method: q.method || 'GET', credentials: 'include', headers: q.hdrs || {} };
                  if (q.body && !/^get$/i.test(init.method)) init.body = q.body;
                  var r = await window.__ttOrigFetch(q.url, init);
                  if ((r.redirected && /login/i.test(r.url)) || r.status === 401 || r.status === 419) { res.login = true; return res; }
                  var t = await r.text();
                  rows = extract(JSON.parse(t));
                  if (rows.length) { src = 'api'; window.__ttRows = rows; window.__ttAt = Date.now(); }
                } catch (e) { res.apiErr = String(e).slice(0, 120); }
              }
              if (!rows || !rows.length) {
                rows = domRows(); src = 'page';
                if (!rows.length && window.__ttRows && Date.now() - (window.__ttAt || 0) < 20000) { rows = window.__ttRows; src = 'hook'; }
              }
              res.rows = rows; res.src = src; res.api = q ? q.url : '';
              return res;
            };
          })();
          END_OF_FILE_X

