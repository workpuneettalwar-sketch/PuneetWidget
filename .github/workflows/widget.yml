name: Build Stock Widget
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p merged-app && cd merged-app
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'END_OF_FILE_X'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.btcwidget"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.mergedapp"; minSdk = 26; targetSdk = 34
                  versionCode = (project.findProperty("verCode") as String?)?.toIntOrNull() ?: 1
                  versionName = "1.0"
              }
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"; keyAlias = "androiddebugkey"; keyPassword = "android"
                  }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.webkit:webkit:1.11.0")
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'END_OF_FILE_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>
              <application android:name=".App" android:label="@string/app_name" android:theme="@android:style/Theme.Material.Light.DarkActionBar">
                  <activity android:name=".SettingsActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".IndexActivity" android:exported="false"
                      android:theme="@android:style/Theme.DeviceDefault.Dialog" android:label="Indices"/>
                  <activity android:name=".ChartLaunch" android:exported="false" android:excludeFromRecents="true"
                      android:noHistory="true" android:taskAffinity="" android:theme="@android:style/Theme.NoDisplay"/>
                  <activity android:name=".tt.TtSettingsActivity" android:exported="false" android:label="Tradetron status"/>
                  <activity android:name=".tt.WebActivity" android:exported="false" android:label="Tradetron"
                      android:configChanges="orientation|screenSize|keyboardHidden"/>
                  <activity android:name=".tt.OpenActivity" android:exported="false" android:excludeFromRecents="true"
                      android:noHistory="true" android:taskAffinity="" android:theme="@android:style/Theme.NoDisplay"/>
                  <service android:name=".tt.TtService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="live Tradetron status watch"/>
                  </service>
                  <service android:name=".tt.TtService2" android:exported="false" android:process=":tt2"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="live Tradetron status watch (2nd account)"/>
                  </service>
                  <activity android:name=".tt.WebActivity2" android:exported="false" android:label="Tradetron - AT account"
                      android:process=":tt2" android:configChanges="orientation|screenSize|keyboardHidden"/>
                  <service android:name=".tt.TtListService" android:exported="false"
                      android:permission="android.permission.BIND_REMOTEVIEWS"/>
                  <activity android:name=".ManualActivity" android:exported="false" android:excludeFromRecents="true"
                      android:taskAffinity="" android:theme="@android:style/Theme.Translucent.NoTitleBar"/>
                  <receiver android:name=".WidgetProvider" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info"/>
                  </receiver>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
                  </receiver>
                  <service android:name=".UpdateService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="live widget refresh"/>
                  </service>
              </application>
          </manifest>
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/btcwidget'
          cat > 'app/src/main/java/com/btcwidget/Adx.kt' <<'END_OF_FILE_X'
          package com.btcwidget

          import kotlin.math.abs

          object Adx {
              /** Wilder ADX. Returns (ADX, +DI, -DI); includes the currently forming candle. */
              fun calc(h: List<Double>, l: List<Double>, c: List<Double>, n: Int = 14): Triple<Double, Double, Double>? {
                  if (c.size < 2 * n + 1) return null
                  var str = 0.0; var sp = 0.0; var sm = 0.0
                  var adx = 0.0; var pdi = 0.0; var mdi = 0.0
                  val dx = ArrayList<Double>()
                  for (i in 1 until c.size) {
                      val up = h[i] - h[i - 1]; val dn = l[i - 1] - l[i]
                      val pdm = if (up > dn && up > 0) up else 0.0
                      val mdm = if (dn > up && dn > 0) dn else 0.0
                      val tr = maxOf(h[i] - l[i], abs(h[i] - c[i - 1]), abs(l[i] - c[i - 1]))
                      if (i <= n) { str += tr; sp += pdm; sm += mdm }
                      else { str = str - str / n + tr; sp = sp - sp / n + pdm; sm = sm - sm / n + mdm }
                      if (i >= n) {
                          pdi = 100 * sp / str; mdi = 100 * sm / str
                          val d = 100 * abs(pdi - mdi) / (pdi + mdi).coerceAtLeast(1e-9)
                          if (dx.size < n) { dx.add(d); if (dx.size == n) adx = dx.average() }
                          else adx = (adx * (n - 1) + d) / n
                      }
                  }
                  return Triple(adx, pdi, mdi)
              }
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/btcwidget'
          cat > 'app/src/main/java/com/btcwidget/App.kt' <<'END_OF_FILE_X'
          package com.btcwidget

          import android.app.Application
          import android.os.Build
          import android.webkit.WebView

          /** Gives the ":tt2" process (AT Tradetron account) its own WebView storage, so its login never mixes with the main one. */
          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= 28) {
                      try { if (getProcessName().endsWith(":tt2")) WebView.setDataDirectorySuffix("tt2") } catch (_: Exception) {}
                  }
              }
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/btcwidget'
          cat > 'app/src/main/java/com/btcwidget/Delta.kt' <<'END_OF_FILE_X'
          package com.btcwidget

          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import javax.crypto.Mac
          import javax.crypto.spec.SecretKeySpec

          object Delta {
              const val BASE = "https://api.india.delta.exchange"
              const val SYMBOL = "BTCUSD"

              fun secs(tf: String) = when (tf) {
                  "1m" -> 60; "3m" -> 180; "5m" -> 300; "15m" -> 900; "30m" -> 1800; "1h" -> 3600; else -> 14400
              }

              private fun get(path: String, query: String, key: String?, secret: String?,
                              url: String? = null, token: String? = null): JSONObject {
                  val q = if (query.isEmpty()) "" else "?$query"
                  val c = URL(url ?: (BASE + path + q)).openConnection() as HttpURLConnection
                  c.connectTimeout = 3000; c.readTimeout = 3000
                  c.setRequestProperty("User-Agent", "btc-widget")
                  c.setRequestProperty("Accept", "application/json")
                  if (token != null) {
                      c.setRequestProperty("X-Token", token)
                  } else if (key != null && secret != null) {
                      val ts = (System.currentTimeMillis() / 1000).toString()
                      val mac = Mac.getInstance("HmacSHA256")
                      mac.init(SecretKeySpec(secret.toByteArray(), "HmacSHA256"))
                      val sig = mac.doFinal(("GET" + ts + path + q).toByteArray()).joinToString("") { "%02x".format(it) }
                      c.setRequestProperty("api-key", key)
                      c.setRequestProperty("timestamp", ts)
                      c.setRequestProperty("signature", sig)
                  }
                  val code = c.responseCode
                  val body = (if (code in 200..299) c.inputStream else c.errorStream).bufferedReader().readText()
                  c.disconnect()
                  val j = try { JSONObject(body) } catch (e: Exception) { throw Exception("HTTP $code") }
                  if (!j.optBoolean("success", true)) {
                      val e = j.optJSONObject("error")
                      var msg = e?.optString("code") ?: j.optString("error", "api error")
                      val ip = Regex("""\d{1,3}(\.\d{1,3}){3}""").find(e?.optJSONObject("context")?.toString() ?: "")?.value
                      if (ip != null) msg += " $ip"
                      throw Exception(msg)
                  }
                  return j
              }

              /** Previous-session reference prices gathered from the sources, keyed by spec (ETH, NIFTY ...). */
              val prevMap = java.util.concurrent.ConcurrentHashMap<String, Double>()
              private val tlPrev = ThreadLocal<Double?>()
              private val dprev = java.util.concurrent.ConcurrentHashMap<String, Double>()
              private val yprev = java.util.concurrent.ConcurrentHashMap<String, Double>()
              private val aprev = java.util.concurrent.ConcurrentHashMap<String, Double>()
              @Volatile private var nsePrev: Map<String, Double> = emptyMap()

              fun mark(sym: String): Double {
                  val r = get("/v2/tickers/$sym", "", null, null).getJSONObject("result")
                  val m = r.getString("mark_price").toDouble()
                  val pct = r.optString("mark_change_24h", "").toDoubleOrNull()
                  if (pct != null && pct > -99.0) dprev[sym] = m / (1 + pct / 100.0)
                  tlPrev.set(dprev[sym])
                  return m
              }

              fun price(): Double = mark(SYMBOL)

              // ---- Indian indices from angelone.in public pages (server-rendered; cached 3 s)
              private val icache = java.util.concurrent.ConcurrentHashMap<String, Pair<Long, Double>>()
              private val chgRe = Regex("""(\d{1,3}(?:,\d{2,3})*(?:\.\d+)?)\s*[+\-−]\s*[\d,]+(?:\.\d+)?\s*\(""")

              private fun indexText(slug: String): String {
                  val c = URL("https://www.angelone.in/indices/$slug").openConnection() as HttpURLConnection
                  c.connectTimeout = 4000; c.readTimeout = 4000
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36")
                  c.setRequestProperty("Accept", "text/html")
                  val html = c.inputStream.bufferedReader().readText()
                  c.disconnect()
                  return html.replace(Regex("(?is)<(script|style)[^>]*>.*?</\\1>"), " ")
                      .replace(Regex("(?s)<[^>]+>"), " ").replace("&nbsp;", " ").replace(Regex("\\s+"), " ")
              }

              private fun indexParse(text: String): Double? {
                  val i = text.indexOf("Price as of")
                  if (i > 0) {
                      val m = chgRe.findAll(text.substring(maxOf(0, i - 160), i)).lastOrNull()
                      m?.groupValues?.get(1)?.replace(",", "")?.toDoubleOrNull()?.let { return it }
                  }
                  return chgRe.find(text)?.groupValues?.get(1)?.replace(",", "")?.toDoubleOrNull()
              }

              fun indexPrice(slug: String): Double {
                  val now = System.currentTimeMillis()
                  icache[slug]?.let { if (now - it.first < 3000) { tlPrev.set(aprev[slug]); return it.second } }
                  val t = indexText(slug)
                  val v = indexParse(t) ?: throw Exception("price not found for $slug")
                  Regex("Previous\\s*Close\\D{0,12}([0-9][0-9,]*\\.?[0-9]*)", RegexOption.IGNORE_CASE).find(t)
                      ?.groupValues?.get(1)?.replace(",", "")?.toDoubleOrNull()?.let { aprev[slug] = it }
                  icache[slug] = Pair(now, v)
                  tlPrev.set(aprev[slug])
                  return v
              }

              // ---- NSE website (real time, one request returns every index; needs a session cookie)
              private const val UA = "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
              @Volatile private var nseCk: Pair<Long, String>? = null
              @Volatile private var nseData: Pair<Long, Map<String, Double>>? = null

              private fun httpGet(url: String, cookie: String?, referer: String? = null): Pair<String, String> {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 3000; c.readTimeout = 3000
                  c.setRequestProperty("User-Agent", UA)
                  c.setRequestProperty("Accept", "application/json, text/html, */*")
                  c.setRequestProperty("Accept-Language", "en-US,en;q=0.9")
                  if (referer != null) c.setRequestProperty("Referer", referer)
                  if (cookie != null) c.setRequestProperty("Cookie", cookie)
                  val body = c.inputStream.bufferedReader().readText()
                  val ck = c.headerFields.filterKeys { it != null && it.equals("Set-Cookie", true) }.values
                      .flatten().joinToString("; ") { it.substringBefore(';') }
                  c.disconnect()
                  return Pair(body, ck)
              }

              private fun nseCookie(): String {
                  val now = System.currentTimeMillis()
                  nseCk?.let { if (now - it.first < 240_000) return it.second }
                  val ck = httpGet("https://www.nseindia.com/", null).second
                  nseCk = Pair(now, ck)
                  return ck
              }

              private fun nseIndices(): Map<String, Double> {
                  val now = System.currentTimeMillis()
                  nseData?.let { if (now - it.first < 900) return it.second }
                  val body = try { httpGet("https://www.nseindia.com/api/allIndices", nseCookie(), "https://www.nseindia.com/").first }
                             catch (e: Exception) { nseCk = null; throw e }
                  val arr = JSONObject(body).getJSONArray("data")
                  val m = HashMap<String, Double>(); val pm = HashMap<String, Double>()
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      val v = o.optDouble("last", Double.NaN)
                      val pc = o.optDouble("previousClose", Double.NaN)
                      if (!v.isNaN()) m[o.optString("index").uppercase()] = v
                      if (!pc.isNaN() && pc > 0) pm[o.optString("index").uppercase()] = pc
                  }
                  nsePrev = pm
                  nseData = Pair(now, m)
                  return m
              }

              private fun nseIdx(name: String): Double {
                  val v = nseIndices()[name] ?: throw Exception("$name not in NSE data")
                  tlPrev.set(nsePrev[name])
                  return v
              }

              private fun nseGift(): Double {
                  val body = try { httpGet("https://www.nseindia.com/api/NextApi/apiClient?functionName=getGiftNifty", nseCookie(), "https://www.nseindia.com/").first }
                             catch (e: Exception) { nseCk = null; throw e }
                  val m = Regex("\"(?:LASTPRICE|lastPrice|LastTradedPrice|last)\"\\s*:\\s*\"?([0-9][0-9,]*\\.?[0-9]*)", RegexOption.IGNORE_CASE).find(body)
                      ?: throw Exception("gift price not in NSE reply")
                  return m.groupValues[1].replace(",", "").toDouble()
              }

              // ---- Yahoo Finance (unofficial, no key; cached 1 s)
              private val ycache = java.util.concurrent.ConcurrentHashMap<String, Pair<Long, Double>>()
              fun yahoo(sym: String): Double {
                  val now = System.currentTimeMillis()
                  ycache[sym]?.let { if (now - it.first < 1000) { tlPrev.set(yprev[sym]); return it.second } }
                  val u = "https://query1.finance.yahoo.com/v8/finance/chart/" + java.net.URLEncoder.encode(sym, "UTF-8") + "?interval=1d&range=5d"
                  val body = httpGet(u, null).first
                  val res = JSONObject(body).getJSONObject("chart").getJSONArray("result").getJSONObject(0)
                  val meta = res.getJSONObject("meta")
                  val v = meta.getDouble("regularMarketPrice")
                  // previous close from daily bars: if the newest bar is the session still in progress (started < 23 h
                  // before the latest quote), the previous close is the bar before it; otherwise it is the newest bar itself
                  try {
                      val rmt = meta.getLong("regularMarketTime")
                      val ts = res.getJSONArray("timestamp")
                      val cl = res.getJSONObject("indicators").getJSONArray("quote").getJSONObject(0).getJSONArray("close")
                      val last = ts.length() - 1
                      var i = if (rmt - ts.getLong(last) < 23 * 3600) last - 1 else last
                      while (i >= 0 && cl.isNull(i)) i--
                      if (i >= 0) { val pv = cl.getDouble(i); if (pv > 0) yprev[sym] = pv }
                  } catch (_: Exception) {}
                  tlPrev.set(yprev[sym])
                  ycache[sym] = Pair(now, v)
                  return v
              }

              /** Ordered list of sources for a spec; the first one that answers wins. */
              private fun sources(spec: String): List<Pair<String, () -> Double>> {
                  val s = spec.trim(); val low = s.lowercase()
                  return when (s.uppercase()) {
                      "BTC" -> listOf("Delta" to { mark("BTCUSD") })
                      "NASDAQ" -> listOf("Yahoo" to { yahoo("^IXIC") })
                      "DOW" -> listOf("Yahoo" to { yahoo("^DJI") })
                      "CRUDE" -> listOf("Yahoo" to { yahoo("CL=F") })
                      "ETH" -> listOf("Delta" to { mark("ETHUSD") })
                      "GOLD" -> listOf("bullions" to { bullion("24k") })
                      "SILVER" -> listOf("bullions" to { bullion("silver") })
                      "NIFTY" -> listOf("NSE" to { nseIdx("NIFTY 50") }, "Yahoo" to { yahoo("^NSEI") }, "Angel" to { indexPrice("nifty-50") })
                      "BANKNIFTY" -> listOf("NSE" to { nseIdx("NIFTY BANK") }, "Yahoo" to { yahoo("^NSEBANK") }, "Angel" to { indexPrice("nifty-bank") })
                      "MIDCAP" -> listOf("NSE" to { nseIdx("NIFTY MIDCAP 100") }, "Yahoo" to { yahoo("NIFTY_MIDCAP_100.NS") }, "Angel" to { indexPrice("nifty-midcap-100") })
                      "SMALL" -> listOf("NSE" to { nseIdx("NIFTY SMALLCAP 100") }, "Yahoo" to { yahoo("^CNXSC") }, "Angel" to { indexPrice("nifty-smallcap-100") })
                      "VIX" -> listOf("NSE" to { nseIdx("INDIA VIX") }, "Yahoo" to { yahoo("^INDIAVIX") }, "Angel" to { indexPrice("india-vix") })
                      "GIFT" -> listOf("NSE" to { nseGift() }, "Angel" to { indexPrice("gift-nifty") })
                      "XAU" -> listOf("Delta" to { mark("XAUUSD") }, "Yahoo" to { yahoo("GC=F") })
                      "USDINR" -> listOf("Yahoo" to { yahoo("INR=X") })
                      else -> when {
                          low.startsWith("bullions:") -> listOf("bullions" to { bullion(low.substring(9).trim()) })
                          low.startsWith("delta:") -> listOf("Delta" to { mark(s.substring(6).trim().uppercase()) })
                          low.startsWith("idx:") -> listOf("Angel" to { indexPrice(low.substring(4).trim()) })
                          low.startsWith("yahoo:") -> listOf("Yahoo" to { yahoo(s.substring(6).trim()) })
                          else -> listOf("Delta" to { mark(s.uppercase()) })
                      }
                  }
              }

              private val badUntil = java.util.concurrent.ConcurrentHashMap<String, Long>()

              /** Price and the name of the source that supplied it. A source that failed is skipped for 30 s. */
              fun quote(spec: String): Pair<Double, String> {
                  val list = sources(spec)
                  var last: Exception? = null
                  for ((i, src) in list.withIndex()) {
                      val key = spec.uppercase() + ":" + src.first
                      val skip = (badUntil[key] ?: 0L) > System.currentTimeMillis() && i < list.size - 1
                      if (skip) continue
                      try {
                          tlPrev.set(null)
                          val v = src.second()
                          val pv = tlPrev.get()
                          if (pv != null) prevMap[spec.uppercase()] = pv else prevMap.remove(spec.uppercase())
                          return Pair(v, src.first)
                      }
                      catch (e: Exception) { last = e; badUntil[key] = System.currentTimeMillis() + 30_000 }
                  }
                  throw last ?: Exception("no source for $spec")
              }

              fun priceFor(spec: String): Double = quote(spec).first

              /** Previous close from the first source that has one (used when the source that gave the price had none). */
              fun prevFor(spec: String): Double? {
                  for ((_, f) in sources(spec)) {
                      try { tlPrev.set(null); f(); tlPrev.get()?.let { if (it > 0) return it } } catch (_: Exception) {}
                  }
                  return null
              }

              /** For the "Test indices" button: every source of every built-in, tried one by one. */
              fun indexDebug(): String {
                  val sb = StringBuilder()
                  for (spec in listOf("NIFTY", "BANKNIFTY", "GOLD", "ETH", "SILVER", "MIDCAP", "SMALL", "GIFT", "VIX", "XAU", "NASDAQ", "DOW", "CRUDE", "USDINR")) {
                      sb.append(spec).append(": ")
                      val parts = sources(spec).map { (n, f) ->
                          try { tlPrev.set(null); val v = f(); "$n=" + "%.1f".format(v) + (tlPrev.get()?.let { " (prev %.1f)".format(it) } ?: " (no prev)") } catch (e: Exception) { "$n=ERR(" + (e.message ?: e.javaClass.simpleName).take(40) + ")" }
                      }
                      sb.append(parts.joinToString("  ")).append("\n")
                  }
                  return sb.toString()
              }

              /** Prices from bullions.co.in are in rupees: show without decimals and with a rupee sign. */
              fun isInr(spec: String): Boolean = spec.trim().equals("GOLD", true) || spec.trim().equals("SILVER", true) || spec.trim().lowercase().startsWith("bullions:")

              // ---- bullions.co.in (read from the public web page; refreshed at most every 10 s)
              @Volatile private var bPage: Pair<Long, String>? = null
              private val numRe = Regex("""\d{1,3}(?:,\d{2,3})+(?:\.\d+)?|\d{4,}(?:\.\d+)?""")

              private class BSpec(val label: Regex, val lo: Double, val hi: Double)
              private val bspecs = mapOf(
                  "mcx" to BSpec(Regex("""Gold\W{1,6}India\W{1,4}MCX""", RegexOption.IGNORE_CASE), 30000.0, 1_000_000.0),
                  "24k" to BSpec(Regex("""Gold\W{1,4}24\W{0,3}(?:Karat|K)""", RegexOption.IGNORE_CASE), 30000.0, 1_000_000.0),
                  "22k" to BSpec(Regex("""Gold\W{1,4}22\W{0,3}(?:Karat|K)""", RegexOption.IGNORE_CASE), 30000.0, 1_000_000.0),
                  "silver" to BSpec(Regex("""Silver\W{1,6}India\W{1,4}MCX""", RegexOption.IGNORE_CASE), 30000.0, 5_000_000.0)
              )

              private fun bullionsText(): String {
                  val now = System.currentTimeMillis()
                  bPage?.let { if (now - it.first < 10_000) return it.second }
                  val c = URL("https://bullions.co.in/").openConnection() as HttpURLConnection
                  c.connectTimeout = 4000; c.readTimeout = 4000
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36")
                  c.setRequestProperty("Accept", "text/html")
                  val html = c.inputStream.bufferedReader().readText()
                  c.disconnect()
                  val text = html.replace(Regex("(?is)<(script|style)[^>]*>.*?</\\1>"), " ")
                      .replace(Regex("(?s)<[^>]+>"), " ")
                      .replace("&nbsp;", " ").replace("&#8377;", " ").replace("&amp;", "&")
                      .replace(Regex("\\s+"), " ")
                  bPage = Pair(now, text)
                  return text
              }

              private fun bullionsValue(text: String, spec: BSpec): Double? {
                  for (m in spec.label.findAll(text)) {
                      val win = text.substring(m.range.last + 1, minOf(text.length, m.range.last + 400))
                      for (n in numRe.findAll(win)) {
                          val v = n.value.replace(",", "").toDoubleOrNull() ?: continue
                          if (v >= spec.lo && v <= spec.hi) return v
                      }
                  }
                  return null
              }

              fun bullion(kind: String): Double {
                  val spec = bspecs[kind.lowercase()] ?: throw Exception("unknown bullions:$kind")
                  return bullionsValue(bullionsText(), spec) ?: throw Exception("not found on bullions.co.in")
              }

              /** For the "Test gold" button: what was read for each rate, plus the raw text near the label if it failed. */
              fun bullionsDebug(): String {
                  val text = bullionsText()
                  val sb = StringBuilder()
                  for ((k, spec) in bspecs) {
                      val v = bullionsValue(text, spec)
                      sb.append("bullions:$k -> ${v ?: "NOT FOUND"}\n")
                      if (v == null) {
                          val m = spec.label.find(text)
                          sb.append("   text near label: ").append(
                              if (m == null) "label not on page" else text.substring(m.range.first, minOf(text.length, m.range.last + 160))
                          ).append("\n")
                      }
                  }
                  return sb.toString()
              }


              @Volatile var pnlErr = ""

              private fun positions(relay: String, token: String, key: String, secret: String) =
                  (if (relay.isNotEmpty()) get("/positions", "", null, null, relay.trimEnd('/') + "/positions", token)
                   else get("/v2/positions/margined", "", key, secret)).getJSONArray("result")

              private fun num(o: org.json.JSONObject?, k: String): Double? = o?.optString(k, "")?.toDoubleOrNull()

              private fun symOf(p: org.json.JSONObject): String =
                  p.optString("product_symbol", "").ifEmpty { p.optJSONObject("product")?.optString("symbol") ?: "" }

              /** Own calculation: size x contract_value x (mark - entry). Null when any input is missing or implausible. */
              private fun recompute(p: org.json.JSONObject, size: Double): Double? {
                  val entry = num(p, "entry_price") ?: return null
                  if (entry <= 0.0) return null                      // an entry of 0 would turn PnL into the position's full value
                  val sym = symOf(p)
                  if (sym.isEmpty()) return null
                  val t = get("/v2/tickers/$sym", "", null, null).getJSONObject("result")
                  val cv = num(p.optJSONObject("product"), "contract_value") ?: num(t, "contract_value") ?: return null
                  val mark = num(t, "mark_price") ?: return null
                  return size * cv * (mark - entry)
              }

              /** One consistent source: the live own calculation. Delta's reported figure is only a fallback. */
              /** Fee setting: "" = none, "auto" = subtract the position's own commission field, number = rupees per open position. */
              @Volatile var feeMode = ""
              @Volatile var rateInr = 85.0
              private fun feeUsd(p: org.json.JSONObject, fee: String = feeMode, rate: Double = rateInr): Double {
                  if (fee.isEmpty()) return 0.0
                  if (fee == "auto") return Math.abs(num(p, "commission") ?: 0.0)
                  val inr = fee.toDoubleOrNull() ?: return 0.0
                  return inr / (if (rate > 0) rate else 85.0)
              }

              @Volatile var pnlMode = ""   // "" / "delta" = Delta's own figure first, "own" = own calculation first

              /**
               * Default: use Delta's own unrealized_pnl (exactly what its app shows, same server, same instant),
               * but fall back to the own calculation when it is missing or absurdly far from it (guards the old
               * "market value instead of PnL" problem). Mode "own" prefers the own calculation.
               */
              private fun pick(api: Double?, own: Double?, mode: String = pnlMode): Double {
                  // Delta's unrealized_pnl field turned out to be wrong for option positions, so the own calculation
                  // (size x contract value x (mark - entry)) is the default. Mode "delta" prefers Delta's field.
                  if (mode == "delta") return api ?: own ?: 0.0
                  return own ?: api ?: 0.0
              }

              /** Background threads for fetching all option prices at the same time. */
              private val fetchPool = java.util.concurrent.Executors.newCachedThreadPool { r -> Thread(r).apply { isDaemon = true } }

              /** PnL (USD) and number of open positions. */
              fun pnl(key: String, secret: String, relay: String = "", token: String = "",
                      mode: String = pnlMode, fee: String = feeMode, rate: Double = rateInr): Pair<Double, Int> {
                  val r = positions(relay, token, key, secret)
                  val jobs = ArrayList<Triple<org.json.JSONObject, Double, java.util.concurrent.Future<Double?>>>()
                  for (i in 0 until r.length()) {
                      val p = r.getJSONObject(i)
                      val size = p.optString("size", "0").toDoubleOrNull() ?: 0.0
                      if (size == 0.0) continue
                      // all prices are requested at the same moment, so the sum is one consistent snapshot
                      jobs.add(Triple(p, size, fetchPool.submit(java.util.concurrent.Callable<Double?> {
                          try { recompute(p, size) } catch (_: Exception) { null } })))
                  }
                  var sum = 0.0
                  for ((p, _, f) in jobs) {
                      val own = try { f.get(4, java.util.concurrent.TimeUnit.SECONDS) } catch (_: Exception) { null }
                      sum += pick(num(p, "unrealized_pnl"), own, mode) - feeUsd(p, fee, rate)
                  }
                  return Pair(sum, jobs.size)
              }

              /** Human-readable dump used by the "Test PnL" button in settings. */
              fun pnlDebug(key: String, secret: String, relay: String, token: String, rate: Double,
                           mode: String = pnlMode, fee: String = feeMode): String {
                  val r = positions(relay, token, key, secret)
                  val sb = StringBuilder()
                  var total = 0.0; var open = 0
                  for (i in 0 until r.length()) {
                      val p = r.getJSONObject(i)
                      val size = p.optString("size", "0").toDoubleOrNull() ?: 0.0
                      if (size == 0.0) continue
                      open++
                      val api = num(p, "unrealized_pnl")
                      val own = try { recompute(p, size) } catch (e: Exception) { null }
                      val used = pick(api, own, mode)
                      sb.append("${symOf(p)}  size=${p.optString("size")}  entry=${p.optString("entry_price")}\n")
                      sb.append("  Delta unrealized_pnl: ${api ?: "missing"}\n")
                      sb.append("  own calculation: ${own ?: "n/a"}\n")
                      sb.append("  commission field: ${p.optString("commission", "missing")}   fee applied: ${"%.4f".format(feeUsd(p, fee, rate))}\n")
                      sb.append("  used: $used   (Rs ${"%.2f".format(used * rate)})\n")
                      total += used - feeUsd(p, fee, rate)
                  }
                  if (open == 0) return "No open positions."
                  sb.append("\nTotal: $${"%.4f".format(total)}  x ${"%.2f".format(rate)} = Rs ${"%.2f".format(total * rate)}\n")
                  return sb.toString()
              }

              fun candles(tf: String): Triple<List<Double>, List<Double>, List<Double>> {
                  val now = System.currentTimeMillis() / 1000
                  val r = get("/v2/history/candles",
                      "resolution=$tf&symbol=$SYMBOL&start=${now - secs(tf) * 120}&end=$now", null, null).getJSONArray("result")
                  val rows = (0 until r.length()).map { r.getJSONObject(it) }.sortedBy { it.getLong("time") }
                  return Triple(rows.map { it.getDouble("high") }, rows.map { it.getDouble("low") }, rows.map { it.getDouble("close") })
              }
          }
          END_OF_FILE_X

