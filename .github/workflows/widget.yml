          mkdir -p 'app/src/main/java/com/btcwidget/tt'
          cat > 'app/src/main/java/com/btcwidget/tt/TtService.kt' <<'END_OF_FILE_X'
          package com.btcwidget.tt

          import android.annotation.SuppressLint
          import android.app.*
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Typeface
          import android.content.Context
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.widget.RemoteViewsService
          import com.btcwidget.R
          import com.btcwidget.WidgetProvider
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.text.SpannableStringBuilder
          import android.text.Spanned
          import android.text.style.ForegroundColorSpan
          import android.text.style.StyleSpan
          import android.util.TypedValue
          import android.view.View
          import android.webkit.CookieManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.RemoteViews
          import androidx.webkit.WebViewCompat
          import androidx.webkit.WebViewFeature
          import org.json.JSONArray
          import org.json.JSONObject

          open class TtService : Service() {
              companion object {
                  fun start(c: Context, action: String? = null) {
                      try {
                          val i = Intent(c, TtService::class.java)
                          if (action != null) i.action = action
                          c.startForegroundService(i)
                      } catch (_: Exception) {}
                      // 2nd (AT) account runs in its own process with its own Tradetron login
                      try {
                          if (Acct2.enabled(c)) {
                              val i = Intent(c, TtService2::class.java)
                              if (action == ACT_RELOAD) i.action = action
                              c.startForegroundService(i)
                          } else c.stopService(Intent(c, TtService2::class.java))
                      } catch (_: Exception) {}
                  }

                  /** Rows shown in the widget list (already filtered and sorted) and their text size. */
                  @Volatile var shown: List<Row> = emptyList()
                  @Volatile var shownTs = 13f
                  const val ACT_RELOAD = "com.btcwidget.tt.RELOAD"
                  const val ACT_STOP_SOUND = "com.btcwidget.tt.STOP_SOUND"
                  const val ACT_TEST = "com.btcwidget.tt.TEST"
                  const val ACT_RENDER = "com.btcwidget.tt.RENDER"
                  private const val CALL = "(function(){if(!window.__ttTick){return 'noinit';}" +
                      "window.__ttTick().then(function(r){TTB.report(JSON.stringify(r));})" +
                      ".catch(function(e){TTB.report(JSON.stringify({err:String(e)}));});return 'ok';})()"
              }

              private val h = Handler(Looper.getMainLooper())
              private var wv: WebView? = null
              private var probe = ""
              private var started = false
              private var lastLoad = 0L
              private var pending = false
              private var pendingAt = 0L
              private val prev = HashMap<String, String>()
              private val since = HashMap<String, Long>()
              private val alerted = HashMap<String, String>()
              private var staleAlerted = false
              private var loginAlerted = false
              private var tone: ToneGenerator? = null
              private var beepUntil = 0L
              private var startedAt = 0L
              private var lastSig = ""
              /** true only in TtService2 (the AT account): reads Tradetron, saves to a file, no widget drawing, no alerts. */
              protected open val acct2 = false
              private val prev2 = HashMap<String, String>()
              private val alerted2 = HashMap<String, String>()
              private val since2 = HashMap<String, Long>()
              private var at2LoginAlerted = false
              private var at2StaleAlerted = false

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("run", "Status refresh", NotificationManager.IMPORTANCE_MIN))
                  val ch = NotificationChannel("alert", "Tradetron alerts", NotificationManager.IMPORTANCE_HIGH)
                  ch.enableVibration(true)
                  ch.vibrationPattern = longArrayOf(0, 600, 300, 600, 300, 600)
                  ch.setBypassDnd(true)
                  ch.lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                  nm.createNotificationChannel(ch)
                  val n = Notification.Builder(this, "run")
                      .setContentTitle(if (acct2) "Stock Widget watching AT account" else "Stock Widget watching Tradetron")
                      .setSmallIcon(android.R.drawable.ic_dialog_info).build()
                  val nid = if (acct2) 8 else 7
                  if (Build.VERSION.SDK_INT >= 34) startForeground(nid, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(nid, n)
                  probe = try { assets.open("probe.js").bufferedReader().use { it.readText() } } catch (e: Exception) { "" }
                  startedAt = System.currentTimeMillis()
              }

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (!started) {
                      started = true
                      setupWebView()
                      loadDash()
                      h.postDelayed(loop, 3000)
                  }
                  when (i?.action) {
                      ACT_RELOAD -> { loginAlerted = false; loadDash() }
                      ACT_STOP_SOUND -> stopSound()
                      ACT_TEST -> if (!acct2) alert(3, "Tradetron test alert", "This is how a Tradetron error alert will look and sound.", true)
                  }
                  initWidget()
                  render()
                  return START_STICKY
              }

              // ---------------------------------------------------------------- web reader

              inner class Bridge {
                  @JavascriptInterface
                  fun report(json: String) { h.post { pending = false; try { handle(json) } catch (_: Throwable) {} } }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView() {
                  val w = WebView(this)
                  val s = w.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.userAgentString = s.userAgentString.replace("; wv", "")
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, true)
                  w.addJavascriptInterface(Bridge(), "TTB")
                  if (probe.isNotEmpty() && WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      try { WebViewCompat.addDocumentStartJavaScript(w, probe, setOf("*")) } catch (_: Exception) {}
                  }
                  w.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(v: WebView, url: String) { if (probe.isNotEmpty()) v.evaluateJavascript(probe, null) }
                  }
                  // give the page a phone-sized screen so it lays out normally while hidden
                  w.measure(View.MeasureSpec.makeMeasureSpec(1080, View.MeasureSpec.EXACTLY),
                      View.MeasureSpec.makeMeasureSpec(2200, View.MeasureSpec.EXACTLY))
                  w.layout(0, 0, 1080, 2200)
                  w.onResume()
                  w.resumeTimers()
                  wv = w
              }

              private fun loadDash() {
                  lastLoad = System.currentTimeMillis()
                  pending = false
                  wv?.loadUrl(Prefs.DASH)
              }

              private val loop = object : Runnable {
                  override fun run() {
                      try { tick() } catch (_: Throwable) {}
                      h.postDelayed(this, Prefs.interval(this@TtService) * 1000L)
                  }
              }

              private fun tick() {
                  val now = System.currentTimeMillis()
                  val reloadMs = when {
                      State.login -> 60_000L
                      State.src == "api" -> 15 * 60_000L
                      else -> Prefs.reload(this) * 1000L
                  }
                  if (now - lastLoad > reloadMs) loadDash()
                  else if (!pending || now - pendingAt > 20_000) {
                      pending = true; pendingAt = now
                      wv?.evaluateJavascript(CALL) { v ->
                          if (v != null && v.contains("noinit")) { pending = false; if (probe.isNotEmpty()) wv?.evaluateJavascript(probe, null) }
                      }
                  }
                  if (!acct2) checkStale(now)
                  render()
              }

              private fun handle(json: String) {
                  val o = JSONObject(json)
                  val now = System.currentTimeMillis()
                  State.href = o.optString("href")
                  if (o.optBoolean("login")) {
                      State.login = true
                      State.note = "Logged out - open the app and log in"
                      if (!acct2 && !loginAlerted && Prefs.alerts(this)) {
                          loginAlerted = true
                          alert(4, "Tradetron logged out", "Stock Widget can't see your strategies. Open the TT settings (gear on the TT line) and log in again.", true)
                      }
                      render(); return
                  }
                  if (o.has("err")) { State.note = o.optString("err").take(120); render(); return }
                  State.login = false
                  loginAlerted = false
                  val arr = o.optJSONArray("rows") ?: JSONArray()
                  val seen = HashSet<String>()
                  val rows = ArrayList<Row>()
                  for (k in 0 until arr.length()) {
                      val r = arr.optJSONObject(k) ?: continue
                      val row = Row(r.optString("n").trim(), r.optString("s").trim(), r.optString("id").trim())
                      if (row.status.isEmpty() || !seen.add(row.key + "|" + row.status)) continue
                      rows.add(row)
                  }
                  State.src = o.optString("src")
                  State.api = o.optString("api")
                  State.note = o.optString("apiErr")
                  if (rows.isEmpty()) {
                      if (State.note.isEmpty()) State.note = "page open, no strategies read yet"
                  } else {
                      State.rows = rows
                      State.lastOk = now
                      staleAlerted = false
                      if (!acct2) checkAlerts(rows, now)
                  }
                  render()
              }

              // ---------------------------------------------------------------- alerts

              private fun checkAlerts(rows: List<Row>, now: Long) {
                  val bad = ArrayList<String>()
                  val changes = ArrayList<String>()
                  for (r in rows) {
                      val k = r.key
                      val st = Status.norm(r.status)
                      val old = prev[k]
                      if (old != st) {
                          since[k] = now
                          prev[k] = st
                          // paused / un-paused strategies never notify
                          if (old != null && st != "paused" && old != "paused") changes.add("${r.name.ifEmpty { r.id }}: ${r.status}")
                      }
                      val dur = now - (since[k] ?: now)
                      val trigger = when {
                          Status.level(r.status) == Level.BAD -> true
                          st == "awaitingoneclick" -> true
                          st == "exitpending" && dur > 30_000 -> true
                          st == "livetranching" && dur > 60_000 -> true
                          else -> false
                      }
                      if (trigger) {
                          if (alerted[k] != st) { alerted[k] = st; bad.add("${r.name.ifEmpty { r.id }}: ${r.status}") }
                      } else alerted.remove(k)
                  }
                  if (!Prefs.alerts(this)) return
                  if (bad.isNotEmpty()) alert(2, "⚠ Tradetron: ${bad.size} need attention", bad.joinToString("\n"), true)
                  else if (changes.isNotEmpty() && Prefs.changeBeep(this)) alert(6, "Tradetron status changed", changes.joinToString("\n"), false)
              }

              /** AT account alerts: only for strategies that are NOT also deployed in the main account (those already alert once). */
              private fun checkAlerts2(snap: Acct2.Snap, rows2: List<Row>, now: Long) {
                  if (!Prefs.alerts(this)) return
                  if (snap.login) {
                      if (!at2LoginAlerted) { at2LoginAlerted = true; alert(10, "AT account logged out", "Open settings > Tradetron status > Log in to AT account.", true) }
                      return
                  }
                  at2LoginAlerted = false
                  if (snap.lastOk > 0 && now - snap.lastOk > 180_000) {
                      if (!at2StaleAlerted) { at2StaleAlerted = true; alert(11, "AT account not updating", "No fresh status from the AT Tradetron account for 3 minutes.", true) }
                  } else at2StaleAlerted = false
                  val mainNames = State.rows.map { it.name.trim().lowercase() }.toSet()
                  val bad = ArrayList<String>()
                  for (r in snap.rows) {
                      val k = r.key
                      val st = Status.norm(r.status)
                      if (prev2[k] != st) { since2[k] = now; prev2[k] = st }
                      val dur = now - (since2[k] ?: now)
                      val trigger = when {
                          Status.level(r.status) == Level.BAD -> true
                          st == "awaitingoneclick" -> true
                          st == "exitpending" && dur > 30_000 -> true
                          st == "livetranching" && dur > 60_000 -> true
                          else -> false
                      }
                      if (trigger) {
                          if (alerted2[k] != st) {
                              alerted2[k] = st
                              if (r.name.trim().lowercase() !in mainNames) bad.add("${r.name.ifEmpty { r.id }}: ${r.status}")
                          }
                      } else alerted2.remove(k)
                  }
                  if (bad.isNotEmpty()) alert(9, "⚠ AT account: ${bad.size} need attention", bad.joinToString("\n"), true)
              }

              private fun checkStale(now: Long) {
                  if (State.login || !Prefs.alerts(this)) return
                  val ref = if (State.lastOk > 0) State.lastOk else startedAt
                  if (now - ref > 180_000 && !staleAlerted) {
                      staleAlerted = true
                      alert(5, "Tradetron status not updating", "No fresh Tradetron status for 3 minutes. Check internet, or open the TT settings and log in.", true)
                  }
              }

              private fun openPi(code: Int): PendingIntent = PendingIntent.getActivity(this, code,
                  Intent(this, OpenActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                  PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)

              private fun alert(id: Int, title: String, text: String, loud: Boolean) {
                  val stop = PendingIntent.getService(this, 90 + id,
                      Intent(this, TtService::class.java).setAction(ACT_STOP_SOUND), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(this, "alert")
                      .setContentTitle(title).setContentText(text)
                      .setStyle(Notification.BigTextStyle().bigText(text))
                      .setSmallIcon(android.R.drawable.stat_sys_warning)
                      .setCategory(Notification.CATEGORY_ALARM)
                      .setAutoCancel(true)
                      .setContentIntent(openPi(70 + id))
                      .setDeleteIntent(stop)
                      .build()
                  getSystemService(NotificationManager::class.java).notify(id, n)
                  if (loud && Prefs.alarm(this)) playAlarm()
              }

              /** One shrill high-pitched double beep (not repeated: the error also shows on the widget). */
              private fun playAlarm() {
                  stopSound()
                  try {
                      tone = ToneGenerator(AudioManager.STREAM_ALARM, 100)
                      beepUntil = 0L
                      tone?.startTone(ToneGenerator.TONE_CDMA_HIGH_SS, 700)
                      h.postDelayed({ stopSound() }, 1200)
                  } catch (_: Exception) {}
              }

              private val beep = object : Runnable {
                  override fun run() {
                      val t = tone ?: return
                      if (System.currentTimeMillis() > beepUntil) { stopSound(); return }
                      try { t.startTone(ToneGenerator.TONE_CDMA_HIGH_SS, 700) } catch (_: Exception) {}
                      h.postDelayed(this, 1300)
                  }
              }

              private fun stopSound() {
                  h.removeCallbacks(beep)
                  try { tone?.stopTone() } catch (_: Exception) {}
                  try { tone?.release() } catch (_: Exception) {}
                  tone = null
              }

              // ---------------------------------------------------------------- widget

              private fun ids() = AppWidgetManager.getInstance(this)
                  .getAppWidgetIds(ComponentName(this, WidgetProvider::class.java))

              /** Only the Tradetron part of the Stock Widget (partial update, so prices / PnL are left alone). */
              private fun initWidget() {
                  if (acct2) return
                  val rv = RemoteViews(packageName, R.layout.widget)
                  rv.setOnClickPendingIntent(R.id.tthead, openPi(1))
                  rv.setOnClickPendingIntent(R.id.ttgear, PendingIntent.getActivity(this, 3,
                      Intent(this, com.btcwidget.SettingsActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK), PendingIntent.FLAG_IMMUTABLE))
                  rv.setRemoteAdapter(R.id.ttlist, Intent(this, TtListService::class.java))
                  rv.setPendingIntentTemplate(R.id.ttlist, PendingIntent.getActivity(this, 8,
                      Intent(this, OpenActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                      PendingIntent.FLAG_MUTABLE or PendingIntent.FLAG_UPDATE_CURRENT))
                  AppWidgetManager.getInstance(this).partiallyUpdateAppWidget(ids(), rv)
                  lastSig = ""
              }

              private fun age(ms: Long): String {
                  val s = ms / 1000
                  return if (s < 60) "${s}s" else if (s < 3600) "${s / 60}m" else "${s / 3600}h"
              }

              private fun sortRows(l: List<Row>): List<Row> {
                  val order = listOf(Level.BAD, Level.WARN, Level.LIVE, Level.IDLE, Level.DONE, Level.PAUSED)
                  var r = l
                  if (Prefs.hideExited(this)) r = r.filter { Status.level(it.status) != Level.DONE }
                  return r.sortedBy { order.indexOf(Status.level(it.status)) }
              }

              private fun render() {
                  if (acct2) { Acct2.write(this); return }
                  val rv = RemoteViews(packageName, R.layout.widget)
                  val now = System.currentTimeMillis()
                  val ts = Prefs.tsize(this).toFloat()
                  var rows = sortRows(State.rows)
                  val nBad = rows.count { Status.level(it.status) == Level.BAD }
                  val nWarn = rows.count { Status.level(it.status) == Level.WARN }
                  val stale = State.lastOk > 0 && now - State.lastOk > 60_000
                  val (head, col) = when {
                      State.login -> "PT  LOGIN NEEDED" to Status.color(Level.BAD)
                      State.lastOk == 0L -> "PT  connecting…" to Status.color(Level.IDLE)
                      stale -> "PT  NOT UPDATING" to Status.color(Level.BAD)
                      nBad > 0 -> "PT  ⚠ $nBad ERROR" to Status.color(Level.BAD)
                      nWarn > 0 -> "PT  ! $nWarn to check" to Status.color(Level.WARN)
                      else -> "PT  ✓" to Status.color(Level.LIVE)
                  }
                  // AT (2nd) account: header line + its strategies below the main ones (scroll down to see)
                  var headTxt = head; var headCol = col
                  if (Acct2.enabled(this)) {
                      val snap = Acct2.read(this)
                      val rows2 = sortRows(snap?.rows ?: emptyList())
                      val bad2 = rows2.count { Status.level(it.status) == Level.BAD }
                      val warn2 = rows2.count { Status.level(it.status) == Level.WARN }
                      val stale2 = snap != null && snap.lastOk > 0 && now - snap.lastOk > 60_000
                      val label = when {
                          snap == null || (snap.lastOk == 0L && !snap.login) -> "connecting…"
                          snap.login -> "LOGIN NEEDED"
                          stale2 -> "NOT UPDATING"
                          bad2 > 0 -> "⚠ $bad2 ERROR"
                          warn2 > 0 -> "! $warn2 to check"
                          else -> "✓"
                      }
                      rows = rows + Row("AT", label, Acct2.HDR) + rows2
                      if (snap != null && (snap.login || stale2 || bad2 > 0)) {
                          headTxt = "$head  · AT ⚠"; headCol = Status.color(Level.BAD)
                      }
                      if (snap != null) checkAlerts2(snap, rows2, now)
                  }
                  rv.setTextViewText(R.id.tthead, headTxt)
                  rv.setTextColor(R.id.tthead, headCol)
                  rv.setTextViewTextSize(R.id.tthead, TypedValue.COMPLEX_UNIT_SP, ts + 2f)
                  rv.setTextViewText(R.id.ttupd, if (State.lastOk == 0L) "" else age(now - State.lastOk))
                  rv.setTextViewTextSize(R.id.ttupd, TypedValue.COMPLEX_UNIT_SP, ts - 2f)
                  // list fills all the space the widget gives it (taller widget = more rows); the rest by scrolling
                  shown = rows; shownTs = ts
                  rv.setViewVisibility(R.id.ttlist, if (rows.isEmpty()) View.GONE else View.VISIBLE)
                  rv.setViewVisibility(R.id.ttempty, if (rows.isEmpty() && State.lastOk > 0) View.VISIBLE else View.GONE)
                  val sig = ts.toString() + "|" + rows.joinToString("|") { it.status + "~" + it.name + "~" + it.id }
                  if (sig != lastSig) {
                      lastSig = sig
                      AppWidgetManager.getInstance(this).notifyAppWidgetViewDataChanged(ids(), R.id.ttlist)
                  }
                  AppWidgetManager.getInstance(this).partiallyUpdateAppWidget(ids(), rv)
              }

              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  stopSound()
                  try { wv?.destroy() } catch (_: Exception) {}
                  super.onDestroy()
              }
          }

          /** Feeds the scrollable strategy list inside the widget. */
          class TtListService : RemoteViewsService() {
              override fun onGetViewFactory(i: Intent): RemoteViewsService.RemoteViewsFactory = object : RemoteViewsService.RemoteViewsFactory {
                  private var rows: List<Row> = emptyList()
                  private var ts = 13f
                  override fun onCreate() {}
                  override fun onDataSetChanged() { rows = TtService.shown; ts = TtService.shownTs }
                  override fun onDestroy() {}
                  override fun getCount() = rows.size
                  override fun getViewAt(p: Int): RemoteViews {
                      val rv = RemoteViews(packageName, R.layout.tt_row)
                      val r = rows.getOrNull(p) ?: return rv
                      if (r.id == Acct2.HDR) {
                          val c = when {
                              r.status.startsWith("✓") -> Status.color(Level.LIVE)
                              r.status.startsWith("!") -> Status.color(Level.WARN)
                              r.status.startsWith("connecting") -> Status.color(Level.IDLE)
                              else -> Status.color(Level.BAD)
                          }
                          val hb = SpannableStringBuilder("AT  " + r.status)
                          hb.setSpan(ForegroundColorSpan(c), 0, hb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                          hb.setSpan(StyleSpan(Typeface.BOLD), 0, hb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                          rv.setTextViewText(R.id.ttrow, hb)
                          rv.setTextViewTextSize(R.id.ttrow, TypedValue.COMPLEX_UNIT_SP, ts)
                          rv.setOnClickFillInIntent(R.id.ttrow, Intent())
                          return rv
                      }
                      val lv = Status.level(r.status)
                      val sb = SpannableStringBuilder()
                      sb.append(r.status)
                      sb.setSpan(ForegroundColorSpan(Status.color(lv)), 0, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      if (lv == Level.BAD || lv == Level.WARN) sb.setSpan(StyleSpan(Typeface.BOLD), 0, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      sb.append("  ")
                      sb.append(r.name.ifEmpty { r.id.ifEmpty { "?" } })
                      rv.setTextViewText(R.id.ttrow, sb)
                      rv.setTextViewTextSize(R.id.ttrow, TypedValue.COMPLEX_UNIT_SP, ts)
                      rv.setOnClickFillInIntent(R.id.ttrow, Intent())
                      return rv
                  }
                  override fun getLoadingView(): RemoteViews? = null
                  override fun getViewTypeCount() = 1
                  override fun getItemId(p: Int) = p.toLong()
                  override fun hasStableIds() = false
              }
          }

          /** Same watcher for the 2nd (AT) Tradetron account, in its own process ":tt2" so it has its own login. */
          class TtService2 : TtService() {
              override val acct2 = true
          }
          END_OF_FILE_X

