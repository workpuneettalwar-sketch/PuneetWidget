          package com.btcwidget

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.os.Bundle
          import android.widget.Toast
          import java.net.HttpURLConnection
          import java.net.URL

          /** Behind the 4 manual buttons: sends the saved Tradetron API link for that button (after an optional confirm). */
          class ManualActivity : Activity() {
              private val names = mapOf("le" to "LONG ENTER", "lx" to "LONG EXIT", "se" to "SHORT ENTER", "sx" to "SHORT EXIT")

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val k = intent.getStringExtra("k") ?: run { finish(); return }
                  // Lock box not ticked: the button stays dead
                  if (!Prefs.armed(this)) { finish(); return }
                  val name = names[k] ?: k
                  val link = Prefs.str(this, "link_$k")
                  if (link.isEmpty()) {
                      Toast.makeText(applicationContext, "Add the $name link in widget settings", Toast.LENGTH_LONG).show()
                      startActivity(Intent(this, SettingsActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      finish(); return
                  }
                  if (!Prefs.sp(this).getBoolean("mconfirm", true)) { send(name, link); finish(); return }
                  AlertDialog.Builder(this)
                      .setTitle("Send $name?")
                      .setMessage("This sends the $name command to Tradetron now.")
                      .setPositiveButton("SEND") { _, _ -> send(name, link) }
                      .setNegativeButton("Cancel", null)
                      .setOnDismissListener { finish() }
                      .show()
              }

              private fun send(name: String, link: String) {
                  val app = applicationContext
                  Toast.makeText(app, "Sending $name…", Toast.LENGTH_SHORT).show()
                  Thread {
                      val msg = try {
                          val c = URL(if (link.contains("://")) link else "https://$link").openConnection() as HttpURLConnection
                          c.connectTimeout = 10000; c.readTimeout = 15000
                          val code = c.responseCode
                          val body = try { (if (code < 400) c.inputStream else c.errorStream)?.bufferedReader()?.use { it.readText() } ?: "" } catch (_: Exception) { "" }
                          c.disconnect()
                          if (code in 200..299) "$name sent ✓ " + body.take(80) else "$name FAILED (HTTP $code) " + body.take(80)
                      } catch (e: Exception) { "$name FAILED: " + (e.message ?: e.javaClass.simpleName) }
                      android.os.Handler(android.os.Looper.getMainLooper()).post { Toast.makeText(app, msg, Toast.LENGTH_LONG).show() }
                  }.start()
              }
          }
          END_OF_FILE_X

