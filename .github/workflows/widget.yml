          package com.btcwidget

          import android.content.Context

          object Prefs {
              const val ACTION_CYCLE = "com.btcwidget.CYCLE"
              const val ACTION_LOCK = "com.btcwidget.LOCK"
              /** true when the Lock box is ticked = the 4 trade buttons are allowed to send. */
              fun armed(c: Context) = sp(c).getBoolean("armed", false)
              val TFS = listOf("1m", "3m", "5m", "15m", "30m", "1h", "4h")
              val SLOT_KEYS = listOf("tvpkg", "dpkg", "tpkg") + (4..12).map { "app$it" }

              /** Once: 12 button slots become 10 (5 per row). Apps already chosen keep their order, gaps are closed. */
              fun migrateSlots(c: Context) {
                  val p = sp(c)
                  if (p.getBoolean("slots10", false)) return
                  val used = SLOT_KEYS.map { p.getString(it, "") ?: "" }.filter { it.isNotEmpty() }.take(10)
                  val e = p.edit()
                  SLOT_KEYS.forEachIndexed { i, k -> e.putString(k, used.getOrElse(i) { "" }) }
                  e.putBoolean("slots10", true).apply()
              }

              fun sp(c: Context) = c.getSharedPreferences("w", Context.MODE_PRIVATE)
              fun alpha(c: Context) = sp(c).getInt("alpha", 180)
              fun tsize(c: Context) = sp(c).getInt("tsize", 15)
              fun tf(c: Context) = sp(c).getString("tf", "15m")!!
              fun str(c: Context, k: String) = sp(c).getString(k, "")!!.trim()
              /** Delta India's fixed USD-INR rate is 85. Blank = 85, type "usd" to show dollars, or any number to override. */
              fun rate(c: Context): Double {
                  val v = str(c, "rate")
                  return when {
                      v.isEmpty() -> 85.0
                      v.equals("usd", true) -> 0.0
                      else -> v.toDoubleOrNull() ?: 85.0
                  }
              }

              fun tfs(c: Context): List<String> {
                  val l = str(c, "tfs").split(",").map { it.trim() }.filter { it in TFS }.distinct().take(4)
                  return if (l.isEmpty()) listOf("5m", "15m", "1h") else l
              }

              val BUILTIN = listOf("NIFTY", "GOLD", "ETH", "SILVER", "MIDCAP", "SMALL", "GIFT", "VIX", "XAU")
              private val LABELS = mapOf("NIFTY" to "Nifty", "GOLD" to "Gold", "ETH" to "ETH", "SILVER" to "Silv", "MIDCAP" to "Mid",
                  "SMALL" to "Small", "GIFT" to "Gift", "VIX" to "VIX", "XAU" to "XAU")

              /** (label, spec) pairs shown under BTC: the built-ins, then up to 3 custom slots. */
              fun extras(c: Context): List<Pair<String, String>> {
                  // all six built-ins always show; the field only hides some ("-GIFT,-ETH") or everything ("none")
                  val s = str(c, "extras").uppercase()
                  val hide = s.split(",").map { it.trim().removePrefix("-") }.toSet()
                  val names = if (s == "NONE") emptyList() else BUILTIN.filter { it !in hide || !s.contains("-") }
                  val out = names.map { (LABELS[it] ?: it) to it }.toMutableList()
                  for (i in 1..3) {
                      val sym = str(c, "c${i}s")
                      if (sym.isNotEmpty()) out.add(str(c, "c${i}l").ifEmpty { sym.substringAfter(':').uppercase() } to sym)
                  }
                  return out
              }

              // ---- own record of the previous day's last price (fallback when a source gives no previous close)
              private class Ref(var day: String, var last: Double, var prev: Double, var saved: Long)
              private val refMem = java.util.concurrent.ConcurrentHashMap<String, Ref>()

              private fun today(): String = java.text.SimpleDateFormat("yyyyMMdd", java.util.Locale.US)
                  .apply { timeZone = java.util.TimeZone.getTimeZone("Asia/Kolkata") }.format(java.util.Date())

              fun refPrev(c: Context, spec: String, price: Double): Double? {
                  val k = spec.uppercase(); val day = today(); val p = sp(c); val now = System.currentTimeMillis()
                  val st = refMem.getOrPut(k) {
                      Ref(p.getString("rd_$k", "") ?: "", p.getString("rl_$k", "")?.toDoubleOrNull() ?: 0.0,
                          p.getString("rp_$k", "")?.toDoubleOrNull() ?: 0.0, 0L)
                  }
                  var save = now - st.saved > 30_000
                  if (st.day != day) { if (st.last > 0) st.prev = st.last; st.day = day; save = true }
                  st.last = price
                  if (save) { st.saved = now; p.edit().putString("rd_$k", st.day).putString("rl_$k", st.last.toString()).putString("rp_$k", st.prev.toString()).apply() }
                  return if (st.prev > 0) st.prev else null
              }
          }
          END_OF_FILE_X

