          package com.btcwidget

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class WidgetProvider : AppWidgetProvider() {
              override fun onUpdate(c: Context, m: AppWidgetManager, ids: IntArray) = start(c)
              override fun onEnabled(c: Context) = start(c)
              /** Widget resized: redraw so the app icons re-flow to the new width. */
              override fun onAppWidgetOptionsChanged(c: Context, m: AppWidgetManager, id: Int, o: android.os.Bundle) = start(c)

              override fun onReceive(c: Context, i: Intent) {
                  super.onReceive(c, i)
                  if (i.action == Prefs.ACTION_LOCK) {
                      val on = !Prefs.armed(c)
                      Prefs.sp(c).edit().putBoolean("armed", on).apply()
                      val m = AppWidgetManager.getInstance(c)
                      val rv = android.widget.RemoteViews(c.packageName, R.layout.widget)
                      UpdateService.showLock(rv, on)
                      m.partiallyUpdateAppWidget(m.getAppWidgetIds(android.content.ComponentName(c, WidgetProvider::class.java)), rv)
                  }
                  if (i.action == Prefs.ACTION_CYCLE) {
                      val next = Prefs.TFS[(Prefs.TFS.indexOf(Prefs.tf(c)) + 1) % Prefs.TFS.size]
                      Prefs.sp(c).edit().putString("tf", next).apply()
                  }
              }

              companion object {
                  fun start(c: Context) {
                      try { c.startForegroundService(Intent(c, UpdateService::class.java)) } catch (_: Exception) {}
                      com.btcwidget.tt.TtService.start(c)
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) = WidgetProvider.start(c)
          }
          END_OF_FILE_X

