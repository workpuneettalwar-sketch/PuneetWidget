              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          END_OF_FILE_X
          mkdir -p $(dirname 'gradle.properties')
          cat > 'gradle.properties' <<'END_OF_FILE_X'
          android.useAndroidX=true
          END_OF_FILE_X
          mkdir -p $(dirname 'gradle/wrapper/gradle-wrapper.properties')
          cat > 'gradle/wrapper/gradle-wrapper.properties' <<'END_OF_FILE_X'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          END_OF_FILE_X
          mkdir -p $(dirname 'settings.gradle.kts')
          cat > 'settings.gradle.kts' <<'END_OF_FILE_X'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BtcWidget"
          include(":app")
          END_OF_FILE_X
      - name: Build
        run: cd btc-widget && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: btc-widget-apk
          path: btc-widget/app/build/outputs/apk/debug/app-debug.apk
