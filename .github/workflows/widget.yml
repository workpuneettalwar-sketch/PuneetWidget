                                  android:paddingTop="4dp" android:paddingBottom="4dp" android:background="@drawable/red_btn"
                                  android:text="ENTER" android:textColor="#FFFFFF" android:textSize="11sp" android:textStyle="bold"
                                  android:singleLine="true"/>
                          </FrameLayout>
                          <FrameLayout android:layout_width="wrap_content" android:layout_height="0dp" android:layout_weight="1">
                              <TextView android:id="@+id/msx" android:layout_width="66dp" android:layout_height="wrap_content"
                                  android:layout_gravity="center_vertical" android:gravity="center"
                                  android:paddingTop="4dp" android:paddingBottom="4dp" android:background="@drawable/red_btn"
                                  android:text="EXIT" android:textColor="#FFFFFF" android:textSize="11sp" android:textStyle="bold"
                                  android:singleLine="true"/>
                          </FrameLayout>
                          <FrameLayout android:layout_width="wrap_content" android:layout_height="0dp" android:layout_weight="1">
                              <TextView android:id="@+id/stratbtn" android:layout_width="66dp" android:layout_height="wrap_content"
                                  android:layout_gravity="center_vertical" android:gravity="center"
                                  android:paddingTop="4dp" android:paddingBottom="4dp" android:background="@drawable/purple_btn"
                                  android:text="TT" android:textColor="#FFFFFF" android:textSize="11sp" android:textStyle="bold"
                                  android:singleLine="true"/>
                          </FrameLayout>
                          <FrameLayout android:layout_width="wrap_content" android:layout_height="0dp" android:layout_weight="1">
