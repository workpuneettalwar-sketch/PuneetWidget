          import android.webkit.CookieManager
          import android.webkit.WebView
          import android.webkit.WebViewClient

          /** Invisible screen behind a widget or alert tap: silences the alarm, then opens the Tradetron app. */
          class OpenActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  TtService.start(this, TtService.ACT_STOP_SOUND)
                  val pkg = Prefs.ttPkg(this)
                  val launch = if (pkg.isEmpty()) null else packageManager.getLaunchIntentForPackage(pkg)
                  try {
                      startActivity(launch?.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          ?: Intent(this, WebActivity::class.java).putExtra("url", Prefs.DASH).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (_: Exception) {}
                  finish()
              }
          }

          /** Tradetron website inside the app: used to log in (the watcher shares this login) and as a full control panel. */
          open class WebActivity : Activity() {
              private lateinit var w: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  title = "Tradetron"
                  w = WebView(this)
                  val s = w.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.builtInZoomControls = true
                  s.displayZoomControls = false
                  s.userAgentString = s.userAgentString.replace("; wv", "")
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, true)
                  w.webViewClient = WebViewClient()
                  setContentView(w)
                  w.loadUrl(intent.getStringExtra("url") ?: Prefs.DASH)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (w.canGoBack()) w.goBack() else super.onBackPressed()
