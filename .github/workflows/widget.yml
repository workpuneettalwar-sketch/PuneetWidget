          package com.btcwidget.tt

          import android.content.Context
          import android.content.Intent

          enum class Level { BAD, WARN, LIVE, IDLE, DONE, PAUSED }

          data class Row(val name: String, val status: String, val id: String) {
              val key: String get() = id.ifEmpty { name }
          }

          object Status {
              fun norm(s: String) = s.lowercase().filter { it in 'a'..'z' }

              fun level(s: String): Level = when (norm(s)) {
                  "errorexecution", "error", "blocked" -> Level.BAD
                  "exitpending", "awaitingoneclick", "livetranching" -> Level.WARN
                  "paused" -> Level.PAUSED
                  "liveentered" -> Level.LIVE
                  "exited", "archived" -> Level.DONE
                  else -> Level.IDLE
              }

              fun color(l: Level): Int = when (l) {
                  Level.BAD -> 0xFFFF5A5F.toInt()
                  Level.WARN -> 0xFFFFC145.toInt()
                  Level.LIVE -> 0xFF4CD964.toInt()
                  Level.IDLE -> 0xFFCFD8DC.toInt()
                  Level.DONE -> 0xFF78858C.toInt()
                  Level.PAUSED -> 0xFF78858C.toInt()
              }
          }

          /** Latest reading, shared between the service, the widget and the settings screen. */
          object State {
              @Volatile var rows: List<Row> = emptyList()
              @Volatile var lastOk = 0L
              @Volatile var src = ""
              @Volatile var login = false
              @Volatile var note = ""
              @Volatile var api = ""
              @Volatile var href = ""
          }

          object Prefs {
              const val DASH = "https://tradetron.tech/user/dashboard"
              const val LOGIN = "https://tradetron.tech/login"

              fun sp(c: Context) = c.getSharedPreferences("tt", Context.MODE_PRIVATE)
              fun str(c: Context, k: String) = sp(c).getString(k, "")!!.trim()
              fun interval(c: Context) = sp(c).getInt("interval", 5).coerceIn(2, 300)
              fun reload(c: Context) = sp(c).getInt("reload", 30).coerceIn(10, 3600)
              fun alpha(c: Context) = sp(c).getInt("alpha", 200)
              fun tsize(c: Context) = sp(c).getInt("tsize", 13)
              fun alerts(c: Context) = sp(c).getBoolean("alerts", true)
              fun alarm(c: Context) = sp(c).getBoolean("alarm", true)
              fun hideExited(c: Context) = sp(c).getBoolean("hideExited", true)
              fun changeBeep(c: Context) = sp(c).getBoolean("changeBeep", false)

              /** Package of the Tradetron app opened by a widget tap: the saved choice, else any installed app named tradetron. */
              fun ttPkg(c: Context): String {
                  val s = str(c, "ttpkg")
                  if (s == "-") return ""
                  if (s.isNotEmpty()) return s
                  return try {
                      val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      c.packageManager.queryIntentActivities(i, 0)
                          .map { it.activityInfo.packageName }
                          .firstOrNull { it.contains("tradetron", true) } ?: ""
                  } catch (e: Exception) { "" }
              }
          }

          /** The 2nd ("AT") Tradetron account: watched by TtService2 in its own process (own login), which saves its reading to a file. */
          object Acct2 {
              const val HDR = "__AT__"
              class Snap(val rows: List<Row>, val lastOk: Long, val login: Boolean, val note: String)

              fun enabled(c: Context) = Prefs.sp(c).getBoolean("acct2", false)
              private fun file(c: Context) = java.io.File(c.filesDir, "tt2.json")

              fun write(c: Context) {
                  try {
                      val o = org.json.JSONObject()
                      o.put("lastOk", State.lastOk); o.put("login", State.login); o.put("note", State.note)
                      val a = org.json.JSONArray()
                      for (r in State.rows) a.put(org.json.JSONObject().put("n", r.name).put("s", r.status).put("id", r.id))
                      o.put("rows", a)
                      val tmp = java.io.File(c.filesDir, "tt2.tmp")
                      tmp.writeText(o.toString())
                      tmp.renameTo(file(c))
                  } catch (_: Exception) {}
              }

              fun read(c: Context): Snap? = try {
                  val o = org.json.JSONObject(file(c).readText())
                  val a = o.optJSONArray("rows") ?: org.json.JSONArray()
                  val rows = (0 until a.length()).mapNotNull { a.optJSONObject(it) }
                      .map { Row(it.optString("n"), it.optString("s"), it.optString("id")) }
                  Snap(rows, o.optLong("lastOk"), o.optBoolean("login"), o.optString("note"))
              } catch (_: Exception) { null }
          }
