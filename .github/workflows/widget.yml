name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p btc-widget && cd btc-widget
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'END_OF_FILE_X'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.btcwidget"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.btcwidget"; minSdk = 26; targetSdk = 34
                  versionCode = (project.findProperty("verCode") as String?)?.toIntOrNull() ?: 1
                  versionName = "1.0"
              }
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"; keyAlias = "androiddebugkey"; keyPassword = "android"
                  }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.core:core-ktx:1.13.1") }
          END_OF_FILE_X

          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'END_OF_FILE_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>
              <application android:label="@string/app_name" android:theme="@android:style/Theme.Material.Light.DarkActionBar">
                  <activity android:name=".SettingsActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".WidgetProvider" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info"/>
                  </receiver>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
                  </receiver>
                  <service android:name=".UpdateService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="live widget refresh"/>
                  </service>
              </application>
          </manifest>
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/btcwidget'
          cat > 'app/src/main/java/com/btcwidget/Adx.kt' <<'END_OF_FILE_X'
          package com.btcwidget
          
          import kotlin.math.abs
          
          object Adx {
              /** Wilder ADX. Returns (ADX, +DI, -DI); includes the currently forming candle. */
              fun calc(h: List<Double>, l: List<Double>, c: List<Double>, n: Int = 14): Triple<Double, Double, Double>? {
                  if (c.size < 2 * n + 1) return null
                  var str = 0.0; var sp = 0.0; var sm = 0.0
                  var adx = 0.0; var pdi = 0.0; var mdi = 0.0
                  val dx = ArrayList<Double>()
                  for (i in 1 until c.size) {
                      val up = h[i] - h[i - 1]; val dn = l[i - 1] - l[i]
                      val pdm = if (up > dn && up > 0) up else 0.0
                      val mdm = if (dn > up && dn > 0) dn else 0.0
                      val tr = maxOf(h[i] - l[i], abs(h[i] - c[i - 1]), abs(l[i] - c[i - 1]))
                      if (i <= n) { str += tr; sp += pdm; sm += mdm }
                      else { str = str - str / n + tr; sp = sp - sp / n + pdm; sm = sm - sm / n + mdm }
                      if (i >= n) {
                          pdi = 100 * sp / str; mdi = 100 * sm / str
                          val d = 100 * abs(pdi - mdi) / (pdi + mdi).coerceAtLeast(1e-9)
                          if (dx.size < n) { dx.add(d); if (dx.size == n) adx = dx.average() }
                          else adx = (adx * (n - 1) + d) / n
                      }
                  }
                  return Triple(adx, pdi, mdi)
              }
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/btcwidget'
          cat > 'app/src/main/java/com/btcwidget/Delta.kt' <<'END_OF_FILE_X'
          package com.btcwidget
          
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import javax.crypto.Mac
          import javax.crypto.spec.SecretKeySpec
          
          object Delta {
              const val BASE = "https://api.india.delta.exchange"
              const val SYMBOL = "BTCUSD"
          
              fun secs(tf: String) = when (tf) {
                  "1m" -> 60; "3m" -> 180; "5m" -> 300; "15m" -> 900; "30m" -> 1800; "1h" -> 3600; else -> 14400
              }
          
              private fun get(path: String, query: String, key: String?, secret: String?,
                              url: String? = null, token: String? = null): JSONObject {
                  val q = if (query.isEmpty()) "" else "?$query"
                  val c = URL(url ?: (BASE + path + q)).openConnection() as HttpURLConnection
                  c.connectTimeout = 3000; c.readTimeout = 3000
                  c.setRequestProperty("User-Agent", "btc-widget")
                  c.setRequestProperty("Accept", "application/json")
                  if (token != null) {
                      c.setRequestProperty("X-Token", token)
                  } else if (key != null && secret != null) {
                      val ts = (System.currentTimeMillis() / 1000).toString()
                      val mac = Mac.getInstance("HmacSHA256")
                      mac.init(SecretKeySpec(secret.toByteArray(), "HmacSHA256"))
                      val sig = mac.doFinal(("GET" + ts + path + q).toByteArray()).joinToString("") { "%02x".format(it) }
                      c.setRequestProperty("api-key", key)
                      c.setRequestProperty("timestamp", ts)
                      c.setRequestProperty("signature", sig)
                  }
                  val code = c.responseCode
                  val body = (if (code in 200..299) c.inputStream else c.errorStream).bufferedReader().readText()
                  c.disconnect()
                  val j = try { JSONObject(body) } catch (e: Exception) { throw Exception("HTTP $code") }
                  if (!j.optBoolean("success", true)) {
                      val e = j.optJSONObject("error")
                      var msg = e?.optString("code") ?: j.optString("error", "api error")
                      val ip = Regex("""\d{1,3}(\.\d{1,3}){3}""").find(e?.optJSONObject("context")?.toString() ?: "")?.value
                      if (ip != null) msg += " $ip"
                      throw Exception(msg)
                  }
                  return j
              }
          
              fun mark(sym: String): Double =
                  get("/v2/tickers/$sym", "", null, null).getJSONObject("result").getString("mark_price").toDouble()
          
              fun price(): Double = mark(SYMBOL)
          
              // ---- Indian indices from angelone.in public pages (server-rendered; cached 3 s)
              private val icache = java.util.concurrent.ConcurrentHashMap<String, Pair<Long, Double>>()
              private val chgRe = Regex("""(\d{1,3}(?:,\d{2,3})*(?:\.\d+)?)\s*[+\-−]\s*[\d,]+(?:\.\d+)?\s*\(""")
          
              private fun indexText(slug: String): String {
                  val c = URL("https://www.angelone.in/indices/$slug").openConnection() as HttpURLConnection
                  c.connectTimeout = 4000; c.readTimeout = 4000
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36")
                  c.setRequestProperty("Accept", "text/html")
                  val html = c.inputStream.bufferedReader().readText()
                  c.disconnect()
                  return html.replace(Regex("(?is)<(script|style)[^>]*>.*?</\\1>"), " ")
                      .replace(Regex("(?s)<[^>]+>"), " ").replace("&nbsp;", " ").replace(Regex("\\s+"), " ")
              }
          
              private fun indexParse(text: String): Double? {
                  val i = text.indexOf("Price as of")
                  if (i > 0) {
                      val m = chgRe.findAll(text.substring(maxOf(0, i - 160), i)).lastOrNull()
                      m?.groupValues?.get(1)?.replace(",", "")?.toDoubleOrNull()?.let { return it }
                  }
                  return chgRe.find(text)?.groupValues?.get(1)?.replace(",", "")?.toDoubleOrNull()
              }
          
              fun indexPrice(slug: String): Double {
                  val now = System.currentTimeMillis()
                  icache[slug]?.let { if (now - it.first < 3000) return it.second }
                  val v = indexParse(indexText(slug)) ?: throw Exception("price not found for $slug")
                  icache[slug] = Pair(now, v)
                  return v
              }
          
              /** For the "Test indices" button. */
              fun indexDebug(): String {
                  val sb = StringBuilder()
                  for (slug in listOf("nifty-50", "nifty-midcap-100", "gift-nifty")) {
                      try {
                          val t = indexText(slug)
                          val v = indexParse(t)
                          sb.append("$slug -> ${v ?: "NOT FOUND"}\n")
                          if (v == null) { val i = t.indexOf("Price as of"); sb.append("   near: ").append(if (i < 0) "marker not on page" else t.substring(maxOf(0, i - 120), i + 30)).append("\n") }
                      } catch (e: Exception) { sb.append("$slug -> ERROR ${e.message}\n") }
                  }
                  return sb.toString()
              }
          
              /** spec: ETH | GOLD | SILVER | NIFTY | MIDCAP | GIFT | delta:SYM | idx:SLUG | bullions:mcx|24k|22k|silver | bare Delta symbol. */
              fun priceFor(spec: String): Double {
                  val s = spec.trim()
                  when (s.uppercase()) {
                      "ETH" -> return mark("ETHUSD")
                      "GOLD" -> return bullion("24k")
                      "SILVER" -> return bullion("silver")
                      "NIFTY" -> return indexPrice("nifty-50")
                      "MIDCAP" -> return indexPrice("nifty-midcap-100")
                      "GIFT" -> return indexPrice("gift-nifty")
                  }
                  val low = s.lowercase()
                  if (low.startsWith("bullions:")) return bullion(low.substring(9).trim())
                  if (low.startsWith("delta:")) return mark(s.substring(6).trim().uppercase())
                  if (low.startsWith("idx:")) return indexPrice(low.substring(4).trim())
                  return mark(s.uppercase())
              }
          
              /** Prices from bullions.co.in are in rupees: show without decimals and with a rupee sign. */
              fun isInr(spec: String): Boolean = spec.trim().equals("GOLD", true) || spec.trim().equals("SILVER", true) || spec.trim().lowercase().startsWith("bullions:")
          
              // ---- bullions.co.in (read from the public web page; refreshed at most every 10 s)
              @Volatile private var bPage: Pair<Long, String>? = null
              private val numRe = Regex("""\d{1,3}(?:,\d{2,3})+(?:\.\d+)?|\d{4,}(?:\.\d+)?""")
          
              private class BSpec(val label: Regex, val lo: Double, val hi: Double)
              private val bspecs = mapOf(
                  "mcx" to BSpec(Regex("""Gold\W{1,6}India\W{1,4}MCX""", RegexOption.IGNORE_CASE), 30000.0, 1_000_000.0),
                  "24k" to BSpec(Regex("""Gold\W{1,4}24\W{0,3}(?:Karat|K)""", RegexOption.IGNORE_CASE), 30000.0, 1_000_000.0),
                  "22k" to BSpec(Regex("""Gold\W{1,4}22\W{0,3}(?:Karat|K)""", RegexOption.IGNORE_CASE), 30000.0, 1_000_000.0),
                  "silver" to BSpec(Regex("""Silver\W{1,6}India\W{1,4}MCX""", RegexOption.IGNORE_CASE), 30000.0, 5_000_000.0)
              )
          
              private fun bullionsText(): String {
                  val now = System.currentTimeMillis()
                  bPage?.let { if (now - it.first < 10_000) return it.second }
                  val c = URL("https://bullions.co.in/").openConnection() as HttpURLConnection
                  c.connectTimeout = 4000; c.readTimeout = 4000
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36")
                  c.setRequestProperty("Accept", "text/html")
                  val html = c.inputStream.bufferedReader().readText()
                  c.disconnect()
                  val text = html.replace(Regex("(?is)<(script|style)[^>]*>.*?</\\1>"), " ")
                      .replace(Regex("(?s)<[^>]+>"), " ")
                      .replace("&nbsp;", " ").replace("&#8377;", " ").replace("&amp;", "&")
                      .replace(Regex("\\s+"), " ")
                  bPage = Pair(now, text)
                  return text
              }
          
              private fun bullionsValue(text: String, spec: BSpec): Double? {
                  for (m in spec.label.findAll(text)) {
                      val win = text.substring(m.range.last + 1, minOf(text.length, m.range.last + 400))
                      for (n in numRe.findAll(win)) {
                          val v = n.value.replace(",", "").toDoubleOrNull() ?: continue
                          if (v >= spec.lo && v <= spec.hi) return v
                      }
                  }
                  return null
              }
          
              fun bullion(kind: String): Double {
                  val spec = bspecs[kind.lowercase()] ?: throw Exception("unknown bullions:$kind")
                  return bullionsValue(bullionsText(), spec) ?: throw Exception("not found on bullions.co.in")
              }
          
              /** For the "Test gold" button: what was read for each rate, plus the raw text near the label if it failed. */
              fun bullionsDebug(): String {
                  val text = bullionsText()
                  val sb = StringBuilder()
                  for ((k, spec) in bspecs) {
                      val v = bullionsValue(text, spec)
                      sb.append("bullions:$k -> ${v ?: "NOT FOUND"}\n")
                      if (v == null) {
                          val m = spec.label.find(text)
                          sb.append("   text near label: ").append(
                              if (m == null) "label not on page" else text.substring(m.range.first, minOf(text.length, m.range.last + 160))
                          ).append("\n")
                      }
                  }
                  return sb.toString()
              }
          
          
              @Volatile var pnlErr = ""
          
              private fun positions(relay: String, token: String, key: String, secret: String) =
                  (if (relay.isNotEmpty()) get("/positions", "", null, null, relay.trimEnd('/') + "/positions", token)
                   else get("/v2/positions/margined", "", key, secret)).getJSONArray("result")
          
              private fun num(o: org.json.JSONObject?, k: String): Double? = o?.optString(k, "")?.toDoubleOrNull()
          
              private fun symOf(p: org.json.JSONObject): String =
                  p.optString("product_symbol", "").ifEmpty { p.optJSONObject("product")?.optString("symbol") ?: "" }
          
              /** Own calculation: size x contract_value x (mark - entry). Null when any input is missing or implausible. */
              private fun recompute(p: org.json.JSONObject, size: Double): Double? {
                  val entry = num(p, "entry_price") ?: return null
                  if (entry <= 0.0) return null                      // an entry of 0 would turn PnL into the position's full value
                  val sym = symOf(p)
                  if (sym.isEmpty()) return null
                  val t = get("/v2/tickers/$sym", "", null, null).getJSONObject("result")
                  val cv = num(p.optJSONObject("product"), "contract_value") ?: num(t, "contract_value") ?: return null
                  val mark = num(t, "mark_price") ?: return null
                  return size * cv * (mark - entry)
              }
          
              /** One consistent source: the live own calculation. Delta's reported figure is only a fallback. */
              @Volatile var pnlMode = ""   // "" / "delta" = Delta's own figure first, "own" = own calculation first
          
              /**
               * Default: use Delta's own unrealized_pnl (exactly what its app shows, same server, same instant),
               * but fall back to the own calculation when it is missing or absurdly far from it (guards the old
               * "market value instead of PnL" problem). Mode "own" prefers the own calculation.
               */
              private fun pick(api: Double?, own: Double?): Double {
                  if (pnlMode == "own") return own ?: api ?: 0.0
                  if (api == null) return own ?: 0.0
                  if (own == null) return api
                  return if (Math.abs(api - own) > Math.max(10.0, 5 * Math.abs(own))) own else api
              }
          
              /** Background threads for fetching all option prices at the same time. */
              private val fetchPool = java.util.concurrent.Executors.newCachedThreadPool { r -> Thread(r).apply { isDaemon = true } }
          
              /** PnL (USD) and number of open positions. */
              fun pnl(key: String, secret: String, relay: String = "", token: String = ""): Pair<Double, Int> {
                  val r = positions(relay, token, key, secret)
                  val jobs = ArrayList<Triple<org.json.JSONObject, Double, java.util.concurrent.Future<Double?>>>()
                  for (i in 0 until r.length()) {
                      val p = r.getJSONObject(i)
                      val size = p.optString("size", "0").toDoubleOrNull() ?: 0.0
                      if (size == 0.0) continue
                      // all prices are requested at the same moment, so the sum is one consistent snapshot
                      jobs.add(Triple(p, size, fetchPool.submit(java.util.concurrent.Callable<Double?> {
                          try { recompute(p, size) } catch (_: Exception) { null } })))
                  }
                  var sum = 0.0
                  for ((p, _, f) in jobs) {
                      val own = try { f.get(4, java.util.concurrent.TimeUnit.SECONDS) } catch (_: Exception) { null }
                      sum += pick(num(p, "unrealized_pnl"), own)
                  }
                  return Pair(sum, jobs.size)
              }
          
              /** Human-readable dump used by the "Test PnL" button in settings. */
              fun pnlDebug(key: String, secret: String, relay: String, token: String, rate: Double): String {
                  val r = positions(relay, token, key, secret)
                  val sb = StringBuilder()
                  var total = 0.0; var open = 0
                  for (i in 0 until r.length()) {
                      val p = r.getJSONObject(i)
                      val size = p.optString("size", "0").toDoubleOrNull() ?: 0.0
                      if (size == 0.0) continue
                      open++
                      val api = num(p, "unrealized_pnl")
                      val own = try { recompute(p, size) } catch (e: Exception) { null }
                      val used = pick(api, own)
                      sb.append("${symOf(p)}  size=${p.optString("size")}  entry=${p.optString("entry_price")}\n")
                      sb.append("  Delta unrealized_pnl: ${api ?: "missing"}\n")
                      sb.append("  own calculation: ${own ?: "n/a"}\n")
                      sb.append("  used: $used   (Rs ${"%.2f".format(used * rate)})\n")
                      total += used
                  }
                  if (open == 0) return "No open positions."
                  sb.append("\nTotal: $${"%.4f".format(total)}  x ${"%.2f".format(rate)} = Rs ${"%.2f".format(total * rate)}\n")
                  return sb.toString()
              }
          
              fun candles(tf: String): Triple<List<Double>, List<Double>, List<Double>> {
                  val now = System.currentTimeMillis() / 1000
                  val r = get("/v2/history/candles",
                      "resolution=$tf&symbol=$SYMBOL&start=${now - secs(tf) * 120}&end=$now", null, null).getJSONArray("result")
                  val rows = (0 until r.length()).map { r.getJSONObject(it) }.sortedBy { it.getLong("time") }
                  return Triple(rows.map { it.getDouble("high") }, rows.map { it.getDouble("low") }, rows.map { it.getDouble("close") })
              }
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/btcwidget'
          cat > 'app/src/main/java/com/btcwidget/Prefs.kt' <<'END_OF_FILE_X'
          package com.btcwidget
          
          import android.content.Context
          
          object Prefs {
              const val ACTION_CYCLE = "com.btcwidget.CYCLE"
              val TFS = listOf("1m", "3m", "5m", "15m", "30m", "1h", "4h")
              val SLOT_KEYS = listOf("tvpkg", "dpkg", "tpkg") + (4..12).map { "app$it" }
          
              fun sp(c: Context) = c.getSharedPreferences("w", Context.MODE_PRIVATE)
              fun alpha(c: Context) = sp(c).getInt("alpha", 180)
              fun tsize(c: Context) = sp(c).getInt("tsize", 15)
              fun tf(c: Context) = sp(c).getString("tf", "15m")!!
              fun str(c: Context, k: String) = sp(c).getString(k, "")!!.trim()
              /** Delta India's fixed USD-INR rate is 85. Blank = 85, type "usd" to show dollars, or any number to override. */
              fun rate(c: Context): Double {
                  val v = str(c, "rate")
                  return when {
                      v.isEmpty() -> 85.0
                      v.equals("usd", true) -> 0.0
                      else -> v.toDoubleOrNull() ?: 85.0
                  }
              }
          
              fun tfs(c: Context): List<String> {
                  val l = str(c, "tfs").split(",").map { it.trim() }.filter { it in TFS }.distinct().take(4)
                  return if (l.isEmpty()) listOf("5m", "15m", "1h") else l
              }
          
              val BUILTIN = listOf("ETH", "GOLD", "NIFTY", "SILVER", "MIDCAP", "GIFT")
          
              /** (label, spec) pairs shown under BTC: the built-ins, then up to 3 custom slots. */
              fun extras(c: Context): List<Pair<String, String>> {
                  // all six built-ins always show; the field only hides some ("-GIFT,-ETH") or everything ("none")
                  val s = str(c, "extras").uppercase()
                  val hide = s.split(",").map { it.trim().removePrefix("-") }.toSet()
                  val names = if (s == "NONE") emptyList() else BUILTIN.filter { it !in hide || !s.contains("-") }
                  val out = names.map { (if (it == "SILVER" || it == "MIDCAP" || it == "GIFT") it.lowercase().replaceFirstChar { c -> c.uppercase() } else it) to it }.toMutableList()
                  for (i in 1..3) {
                      val sym = str(c, "c${i}s")
                      if (sym.isNotEmpty()) out.add(str(c, "c${i}l").ifEmpty { sym.substringAfter(':').uppercase() } to sym)
                  }
                  return out
              }
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/btcwidget'
          cat > 'app/src/main/java/com/btcwidget/SettingsActivity.kt' <<'END_OF_FILE_X'
          package com.btcwidget
          
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.widget.*
          import androidx.core.widget.doAfterTextChanged
          
          class SettingsActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  if (Build.VERSION.SDK_INT >= 33)
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 1)
                  val sp = Prefs.sp(this)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 40, 40, 40) }
                  fun label(t: String) = root.addView(TextView(this).apply { text = t; setPadding(0, 32, 0, 0) })
          
                  fun seek(title: String, maxV: Int, init: Int, save: (Int) -> Unit) {
                      label(title)
                      root.addView(SeekBar(this).apply {
                          max = maxV; progress = init
                          setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { save(p) }
                              override fun onStartTrackingTouch(s: SeekBar?) {}
                              override fun onStopTrackingTouch(s: SeekBar?) {}
                          })
                      })
                  }
                  seek("Widget transparency (left = clear, right = solid)", 255, Prefs.alpha(this)) {
                      sp.edit().putInt("alpha", it).apply() }
                  seek("Text size for prices, PnL, Pos and ADX (11-20)", 9, Prefs.tsize(this) - 11) {
                      sp.edit().putInt("tsize", it + 11).apply() }
          
                  fun field(k: String, hint: String) {
                      label(hint)
                      root.addView(EditText(this).apply {
                          setText(sp.getString(k, "")); setSingleLine()
                          doAfterTextChanged { sp.edit().putString(k, it.toString().trim()).apply() }
                      })
                  }
                  field("relay", "Relay URL (fixed-IP server), e.g. https://1-2-3-4.sslip.io")
                  field("rtoken", "Relay token")
                  field("key", "Delta API key (read-only; optional backup if relay is down)")
                  field("secret", "Delta API secret (optional backup)")
                  field("extras", "Built-in prices: blank = all six (ETH GOLD NIFTY SILVER MIDCAP GIFT). To hide some type e.g. -GIFT,-ETH ; type none to hide all")
                  label("Extra indexes (3 slots, shown on a third row): a name and a symbol. Symbols: SOLUSD (Delta), " +
                        "idx:nifty-bank idx:sensex (angelone.in/indices/<name>), bullions:mcx bullions:24k bullions:22k bullions:silver (rupees)")
                  for (i in 1..3) {
                      field("c${i}l", "Index $i name (e.g. BANKNIFTY)")
                      field("c${i}s", "Index $i symbol")
                  }
                  field("pnlsrc", "PnL source: blank = Delta's own figure (matches its app); type own to use the widget's own calculation")
                  field("rate", "USD-to-INR rate for PnL (blank = 85, Delta's fixed rate; type usd to show dollars)")
                  field("tfs", "ADX timeframes, comma-separated (blank = 5m,15m,1h; options 1m,3m,5m,15m,30m,1h,4h)")
          
                  root.addView(Button(this).apply {
                      text = "Test PnL (shows raw Delta numbers)"
                      setOnClickListener {
                          val relay = Prefs.str(this@SettingsActivity, "relay"); val tok = Prefs.str(this@SettingsActivity, "rtoken")
                          val key = Prefs.str(this@SettingsActivity, "key"); val sec = Prefs.str(this@SettingsActivity, "secret")
                          val rate = Prefs.rate(this@SettingsActivity)
                          Toast.makeText(this@SettingsActivity, "Fetching...", Toast.LENGTH_SHORT).show()
                          Thread {
                              val out = try { Delta.pnlDebug(key, sec, relay, tok, if (rate > 0) rate else 85.0) }
                                        catch (e: Exception) { "Error: " + (e.message ?: e.javaClass.simpleName) }
                              runOnUiThread {
                                  AlertDialog.Builder(this@SettingsActivity).setTitle("PnL check").setMessage(out)
                                      .setPositiveButton("OK", null).show()
                              }
                          }.start()
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "Test gold (bullions.co.in)"
                      setOnClickListener {
                          Toast.makeText(this@SettingsActivity, "Fetching...", Toast.LENGTH_SHORT).show()
                          Thread {
                              val out = try { Delta.bullionsDebug() } catch (e: Exception) { "Error: " + (e.message ?: e.javaClass.simpleName) }
                              runOnUiThread {
                                  AlertDialog.Builder(this@SettingsActivity).setTitle("Gold check").setMessage(out)
                                      .setPositiveButton("OK", null).show()
                              }
                          }.start()
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "Test indices (Nifty, Midcap, Gift)"
                      setOnClickListener {
                          Toast.makeText(this@SettingsActivity, "Fetching...", Toast.LENGTH_SHORT).show()
                          Thread {
                              val out = try { Delta.indexDebug() } catch (e: Exception) { "Error: " + (e.message ?: e.javaClass.simpleName) }
                              runOnUiThread {
                                  AlertDialog.Builder(this@SettingsActivity).setTitle("Index check").setMessage(out)
                                      .setPositiveButton("OK", null).show()
                              }
                          }.start()
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "Open Delta API page (to whitelist an IP)"
                      setOnClickListener {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://india.delta.exchange/app/account/manageapikeys")))
                      }
                  })
          
                  fun appName(pkg: String): String = if (pkg.isEmpty()) "empty" else try {
                      packageManager.getApplicationLabel(packageManager.getApplicationInfo(pkg, 0)).toString()
                  } catch (e: Exception) { pkg }
          
                  fun pick(k: String, n: Int) {
                      val btn = Button(this)
                      fun refresh() { btn.text = "Button $n: " + appName(sp.getString(k, "").orEmpty()) }
                      refresh()
                      btn.setOnClickListener {
                          val pm = packageManager
                          val apps = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                              .sortedBy { it.loadLabel(pm).toString().lowercase() }
                          AlertDialog.Builder(this).setTitle("Button $n")
                              .setItems((listOf("None (empty slot)") + apps.map { it.loadLabel(pm).toString() }).toTypedArray()) { _, i ->
                                  sp.edit().putString(k, if (i == 0) "" else apps[i - 1].activityInfo.packageName).apply()
                                  refresh(); WidgetProvider.start(this)
                              }.show()
                      }
                      root.addView(btn)
                  }
                  label("Widget buttons: 6 per row, 2 rows. Pick any installed app for each.")
                  Prefs.SLOT_KEYS.forEachIndexed { i, k -> pick(k, i + 1) }
          
                  setContentView(ScrollView(this).apply { addView(root) })
                  WidgetProvider.start(this)
              }
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/btcwidget'
          cat > 'app/src/main/java/com/btcwidget/UpdateService.kt' <<'END_OF_FILE_X'
          package com.btcwidget
          
          import android.app.*
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.drawable.Drawable
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder
          import android.util.TypedValue
          import android.view.View
          import android.widget.RemoteViews
          import androidx.core.graphics.drawable.toBitmap
          import java.util.Locale
          import java.util.concurrent.Callable
          import java.util.concurrent.Executors
          import java.util.concurrent.Future
          import java.util.concurrent.TimeUnit
          
          class UpdateService : Service() {
              private val pool = Executors.newFixedThreadPool(16)
              private val loop = Executors.newScheduledThreadPool(3)
              private var started = false
          
              private val slotIds = listOf(R.id.btn1, R.id.btn2, R.id.btn3, R.id.btn4, R.id.btn5, R.id.btn6,
                  R.id.btn7, R.id.btn8, R.id.btn9, R.id.btn10, R.id.btn11, R.id.btn12)
          
              override fun onBind(i: Intent?): IBinder? = null
          
              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("w", "Widget refresh", NotificationManager.IMPORTANCE_MIN))
                  val n = Notification.Builder(this, "w").setContentTitle("BTC widget running")
                      .setSmallIcon(android.R.drawable.ic_dialog_info).build()
                  if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(1, n)
              }
          
              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  initWidget()
                  if (!started) {
                      started = true
                      // three independent loops: a slow ADX / gold / Nifty request can never delay the PnL
                      loop.scheduleWithFixedDelay({ try { fastTick() } catch (_: Throwable) {} }, 0, 500, TimeUnit.MILLISECONDS)
                      loop.scheduleWithFixedDelay({ try { adxTick() } catch (_: Throwable) {} }, 0, 1500, TimeUnit.MILLISECONDS)
                      loop.scheduleWithFixedDelay({ try { extraTick() } catch (_: Throwable) {} }, 0, 1500, TimeUnit.MILLISECONDS)
                  }
                  return START_STICKY
              }
          
              private fun ids() = AppWidgetManager.getInstance(this)
                  .getAppWidgetIds(ComponentName(this, WidgetProvider::class.java))
          
              private fun icon(pkg: String): Bitmap {
                  val d: Drawable = try { packageManager.getApplicationIcon(pkg) }
                  catch (e: Exception) { getDrawable(android.R.drawable.sym_def_app_icon)!! }
                  return d.toBitmap(96, 96)
              }
          
              private fun open(code: Int, pkg: String): PendingIntent? {
                  val i = packageManager.getLaunchIntentForPackage(pkg) ?: return null
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return PendingIntent.getActivity(this, code, i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
              }
          
              /** Full update: icons + click targets. Text is refreshed by tick(). */
              private fun initWidget() {
                  val rv = RemoteViews(packageName, R.layout.widget)
                  val pkgs = Prefs.SLOT_KEYS.map { Prefs.str(this, it) }
                  for (i in 0 until 12) {
                      val pkg = pkgs[i]
                      if (pkg.isEmpty()) { rv.setViewVisibility(slotIds[i], View.INVISIBLE); continue }
                      rv.setViewVisibility(slotIds[i], View.VISIBLE)
                      rv.setImageViewBitmap(slotIds[i], icon(pkg))
                      open(10 + i, pkg)?.let { rv.setOnClickPendingIntent(slotIds[i], it) }
                  }
                  rv.setViewVisibility(R.id.row1, if (pkgs.subList(0, 6).any { it.isNotEmpty() }) View.VISIBLE else View.GONE)
                  rv.setViewVisibility(R.id.row2, if (pkgs.subList(6, 12).any { it.isNotEmpty() }) View.VISIBLE else View.GONE)
                  rv.setOnClickPendingIntent(R.id.gear, PendingIntent.getActivity(this, 3,
                      Intent(this, SettingsActivity::class.java), PendingIntent.FLAG_IMMUTABLE))
                  AppWidgetManager.getInstance(this).updateAppWidget(ids(), rv)
              }
          
              private fun <T> async(f: () -> T): Future<T?> = pool.submit(Callable<T?> { try { f() } catch (e: Exception) { null } })
          
              /** Relay first (fixed IP); if it fails and a direct key is saved, try direct. */
              private fun fetchPnl(key: String, sec: String, relay: String, rtok: String): Pair<Double, Int>? {
                  Delta.pnlMode = Prefs.str(this, "pnlsrc").lowercase()
                  val direct = key.isNotEmpty() && sec.isNotEmpty()
                  if (relay.isEmpty() && !direct) { Delta.pnlErr = "add relay or API key in app"; return null }
                  try {
                      val r = Delta.pnl(key, sec, relay, rtok); Delta.pnlErr = ""; return r
                  } catch (e: Exception) {
                      if (relay.isNotEmpty() && direct) {
                          try { val r = Delta.pnl(key, sec); Delta.pnlErr = ""; return r }
                          catch (e2: Exception) { Delta.pnlErr = e2.message ?: e2.javaClass.simpleName; return null }
                      }
                      Delta.pnlErr = e.message ?: e.javaClass.simpleName
                      return null
                  }
              }
          
              private fun <T> Future<T?>.res(): T? = try { get(6, TimeUnit.SECONDS) } catch (_: Exception) { null }
          
              private fun update(rv: RemoteViews) = AppWidgetManager.getInstance(this).partiallyUpdateAppWidget(ids(), rv)
          
              /** BTC price + PnL + positions. Repeats as fast as Delta answers. */
              private fun fastTick() {
                  val key = Prefs.str(this, "key"); val sec = Prefs.str(this, "secret")
                  val relay = Prefs.str(this, "relay"); val rtok = Prefs.str(this, "rtoken")
                  val p = async { Delta.price() }
                  val n = async { fetchPnl(key, sec, relay, rtok) }
                  val price = p.res(); val pnl = n.res()
                  val rv = RemoteViews(packageName, R.layout.widget)
                  val L = Locale.US
                  rv.setInt(R.id.bg, "setImageAlpha", Prefs.alpha(this))
                  val ts = Prefs.tsize(this).toFloat()
                  rv.setTextViewTextSize(R.id.pnl, TypedValue.COMPLEX_UNIT_SP, ts + 2f)
                  rv.setTextViewTextSize(R.id.pos, TypedValue.COMPLEX_UNIT_SP, ts)
                  rv.setTextViewText(R.id.price, if (price == null) "BTC --" else String.format(L, "BTC %,.1f", price))
                  if (pnl == null) {
                      rv.setTextViewText(R.id.pnl, "PnL: " + Delta.pnlErr.ifEmpty { "--" }); rv.setTextColor(R.id.pnl, 0xFFAAAAAA.toInt())
                      rv.setTextViewText(R.id.pos, "Pos --")
                  } else {
                      val rate = Prefs.rate(this)
                      val v = if (rate > 0) pnl.first * rate else pnl.first
                      val sym = if (rate > 0) "\u20B9" else "$"
                      rv.setTextViewText(R.id.pnl, String.format(L, "PnL %s%s%,.2f", if (v < 0) "-" else "+", sym, Math.abs(v)))
                      rv.setTextColor(R.id.pnl, if (v >= 0) 0xFF4CD964.toInt() else 0xFFFF5A5F.toInt())
                      rv.setTextViewText(R.id.pos, "Pos ${pnl.second}")
                  }
                  update(rv)
              }
          
              /** ADX for the chosen timeframes. */
              private fun adxTick() {
                  val tfs = Prefs.tfs(this)
                  val a = tfs.map { tf -> async { val (h, l, c) = Delta.candles(tf); Adx.calc(h, l, c)?.first } }
                  val vals = tfs.zip(a.map { it.res() })
                  val rv = RemoteViews(packageName, R.layout.widget)
                  rv.setTextViewTextSize(R.id.adx, TypedValue.COMPLEX_UNIT_SP, Prefs.tsize(this).toFloat())
                  rv.setTextViewText(R.id.adx, "ADX " + vals.joinToString(" | ") { (tf, v) ->
                      if (v == null) "$tf --" else String.format(Locale.US, "%s %.1f", tf, v) })
                  update(rv)
              }
          
              /** ETH / GOLD / NIFTY and the 3 custom slots. */
              private fun extraTick() {
                  val extras = Prefs.extras(this)
                  val rv = RemoteViews(packageName, R.layout.widget)
                  val rows = intArrayOf(R.id.more, R.id.more2, R.id.more3)
                  if (extras.isEmpty()) { rows.forEach { rv.setViewVisibility(it, View.GONE) }; update(rv); return }
                  val x = extras.map { (_, spec) -> async { Delta.priceFor(spec) } }
                  val items = extras.zip(x.map { it.res() }).map { (e, v) ->
                      val n = e.first
                      if (v == null) "$n --"
                      else if (Delta.isInr(e.second)) String.format(Locale.US, "%s \u20B9%,.0f", n, v)
                      else String.format(Locale.US, "%s %,.1f", n, v)
                  }
                  val chunks = items.chunked(3)
                  rows.forEachIndexed { i, id ->
                      if (i < chunks.size) {
                          rv.setViewVisibility(id, View.VISIBLE)
                          rv.setTextViewTextSize(id, TypedValue.COMPLEX_UNIT_SP, Prefs.tsize(this).toFloat())
                          rv.setTextViewText(id, chunks[i].joinToString(" | "))
                      } else rv.setViewVisibility(id, View.GONE)
                  }
                  update(rv)
              }
          
              override fun onDestroy() { loop.shutdownNow(); pool.shutdownNow(); super.onDestroy() }
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/btcwidget'
