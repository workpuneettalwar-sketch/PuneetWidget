name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p btc-widget && cd btc-widget
          mkdir -p $(dirname 'app/build.gradle.kts')
          cat > 'app/build.gradle.kts' <<'END_OF_FILE_X'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.btcwidget"
              compileSdk = 34
              defaultConfig { applicationId = "com.btcwidget"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.core:core-ktx:1.13.1") }
          END_OF_FILE_X
          mkdir -p $(dirname 'app/src/main/AndroidManifest.xml')
          cat > 'app/src/main/AndroidManifest.xml' <<'END_OF_FILE_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>
              <application android:label="@string/app_name" android:theme="@android:style/Theme.Material.Light.DarkActionBar">
                  <activity android:name=".SettingsActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".WidgetProvider" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info"/>
                  </receiver>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
                  </receiver>
                  <service android:name=".UpdateService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="live widget refresh"/>
                  </service>
              </application>
          </manifest>
          END_OF_FILE_X
          mkdir -p $(dirname 'app/src/main/java/com/btcwidget/Adx.kt')
          cat > 'app/src/main/java/com/btcwidget/Adx.kt' <<'END_OF_FILE_X'
          package com.btcwidget

          import kotlin.math.abs

          object Adx {
              /** Wilder ADX. Returns (ADX, +DI, -DI); includes the currently forming candle. */
              fun calc(h: List<Double>, l: List<Double>, c: List<Double>, n: Int = 14): Triple<Double, Double, Double>? {
                  if (c.size < 2 * n + 1) return null
                  var str = 0.0; var sp = 0.0; var sm = 0.0
                  var adx = 0.0; var pdi = 0.0; var mdi = 0.0
                  val dx = ArrayList<Double>()
                  for (i in 1 until c.size) {
                      val up = h[i] - h[i - 1]; val dn = l[i - 1] - l[i]
                      val pdm = if (up > dn && up > 0) up else 0.0
                      val mdm = if (dn > up && dn > 0) dn else 0.0
                      val tr = maxOf(h[i] - l[i], abs(h[i] - c[i - 1]), abs(l[i] - c[i - 1]))
                      if (i <= n) { str += tr; sp += pdm; sm += mdm }
                      else { str = str - str / n + tr; sp = sp - sp / n + pdm; sm = sm - sm / n + mdm }
                      if (i >= n) {
                          pdi = 100 * sp / str; mdi = 100 * sm / str
                          val d = 100 * abs(pdi - mdi) / (pdi + mdi).coerceAtLeast(1e-9)
                          if (dx.size < n) { dx.add(d); if (dx.size == n) adx = dx.average() }
                          else adx = (adx * (n - 1) + d) / n
                      }
                  }
                  return Triple(adx, pdi, mdi)
              }
          }
          END_OF_FILE_X
          mkdir -p $(dirname 'app/src/main/java/com/btcwidget/Delta.kt')
          cat > 'app/src/main/java/com/btcwidget/Delta.kt' <<'END_OF_FILE_X'
          package com.btcwidget

          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import javax.crypto.Mac
          import javax.crypto.spec.SecretKeySpec

          object Delta {
              const val BASE = "https://api.india.delta.exchange"
              const val SYMBOL = "BTCUSD"

              fun secs(tf: String) = when (tf) {
                  "1m" -> 60; "3m" -> 180; "5m" -> 300; "15m" -> 900; "30m" -> 1800; "1h" -> 3600; else -> 14400
              }

              private fun get(path: String, query: String, key: String?, secret: String?,
                              url: String? = null, token: String? = null): JSONObject {
                  val q = if (query.isEmpty()) "" else "?$query"
                  val c = URL(url ?: (BASE + path + q)).openConnection() as HttpURLConnection
                  c.connectTimeout = 3000; c.readTimeout = 3000
                  c.setRequestProperty("User-Agent", "btc-widget")
                  c.setRequestProperty("Accept", "application/json")
                  if (token != null) {
                      c.setRequestProperty("X-Token", token)
                  } else if (key != null && secret != null) {
                      val ts = (System.currentTimeMillis() / 1000).toString()
                      val mac = Mac.getInstance("HmacSHA256")
                      mac.init(SecretKeySpec(secret.toByteArray(), "HmacSHA256"))
                      val sig = mac.doFinal(("GET" + ts + path + q).toByteArray()).joinToString("") { "%02x".format(it) }
                      c.setRequestProperty("api-key", key)
                      c.setRequestProperty("timestamp", ts)
                      c.setRequestProperty("signature", sig)
                  }
                  val code = c.responseCode
                  val body = (if (code in 200..299) c.inputStream else c.errorStream).bufferedReader().readText()
                  c.disconnect()
                  val j = try { JSONObject(body) } catch (e: Exception) { throw Exception("HTTP $code") }
                  if (!j.optBoolean("success", true)) {
                      val e = j.optJSONObject("error")
                      var msg = e?.optString("code") ?: j.optString("error", "api error")
                      val ip = Regex("""\d{1,3}(\.\d{1,3}){3}""").find(e?.optJSONObject("context")?.toString() ?: "")?.value
                      if (ip != null) msg += " $ip"
                      throw Exception(msg)
                  }
                  return j
              }

              fun mark(sym: String): Double =
                  get("/v2/tickers/$sym", "", null, null).getJSONObject("result").getString("mark_price").toDouble()

              fun price(): Double = mark(SYMBOL)

              private val ycache = java.util.concurrent.ConcurrentHashMap<String, Pair<Long, Double>>()

              /** Yahoo Finance quote (unofficial, no key). Cached 5 s to stay polite. */
              fun yahoo(sym: String): Double {
                  val now = System.currentTimeMillis()
                  ycache[sym]?.let { if (now - it.first < 5000) return it.second }
                  val u = "https://query1.finance.yahoo.com/v8/finance/chart/" +
                      java.net.URLEncoder.encode(sym, "UTF-8") + "?interval=1m&range=1d"
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.connectTimeout = 3000; c.readTimeout = 3000
                  c.setRequestProperty("User-Agent", "Mozilla/5.0")
                  val body = c.inputStream.bufferedReader().readText()
                  c.disconnect()
                  val v = JSONObject(body).getJSONObject("chart").getJSONArray("result").getJSONObject(0)
                      .getJSONObject("meta").getDouble("regularMarketPrice")
                  ycache[sym] = Pair(now, v)
                  return v
              }

              fun extra(name: String): Double = when (name) {
                  "ETH" -> mark("ETHUSD")
                  "GOLD" -> try { mark("XAUUSD") } catch (e: Exception) { yahoo("GC=F") }
                  "NIFTY" -> yahoo("^NSEI")
                  else -> throw Exception("unknown $name")
              }

              @Volatile var pnlErr = ""

              /** Live PnL over open positions: size * contract_value * (mark - entry); falls back to unrealized_pnl. */
              fun pnl(key: String, secret: String, relay: String = "", token: String = ""): Pair<Double, Int> {
                  val j = if (relay.isNotEmpty()) get("/positions", "", null, null, relay.trimEnd('/') + "/positions", token)
                          else get("/v2/positions/margined", "", key, secret)
                  val r = j.getJSONArray("result")
                  var sum = 0.0
                  var count = 0
                  for (i in 0 until r.length()) {
                      val p = r.getJSONObject(i)
                      val size = p.optString("size", "0").toDoubleOrNull() ?: 0.0
                      if (size == 0.0) continue
                      count++
                      val entry = p.optString("entry_price", "").toDoubleOrNull()
                      val sym = p.optString("product_symbol", "").ifEmpty { p.optJSONObject("product")?.optString("symbol") ?: "" }
                      var live: Double? = null
                      if (entry != null && sym.isNotEmpty()) {
                          try {
                              val t = get("/v2/tickers/$sym", "", null, null).getJSONObject("result")
                              val mark = t.optString("mark_price", "").toDoubleOrNull()
                              val cv = t.optString("contract_value", "1").toDoubleOrNull() ?: 1.0
                              if (mark != null) live = size * cv * (mark - entry)
                          } catch (_: Exception) {}
                      }
                      sum += live ?: (p.optString("unrealized_pnl", "0").toDoubleOrNull() ?: 0.0)
                  }
                  return Pair(sum, count)
              }

              fun candles(tf: String): Triple<List<Double>, List<Double>, List<Double>> {
                  val now = System.currentTimeMillis() / 1000
                  val r = get("/v2/history/candles",
                      "resolution=$tf&symbol=$SYMBOL&start=${now - secs(tf) * 120}&end=$now", null, null).getJSONArray("result")
                  val rows = (0 until r.length()).map { r.getJSONObject(it) }.sortedBy { it.getLong("time") }
                  return Triple(rows.map { it.getDouble("high") }, rows.map { it.getDouble("low") }, rows.map { it.getDouble("close") })
              }
          }
          END_OF_FILE_X
          mkdir -p $(dirname 'app/src/main/java/com/btcwidget/Prefs.kt')
          cat > 'app/src/main/java/com/btcwidget/Prefs.kt' <<'END_OF_FILE_X'
          package com.btcwidget

          import android.content.Context

          object Prefs {
              const val ACTION_CYCLE = "com.btcwidget.CYCLE"
              val TFS = listOf("1m", "3m", "5m", "15m", "30m", "1h", "4h")
              val SLOT_KEYS = listOf("tvpkg", "dpkg", "tpkg") + (4..12).map { "app$it" }

              fun sp(c: Context) = c.getSharedPreferences("w", Context.MODE_PRIVATE)
              fun alpha(c: Context) = sp(c).getInt("alpha", 180)
              fun tsize(c: Context) = sp(c).getInt("tsize", 15)
              fun tf(c: Context) = sp(c).getString("tf", "15m")!!
              fun str(c: Context, k: String) = sp(c).getString(k, "")!!.trim()
              fun rate(c: Context) = str(c, "rate").toDoubleOrNull() ?: 0.0

              fun tfs(c: Context): List<String> {
                  val l = str(c, "tfs").split(",").map { it.trim() }.filter { it in TFS }.distinct().take(4)
                  return if (l.isEmpty()) listOf("5m", "15m", "1h") else l
              }

              fun extras(c: Context): List<String> {
                  val s = str(c, "extras").uppercase()
                  if (s == "NONE") return emptyList()
                  val l = s.split(",").map { it.trim() }.filter { it in listOf("ETH", "GOLD", "NIFTY") }.distinct()
                  return if (l.isEmpty()) listOf("ETH", "GOLD", "NIFTY") else l
              }
          }
          END_OF_FILE_X
          mkdir -p $(dirname 'app/src/main/java/com/btcwidget/SettingsActivity.kt')
          cat > 'app/src/main/java/com/btcwidget/SettingsActivity.kt' <<'END_OF_FILE_X'
          package com.btcwidget

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.widget.*
          import androidx.core.widget.doAfterTextChanged

          class SettingsActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  if (Build.VERSION.SDK_INT >= 33)
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 1)
                  val sp = Prefs.sp(this)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 40, 40, 40) }
                  fun label(t: String) = root.addView(TextView(this).apply { text = t; setPadding(0, 32, 0, 0) })

                  fun seek(title: String, maxV: Int, init: Int, save: (Int) -> Unit) {
                      label(title)
                      root.addView(SeekBar(this).apply {
                          max = maxV; progress = init
                          setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { save(p) }
                              override fun onStartTrackingTouch(s: SeekBar?) {}
                              override fun onStopTrackingTouch(s: SeekBar?) {}
                          })
                      })
                  }
                  seek("Widget transparency (left = clear, right = solid)", 255, Prefs.alpha(this)) {
                      sp.edit().putInt("alpha", it).apply() }
                  seek("Text size for prices, PnL, Pos and ADX (11-20)", 9, Prefs.tsize(this) - 11) {
                      sp.edit().putInt("tsize", it + 11).apply() }

                  fun field(k: String, hint: String) {
                      label(hint)
                      root.addView(EditText(this).apply {
                          setText(sp.getString(k, "")); setSingleLine()
                          doAfterTextChanged { sp.edit().putString(k, it.toString().trim()).apply() }
                      })
                  }
                  field("relay", "Relay URL (fixed-IP server), e.g. https://1-2-3-4.sslip.io")
                  field("rtoken", "Relay token")
                  field("key", "Delta API key (read-only; optional backup if relay is down)")
                  field("secret", "Delta API secret (optional backup)")
                  field("extras", "Extra prices under BTC: ETH, GOLD, NIFTY (comma-separated; blank = all three; none = hide)")
                  field("rate", "PnL in INR: Delta's fixed USD-to-INR rate (blank = show in $)")
                  field("tfs", "ADX timeframes, comma-separated (blank = 5m,15m,1h; options 1m,3m,5m,15m,30m,1h,4h)")

                  root.addView(Button(this).apply {
                      text = "Open Delta API page (to whitelist an IP)"
                      setOnClickListener {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://india.delta.exchange/app/account/manageapikeys")))
                      }
                  })

                  fun appName(pkg: String): String = if (pkg.isEmpty()) "empty" else try {
                      packageManager.getApplicationLabel(packageManager.getApplicationInfo(pkg, 0)).toString()
                  } catch (e: Exception) { pkg }

                  fun pick(k: String, n: Int) {
                      val btn = Button(this)
                      fun refresh() { btn.text = "Button $n: " + appName(sp.getString(k, "").orEmpty()) }
                      refresh()
                      btn.setOnClickListener {
                          val pm = packageManager
                          val apps = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                              .sortedBy { it.loadLabel(pm).toString().lowercase() }
                          AlertDialog.Builder(this).setTitle("Button $n")
                              .setItems((listOf("None (empty slot)") + apps.map { it.loadLabel(pm).toString() }).toTypedArray()) { _, i ->
                                  sp.edit().putString(k, if (i == 0) "" else apps[i - 1].activityInfo.packageName).apply()
                                  refresh(); WidgetProvider.start(this)
                              }.show()
                      }
                      root.addView(btn)
                  }
                  label("Widget buttons: 6 per row, 2 rows. Pick any installed app for each.")
                  Prefs.SLOT_KEYS.forEachIndexed { i, k -> pick(k, i + 1) }

                  setContentView(ScrollView(this).apply { addView(root) })
                  WidgetProvider.start(this)
              }
          }
          END_OF_FILE_X
          mkdir -p $(dirname 'app/src/main/java/com/btcwidget/UpdateService.kt')
          cat > 'app/src/main/java/com/btcwidget/UpdateService.kt' <<'END_OF_FILE_X'
          package com.btcwidget

          import android.app.*
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.drawable.Drawable
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder
          import android.util.TypedValue
          import android.view.View
          import android.widget.RemoteViews
          import androidx.core.graphics.drawable.toBitmap
          import java.util.Locale
          import java.util.concurrent.Callable
          import java.util.concurrent.Executors
          import java.util.concurrent.Future
          import java.util.concurrent.TimeUnit

          class UpdateService : Service() {
              private val pool = Executors.newFixedThreadPool(12)
              private val loop = Executors.newSingleThreadScheduledExecutor()
              private var started = false

              private val slotIds = listOf(R.id.btn1, R.id.btn2, R.id.btn3, R.id.btn4, R.id.btn5, R.id.btn6,
                  R.id.btn7, R.id.btn8, R.id.btn9, R.id.btn10, R.id.btn11, R.id.btn12)

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("w", "Widget refresh", NotificationManager.IMPORTANCE_MIN))
                  val n = Notification.Builder(this, "w").setContentTitle("BTC widget running")
                      .setSmallIcon(android.R.drawable.ic_dialog_info).build()
                  if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(1, n)
              }

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  initWidget()
                  if (!started) {
                      started = true
                      loop.scheduleWithFixedDelay({ try { tick() } catch (_: Exception) {} }, 0, 1, TimeUnit.SECONDS)
                  }
                  return START_STICKY
              }

              private fun ids() = AppWidgetManager.getInstance(this)
                  .getAppWidgetIds(ComponentName(this, WidgetProvider::class.java))

              private fun icon(pkg: String): Bitmap {
                  val d: Drawable = try { packageManager.getApplicationIcon(pkg) }
                  catch (e: Exception) { getDrawable(android.R.drawable.sym_def_app_icon)!! }
                  return d.toBitmap(96, 96)
              }

              private fun open(code: Int, pkg: String): PendingIntent? {
                  val i = packageManager.getLaunchIntentForPackage(pkg) ?: return null
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return PendingIntent.getActivity(this, code, i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
              }

              /** Full update: icons + click targets. Text is refreshed by tick(). */
              private fun initWidget() {
                  val rv = RemoteViews(packageName, R.layout.widget)
                  val pkgs = Prefs.SLOT_KEYS.map { Prefs.str(this, it) }
                  for (i in 0 until 12) {
                      val pkg = pkgs[i]
                      if (pkg.isEmpty()) { rv.setViewVisibility(slotIds[i], View.INVISIBLE); continue }
                      rv.setViewVisibility(slotIds[i], View.VISIBLE)
                      rv.setImageViewBitmap(slotIds[i], icon(pkg))
                      open(10 + i, pkg)?.let { rv.setOnClickPendingIntent(slotIds[i], it) }
                  }
                  rv.setViewVisibility(R.id.row1, if (pkgs.subList(0, 6).any { it.isNotEmpty() }) View.VISIBLE else View.GONE)
                  rv.setViewVisibility(R.id.row2, if (pkgs.subList(6, 12).any { it.isNotEmpty() }) View.VISIBLE else View.GONE)
                  rv.setOnClickPendingIntent(R.id.gear, PendingIntent.getActivity(this, 3,
                      Intent(this, SettingsActivity::class.java), PendingIntent.FLAG_IMMUTABLE))
                  AppWidgetManager.getInstance(this).updateAppWidget(ids(), rv)
              }

              private fun <T> async(f: () -> T): Future<T?> = pool.submit(Callable<T?> { try { f() } catch (e: Exception) { null } })

              /** Relay first (fixed IP); if it fails and a direct key is saved, try direct. */
              private fun fetchPnl(key: String, sec: String, relay: String, rtok: String): Pair<Double, Int>? {
                  val direct = key.isNotEmpty() && sec.isNotEmpty()
                  if (relay.isEmpty() && !direct) { Delta.pnlErr = "add relay or API key in app"; return null }
                  try {
                      val r = Delta.pnl(key, sec, relay, rtok); Delta.pnlErr = ""; return r
                  } catch (e: Exception) {
                      if (relay.isNotEmpty() && direct) {
                          try { val r = Delta.pnl(key, sec); Delta.pnlErr = ""; return r }
                          catch (e2: Exception) { Delta.pnlErr = e2.message ?: e2.javaClass.simpleName; return null }
                      }
                      Delta.pnlErr = e.message ?: e.javaClass.simpleName
                      return null
                  }
              }

              private fun tick() {
                  val tfs = Prefs.tfs(this)
                  val extras = Prefs.extras(this)
                  val key = Prefs.str(this, "key"); val sec = Prefs.str(this, "secret")
                  val relay = Prefs.str(this, "relay"); val rtok = Prefs.str(this, "rtoken")
                  val p = async { Delta.price() }
                  val n = async { fetchPnl(key, sec, relay, rtok) }
                  val a = tfs.map { tf -> async { val (h, l, c) = Delta.candles(tf); Adx.calc(h, l, c)?.first } }
                  val x = extras.map { name -> async { Delta.extra(name) } }
                  push(p.get(), n.get(), tfs.zip(a.map { it.get() }), extras.zip(x.map { it.get() }))
              }

              private fun push(price: Double?, pnl: Pair<Double, Int>?, adx: List<Pair<String, Double?>>,
                               extras: List<Pair<String, Double?>>) {
                  val rv = RemoteViews(packageName, R.layout.widget)
                  val L = Locale.US
                  rv.setInt(R.id.bg, "setImageAlpha", Prefs.alpha(this))
                  val ts = Prefs.tsize(this).toFloat()
                  for (id in listOf(R.id.more, R.id.pnl, R.id.pos, R.id.adx)) rv.setTextViewTextSize(id, TypedValue.COMPLEX_UNIT_SP, ts)
                  rv.setTextViewText(R.id.price, if (price == null) "BTC --" else String.format(L, "BTC %,.1f", price))
                  if (extras.isEmpty()) rv.setViewVisibility(R.id.more, View.GONE)
                  else {
                      rv.setViewVisibility(R.id.more, View.VISIBLE)
                      rv.setTextViewText(R.id.more, extras.joinToString(" | ") { (n, v) ->
                          if (v == null) "$n --" else String.format(L, "%s %,.1f", n, v) })
                  }
                  if (pnl == null) {
                      rv.setTextViewText(R.id.pnl, "PnL: " + Delta.pnlErr.ifEmpty { "--" }); rv.setTextColor(R.id.pnl, 0xFFAAAAAA.toInt())
                      rv.setTextViewText(R.id.pos, "Pos --")
                  } else {
                      val rate = Prefs.rate(this)
                      val v = if (rate > 0) pnl.first * rate else pnl.first
                      val sym = if (rate > 0) "\u20B9" else "$"
                      rv.setTextViewText(R.id.pnl, String.format(L, "PnL %s%s%,.2f", if (v < 0) "-" else "+", sym, Math.abs(v)))
                      rv.setTextColor(R.id.pnl, if (v >= 0) 0xFF4CD964.toInt() else 0xFFFF5A5F.toInt())
                      rv.setTextViewText(R.id.pos, "Pos ${pnl.second}")
                  }
                  rv.setTextViewText(R.id.adx, "ADX " + adx.joinToString(" | ") { (tf, v) ->
                      if (v == null) "$tf --" else String.format(L, "%s %.1f", tf, v) })
                  AppWidgetManager.getInstance(this).partiallyUpdateAppWidget(ids(), rv)
              }

              override fun onDestroy() { loop.shutdownNow(); pool.shutdownNow(); super.onDestroy() }
          }
          END_OF_FILE_X
          mkdir -p $(dirname 'app/src/main/java/com/btcwidget/WidgetProvider.kt')
          cat > 'app/src/main/java/com/btcwidget/WidgetProvider.kt' <<'END_OF_FILE_X'
          package com.btcwidget

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class WidgetProvider : AppWidgetProvider() {
              override fun onUpdate(c: Context, m: AppWidgetManager, ids: IntArray) = start(c)
              override fun onEnabled(c: Context) = start(c)

              override fun onReceive(c: Context, i: Intent) {
                  super.onReceive(c, i)
                  if (i.action == Prefs.ACTION_CYCLE) {
                      val next = Prefs.TFS[(Prefs.TFS.indexOf(Prefs.tf(c)) + 1) % Prefs.TFS.size]
                      Prefs.sp(c).edit().putString("tf", next).apply()
                  }
              }

              companion object {
                  fun start(c: Context) {
                      try { c.startForegroundService(Intent(c, UpdateService::class.java)) } catch (_: Exception) {}
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) = WidgetProvider.start(c)
          }
