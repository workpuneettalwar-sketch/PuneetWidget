          cat > 'app/src/main/java/com/btcwidget/tt/TtSettingsActivity.kt' <<'END_OF_FILE_X'
          package com.btcwidget.tt

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.Settings
          import android.text.InputType
          import android.view.View
          import android.widget.*

          class TtSettingsActivity : Activity() {
              private val h = Handler(Looper.getMainLooper())
              private lateinit var status: TextView
              private lateinit var interval: EditText
              private lateinit var reload: EditText
              private lateinit var appBtn: Button

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  title = "Tradetron status"
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  TtService.start(this)
                  val sp = Prefs.sp(this)

                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(12), dp(16), dp(24)) }
                  fun label(t: String, size: Float = 14f) = TextView(this).apply { text = t; textSize = size; setPadding(0, dp(12), 0, dp(2)) }.also { col.addView(it) }
                  fun button(t: String, f: () -> Unit) = Button(this).apply { text = t; isAllCaps = false; setOnClickListener { f() } }.also { col.addView(it) }
                  fun number(key: String, def: Int) = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER; setText(sp.getInt(key, def).toString())
                  }.also { col.addView(it) }
                  fun switch(t: String, key: String, def: Boolean) = Switch(this).apply {
                      text = t; textSize = 15f; isChecked = sp.getBoolean(key, def); setPadding(0, dp(8), 0, dp(8))
                      setOnCheckedChangeListener { _, v -> sp.edit().putBoolean(key, v).apply(); TtService.start(this@TtSettingsActivity) }
                  }.also { col.addView(it) }
                  fun seek(t: String, key: String, def: Int, min: Int, max: Int) {
                      val l = label("$t: ${sp.getInt(key, def)}")
                      col.addView(SeekBar(this).apply {
                          this.max = max - min; progress = sp.getInt(key, def) - min
                          setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) {
                                  l.text = "$t: ${p + min}"; sp.edit().putInt(key, p + min).apply(); TtService.start(this@TtSettingsActivity)
                              }
                              override fun onStartTrackingTouch(s: SeekBar?) {}
                              override fun onStopTrackingTouch(s: SeekBar?) {}
                          })
                      })
                  }

                  status = TextView(this).apply { textSize = 14f; setPadding(dp(10), dp(10), dp(10), dp(10)); setBackgroundColor(0xFFECEFF1.toInt()) }
                  col.addView(status)

                  label("1. Log in once (use email/mobile + password or OTP; Google sign-in may be blocked inside apps).")
                  button("Log in to Tradetron") { startActivity(Intent(this, WebActivity::class.java).putExtra("url", Prefs.LOGIN)) }
                  button("Open Tradetron dashboard here (pause / exit / fix)") {
                      startActivity(Intent(this, WebActivity::class.java).putExtra("url", Prefs.DASH))
                  }
                  button("Reload now") { TtService.start(this, TtService.ACT_RELOAD) }

                  label("AT Account (2nd Tradetron account, e.g. the one in Secure Folder)", 16f)
                  switch("Show AT account in the widget (scroll down the Tradetron list)", "acct2", false)
                  button("Log in to AT account") { startActivity(Intent(this, WebActivity2::class.java).putExtra("url", Prefs.LOGIN)) }
                  button("Open AT dashboard here") { startActivity(Intent(this, WebActivity2::class.java).putExtra("url", Prefs.DASH)) }

                  label("Check status every (seconds)")
                  interval = number("interval", 5)
                  label("Reload the dashboard page every (seconds) - used only while reading the page directly")
                  reload = number("reload", 30)
                  button("Save timings") { saveNumbers(); Toast.makeText(this, "Saved", Toast.LENGTH_SHORT).show() }

                  label("Alerts", 16f)
                  switch("Alerts on errors / blocked / stuck / logged out", "alerts", true)
                  switch("Double beep (once) for those alerts", "alarm", true)
                  switch("Soft notification on every status change (entries / exits)", "changeBeep", false)
                  button("Test alert") { TtService.start(this, TtService.ACT_TEST) }
                  button("Allow running in background (battery)") { askBattery() }

                  label("Widget", 16f)
                  switch("Hide Exited / Archived strategies", "hideExited", true)
                  seek("Text size of the Tradetron lines", "tsize", 13, 9, 22)
                  appBtn = button("") { pickApp() }
                  updateAppBtn()

                  label("Help", 16f)
                  button("Copy diagnostics (send to Claude if statuses look wrong)") { copyDiag() }

                  setContentView(ScrollView(this).apply { addView(col) })
                  h.post(tickUi)
              }

              private val tickUi = object : Runnable {
                  override fun run() { showStatus(); h.postDelayed(this, 1000) }
              }

              private fun showStatus() {
                  val now = System.currentTimeMillis()
                  val s = StringBuilder()
                  s.append(when {
                      State.login -> "❌ Logged out of Tradetron - tap Log in"
                      State.lastOk == 0L -> "⏳ Connecting to Tradetron…"
                      now - State.lastOk > 60_000 -> "⚠ Not updating (last ${(now - State.lastOk) / 1000}s ago)"
                      else -> "✅ Watching - updated ${(now - State.lastOk) / 1000}s ago"
                  })
                  s.append("\nStrategies read: ${State.rows.size}")
                  if (State.src.isNotEmpty()) s.append("   (source: ${State.src})")
                  if (State.note.isNotEmpty()) s.append("\nNote: ${State.note}")
                  if (Acct2.enabled(this)) {
                      val a = Acct2.read(this)
                      s.append("\n\nAT account: ").append(when {
                          a == null || (a.lastOk == 0L && !a.login) -> "⏳ connecting… (log in to AT account if this stays)"
                          a.login -> "❌ logged out - tap Log in to AT account"
                          now - a.lastOk > 60_000 -> "⚠ not updating (last ${(now - a.lastOk) / 1000}s ago)"
                          else -> "✅ updated ${(now - a.lastOk) / 1000}s ago, ${a.rows.size} strategies"
                      })
                  }
                  status.text = s
              }

              private fun saveNumbers() {
                  val sp = Prefs.sp(this).edit()
                  interval.text.toString().toIntOrNull()?.let { sp.putInt("interval", it.coerceIn(2, 300)) }
                  reload.text.toString().toIntOrNull()?.let { sp.putInt("reload", it.coerceIn(10, 3600)) }
                  sp.apply()
              }

              private fun updateAppBtn() {
                  val pkg = Prefs.ttPkg(this)
                  val name = if (pkg.isEmpty()) "not set (opens dashboard in this app)" else try {
                      packageManager.getApplicationLabel(packageManager.getApplicationInfo(pkg, 0)).toString()
                  } catch (e: Exception) { pkg }
                  appBtn.text = "App opened by a widget tap: $name"
              }

              private fun pickApp() {
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = packageManager.queryIntentActivities(i, 0)
                      .map { it.loadLabel(packageManager).toString() to it.activityInfo.packageName }
                      .distinctBy { it.second }.sortedBy { it.first.lowercase() }
                  val labels = (listOf("(none - open dashboard in this app)") + apps.map { it.first }).toTypedArray()
                  AlertDialog.Builder(this).setTitle("App to open").setItems(labels) { _, w ->
                      Prefs.sp(this).edit().putString("ttpkg", if (w == 0) "-" else apps[w - 1].second).apply()
                      updateAppBtn()
                  }.show()
              }

              private fun askBattery() {
                  try {
                      val pm = getSystemService(PowerManager::class.java)
                      if (pm.isIgnoringBatteryOptimizations(packageName)) {
                          Toast.makeText(this, "Already allowed", Toast.LENGTH_SHORT).show(); return
                      }
                      startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                  } catch (e: Exception) {
                      try { startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)) } catch (_: Exception) {}
                  }
              }

              private fun copyDiag() {
                  val d = StringBuilder()
                  d.append("TT Status diagnostics\nsrc=${State.src}\napi=${State.api}\nhref=${State.href}\nlogin=${State.login}\n")
                  d.append("lastOk=${if (State.lastOk == 0L) "never" else "${(System.currentTimeMillis() - State.lastOk) / 1000}s ago"}\n")
                  d.append("note=${State.note}\nrows:\n")
                  State.rows.forEach { d.append("- ${it.status} | ${it.name} | ${it.id}\n") }
                  getSystemService(ClipboardManager::class.java).setPrimaryClip(ClipData.newPlainText("TT Status", d.toString()))
                  Toast.makeText(this, "Copied", Toast.LENGTH_SHORT).show()
              }

              override fun onPause() { super.onPause(); saveNumbers() }
              override fun onDestroy() { h.removeCallbacksAndMessages(null); super.onDestroy() }
          }
          END_OF_FILE_X

