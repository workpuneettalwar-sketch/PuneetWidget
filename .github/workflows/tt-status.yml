name: Build TT Status
on:
  push:
    paths:
      - '.github/workflows/tt-status.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p tt-status && cd tt-status
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'END_OF_FILE_X'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.ttstatus"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.ttstatus"; minSdk = 26; targetSdk = 34
                  versionCode = (project.findProperty("verCode") as String?)?.toIntOrNull() ?: 1
                  versionName = "1.0"
              }
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"; keyAlias = "androiddebugkey"; keyPassword = "android"
                  }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.webkit:webkit:1.11.0")
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'END_OF_FILE_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>
              <application android:label="@string/app_name" android:theme="@android:style/Theme.Material.Light.DarkActionBar">
                  <activity android:name=".SettingsActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".WebActivity" android:exported="false" android:label="Tradetron"
                      android:configChanges="orientation|screenSize|keyboardHidden"/>
                  <activity android:name=".OpenActivity" android:exported="false" android:excludeFromRecents="true"
                      android:noHistory="true" android:taskAffinity="" android:theme="@android:style/Theme.NoDisplay"/>
                  <receiver android:name=".WidgetProvider" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info"/>
                  </receiver>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
                  </receiver>
                  <service android:name=".UpdateService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="live widget refresh"/>
                  </service>
              </application>
          </manifest>
          END_OF_FILE_X

          mkdir -p 'app/src/main/assets'
          cat > 'app/src/main/assets/probe.js' <<'END_OF_FILE_X'
          (function () {
            if (window.__ttInit) return;
            window.__ttInit = true;

            var SET = { active: 1, liveentered: 1, livetranching: 1, paused: 1, blocked: 1, errorexecution: 1, error: 1,
              exitpending: 1, exited: 1, archived: 1, awaitingoneclick: 1 };
            function norm(s) { return String(s).toLowerCase().replace(/[^a-z]/g, ''); }
            function isStatus(v) { return typeof v === 'string' && v.length > 0 && v.length < 32 && SET[norm(v)] === 1; }

            function findStatus(o) {
              var k, v, k2;
              for (k in o) { v = o[k]; if (isStatus(v) && /status|state/i.test(k)) return v; }
              for (k in o) { v = o[k]; if (isStatus(v)) return v; }
              for (k in o) {
                v = o[k];
                if (v && typeof v === 'object' && !Array.isArray(v)) {
                  for (k2 in v) { if (isStatus(v[k2])) return v[k2]; }
                }
              }
              return null;
            }

            function findName(o) {
              var k, v, k2;
              for (k in o) { v = o[k]; if (typeof v === 'string' && /^(strategy_?name|template_?name|deployment_?name|name|title)$/i.test(k) && v.trim()) return v.trim(); }
              for (k in o) {
                v = o[k];
                if (v && typeof v === 'object' && !Array.isArray(v) && /template|strategy|deployment/i.test(k)) {
                  for (k2 in v) { if (typeof v[k2] === 'string' && /^(name|title|strategy_?name|template_?name)$/i.test(k2) && v[k2].trim()) return v[k2].trim(); }
                }
              }
              for (k in o) {
                v = o[k];
                if (typeof v === 'string' && v.length > 2 && v.length < 80 && /[a-z]/i.test(v) && !isStatus(v) &&
                    !/^https?:|^\d{4}-\d\d-\d\d|@/.test(v)) return v.trim();
              }
              return '';
            }

            function findSid(o) {
              var k, v;
              for (k in o) { v = o[k]; if (/^(sid|deployment_?id|deployed_?id)$/i.test(k) && (typeof v === 'number' || /^\d+$/.test(String(v)))) return String(v); }
              for (k in o) { v = o[k]; if (/^id$/i.test(k) && (typeof v === 'number' || /^\d+$/.test(String(v)))) return String(v); }
              return '';
            }

            function extract(j) {
              var best = null, bestCnt = 0, queue = [[j, 0]], seen = 0;
              while (queue.length && seen < 5000) {
                var it = queue.shift(), o = it[0], d = it[1];
                seen++;
                if (!o || typeof o !== 'object' || d > 7) continue;
                if (Array.isArray(o)) {
                  var cnt = 0;
                  for (var i = 0; i < o.length; i++) { if (o[i] && typeof o[i] === 'object' && !Array.isArray(o[i]) && findStatus(o[i])) cnt++; }
                  if (cnt > bestCnt && cnt >= Math.max(1, Math.floor(o.length / 2))) { best = o; bestCnt = cnt; }
                  for (var a = 0; a < o.length && a < 300; a++) queue.push([o[a], d + 1]);
                } else {
                  for (var k in o) queue.push([o[k], d + 1]);
                }
              }
              var rows = [];
              if (!best) return rows;
              for (var b = 0; b < best.length; b++) {
                var x = best[b];
                if (!x || typeof x !== 'object') continue;
                var s = findStatus(x);
                if (!s) continue;
                rows.push({ n: findName(x).slice(0, 60), s: s, id: findSid(x) });
              }
              return rows;
            }

            function countStatusLines(t) {
              var c = 0, ls = String(t).split('\n');
              for (var i = 0; i < ls.length; i++) if (isStatus(ls[i].trim())) c++;
              return c;
            }

            function domRows() {
              var out = [], seen = [], els = document.querySelectorAll('body *');
              for (var i = 0; i < els.length; i++) {
                var e = els[i];
                var t = (e.textContent || '').trim();
                if (!isStatus(t)) continue;
                var deeper = false;
                for (var c = 0; c < e.children.length; c++) { if ((e.children[c].textContent || '').trim() === t) { deeper = true; break; } }
                if (deeper) continue;
                if (e.closest('select,option,[role=option],[role=menu],[role=menuitem],[role=listbox],[role=tab],nav,header,button')) continue;
                if (e.getClientRects().length === 0) continue;
                var row = e.closest('tr');
                if (!row) {
                  row = e;
                  for (var d = 0; d < 10 && row.parentElement && row.parentElement !== document.body; d++) {
                    var p = row.parentElement, pt = p.innerText || '';
                    if (countStatusLines(pt) > 1 || pt.length > 700) break;
                    row = p;
                  }
                }
                if (seen.indexOf(row) >= 0) continue;
                seen.push(row);
                var all = row.innerText || '';
                var lines = all.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
                var name = '';
                for (var k = 0; k < lines.length; k++) {
                  var s = lines[k];
                  if (isStatus(s) || s.length < 3) continue;
                  if (/^[\d\s.,:+\-()%₹$]+$/.test(s)) continue;
                  if (/^(sid|live|offline|run|capital|p\s*&?\s*l|pnl|broker|multiplier|positions?|open|total|status|strategy)\b/i.test(s) && s.length < 16) continue;
                  name = s; break;
                }
                var m = all.match(/\b(9\d{8})\b/);
                out.push({ n: name.slice(0, 60), s: t, id: m ? m[1] : '' });
              }
              return out;
            }

            // ---- capture the dashboard's own data request so it can be repeated cheaply
            function consider(url, method, body, hdrs, text) {
              try {
                if (!text || text.length > 4000000) return;
                if (!/entered|exited|paused|active|error|blocked/i.test(text)) return;
                var j = JSON.parse(text);
                var rows = extract(j);
                if (rows.length && rows.length >= (window.__ttBest || 0) && (!method || /^get$/i.test(method) || typeof body === 'string')) {
                  window.__ttBest = rows.length;
                  window.__ttReq = { url: new URL(url, location.href).href, method: method || 'GET', body: body, hdrs: hdrs || {} };
                  window.__ttRows = rows;
                  window.__ttAt = Date.now();
                }
              } catch (e) {}
            }

            var of = window.fetch;
            window.__ttOrigFetch = of ? of.bind(window) : null;
            if (of) {
              window.fetch = function (input, init) {
                var url = (typeof input === 'string') ? input : (input && input.url);
                var m = (init && init.method) || (input && input.method) || 'GET';
                var b = init && init.body;
                var h = {};
                try {
                  var hh = (init && init.headers) || (input && input.headers);
                  if (hh) { if (hh.forEach) hh.forEach(function (v, k) { h[k] = v; }); else for (var k in hh) h[k] = hh[k]; }
                } catch (e) {}
                return of.apply(this, arguments).then(function (r) {
                  try { r.clone().text().then(function (t) { consider(url, m, typeof b === 'string' ? b : null, h, t); }); } catch (e) {}
                  return r;
                });
              };
            }

            var XP = XMLHttpRequest.prototype, XO = XP.open, XS = XP.send, XH = XP.setRequestHeader;
            XP.open = function (m, u) { this.__m = m; this.__u = u; this.__h = {}; return XO.apply(this, arguments); };
            XP.setRequestHeader = function (k, v) { try { if (this.__h) this.__h[k] = v; } catch (e) {} return XH.apply(this, arguments); };
            XP.send = function (b) {
              var x = this;
              try {
                x.addEventListener('load', function () {
                  try {
                    var t = (x.responseType === '' || x.responseType === 'text') ? x.responseText
                      : (x.responseType === 'json' ? JSON.stringify(x.response) : null);
                    consider(x.__u, x.__m, typeof b === 'string' ? b : null, x.__h, t);
                  } catch (e) {}
                });
              } catch (e) {}
              return XS.apply(this, arguments);
            };

            window.__ttTick = async function () {
              var res = { href: location.href };
              if (/login|signin|sign-in|register/i.test(location.pathname)) { res.login = true; return res; }
              var rows = null, src = '', q = window.__ttReq;
              if (q && q.url && window.__ttOrigFetch) {
                try {
                  var init = { method: q.method || 'GET', credentials: 'include', headers: q.hdrs || {} };
                  if (q.body && !/^get$/i.test(init.method)) init.body = q.body;
                  var r = await window.__ttOrigFetch(q.url, init);
                  if ((r.redirected && /login/i.test(r.url)) || r.status === 401 || r.status === 419) { res.login = true; return res; }
                  var t = await r.text();
                  rows = extract(JSON.parse(t));
                  if (rows.length) { src = 'api'; window.__ttRows = rows; window.__ttAt = Date.now(); }
                } catch (e) { res.apiErr = String(e).slice(0, 120); }
              }
              if (!rows || !rows.length) {
                rows = domRows(); src = 'page';
                if (!rows.length && window.__ttRows && Date.now() - (window.__ttAt || 0) < 20000) { rows = window.__ttRows; src = 'hook'; }
              }
              res.rows = rows; res.src = src; res.api = q ? q.url : '';
              return res;
            };
          })();
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/ttstatus'
          cat > 'app/src/main/java/com/ttstatus/Core.kt' <<'END_OF_FILE_X'
          package com.ttstatus

          import android.content.Context
          import android.content.Intent

          enum class Level { BAD, WARN, LIVE, IDLE, DONE }

          data class Row(val name: String, val status: String, val id: String) {
              val key: String get() = id.ifEmpty { name }
          }

          object Status {
              fun norm(s: String) = s.lowercase().filter { it in 'a'..'z' }

              fun level(s: String): Level = when (norm(s)) {
                  "errorexecution", "error", "blocked" -> Level.BAD
                  "exitpending", "awaitingoneclick", "livetranching", "paused" -> Level.WARN
                  "liveentered" -> Level.LIVE
                  "exited", "archived" -> Level.DONE
                  else -> Level.IDLE
              }

              fun color(l: Level): Int = when (l) {
                  Level.BAD -> 0xFFFF5A5F.toInt()
                  Level.WARN -> 0xFFFFC145.toInt()
                  Level.LIVE -> 0xFF4CD964.toInt()
                  Level.IDLE -> 0xFFCFD8DC.toInt()
                  Level.DONE -> 0xFF78858C.toInt()
              }
          }

          /** Latest reading, shared between the service, the widget and the settings screen. */
          object State {
              @Volatile var rows: List<Row> = emptyList()
              @Volatile var lastOk = 0L
              @Volatile var src = ""
              @Volatile var login = false
              @Volatile var note = ""
              @Volatile var api = ""
              @Volatile var href = ""
          }

          object Prefs {
              const val DASH = "https://tradetron.tech/user/dashboard"
              const val LOGIN = "https://tradetron.tech/login"

              fun sp(c: Context) = c.getSharedPreferences("tt", Context.MODE_PRIVATE)
              fun str(c: Context, k: String) = sp(c).getString(k, "")!!.trim()
              fun interval(c: Context) = sp(c).getInt("interval", 5).coerceIn(2, 300)
              fun reload(c: Context) = sp(c).getInt("reload", 30).coerceIn(10, 3600)
              fun alpha(c: Context) = sp(c).getInt("alpha", 200)
              fun tsize(c: Context) = sp(c).getInt("tsize", 13)
              fun alerts(c: Context) = sp(c).getBoolean("alerts", true)
              fun alarm(c: Context) = sp(c).getBoolean("alarm", true)
              fun hideExited(c: Context) = sp(c).getBoolean("hideExited", true)
              fun changeBeep(c: Context) = sp(c).getBoolean("changeBeep", false)

              /** Package of the Tradetron app opened by a widget tap: the saved choice, else any installed app named tradetron. */
              fun ttPkg(c: Context): String {
                  val s = str(c, "ttpkg")
                  if (s == "-") return ""
                  if (s.isNotEmpty()) return s
                  return try {
                      val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      c.packageManager.queryIntentActivities(i, 0)
                          .map { it.activityInfo.packageName }
                          .firstOrNull { it.contains("tradetron", true) } ?: ""
                  } catch (e: Exception) { "" }
              }
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/ttstatus'
          cat > 'app/src/main/java/com/ttstatus/UpdateService.kt' <<'END_OF_FILE_X'
          package com.ttstatus

          import android.annotation.SuppressLint
          import android.app.*
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Typeface
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.text.SpannableStringBuilder
          import android.text.Spanned
          import android.text.style.ForegroundColorSpan
          import android.text.style.StyleSpan
          import android.util.TypedValue
          import android.view.View
          import android.webkit.CookieManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.RemoteViews
          import androidx.webkit.WebViewCompat
          import androidx.webkit.WebViewFeature
          import org.json.JSONArray
          import org.json.JSONObject

          class UpdateService : Service() {
              companion object {
                  const val ACT_RELOAD = "com.ttstatus.RELOAD"
                  const val ACT_STOP_SOUND = "com.ttstatus.STOP_SOUND"
                  const val ACT_TEST = "com.ttstatus.TEST"
                  const val ACT_RENDER = "com.ttstatus.RENDER"
                  private const val CALL = "(function(){if(!window.__ttTick){return 'noinit';}" +
                      "window.__ttTick().then(function(r){TTB.report(JSON.stringify(r));})" +
                      ".catch(function(e){TTB.report(JSON.stringify({err:String(e)}));});return 'ok';})()"
              }

              private val h = Handler(Looper.getMainLooper())
              private var wv: WebView? = null
              private var probe = ""
              private var started = false
              private var lastLoad = 0L
              private var pending = false
              private var pendingAt = 0L
              private val prev = HashMap<String, String>()
              private val since = HashMap<String, Long>()
              private val alerted = HashMap<String, String>()
              private var staleAlerted = false
              private var loginAlerted = false
              private var player: MediaPlayer? = null
              private var startedAt = 0L

              private val rowIds = listOf(R.id.r1, R.id.r2, R.id.r3, R.id.r4, R.id.r5, R.id.r6,
                  R.id.r7, R.id.r8, R.id.r9, R.id.r10, R.id.r11, R.id.r12)

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("run", "Status refresh", NotificationManager.IMPORTANCE_MIN))
                  val ch = NotificationChannel("alert", "Tradetron alerts", NotificationManager.IMPORTANCE_HIGH)
                  ch.enableVibration(true)
                  ch.vibrationPattern = longArrayOf(0, 600, 300, 600, 300, 600)
                  ch.setBypassDnd(true)
                  ch.lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                  nm.createNotificationChannel(ch)
                  val n = Notification.Builder(this, "run").setContentTitle("TT Status watching Tradetron")
                      .setSmallIcon(android.R.drawable.ic_dialog_info).build()
                  if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(1, n)
                  probe = try { assets.open("probe.js").bufferedReader().use { it.readText() } } catch (e: Exception) { "" }
                  startedAt = System.currentTimeMillis()
              }

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (!started) {
                      started = true
                      setupWebView()
                      loadDash()
                      h.postDelayed(loop, 3000)
                  }
                  when (i?.action) {
                      ACT_RELOAD -> { loginAlerted = false; loadDash() }
                      ACT_STOP_SOUND -> stopSound()
                      ACT_TEST -> alert(3, "TT Status test alert", "This is how a Tradetron error alert will look and sound.", true)
                  }
                  initWidget()
                  render()
                  return START_STICKY
              }

              // ---------------------------------------------------------------- web reader

              inner class Bridge {
                  @JavascriptInterface
                  fun report(json: String) { h.post { pending = false; try { handle(json) } catch (_: Throwable) {} } }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView() {
                  val w = WebView(this)
                  val s = w.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.userAgentString = s.userAgentString.replace("; wv", "")
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, true)
                  w.addJavascriptInterface(Bridge(), "TTB")
                  if (probe.isNotEmpty() && WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      try { WebViewCompat.addDocumentStartJavaScript(w, probe, setOf("*")) } catch (_: Exception) {}
                  }
                  w.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(v: WebView, url: String) { if (probe.isNotEmpty()) v.evaluateJavascript(probe, null) }
                  }
                  // give the page a phone-sized screen so it lays out normally while hidden
                  w.measure(View.MeasureSpec.makeMeasureSpec(1080, View.MeasureSpec.EXACTLY),
                      View.MeasureSpec.makeMeasureSpec(2200, View.MeasureSpec.EXACTLY))
                  w.layout(0, 0, 1080, 2200)
                  w.onResume()
                  w.resumeTimers()
                  wv = w
              }

              private fun loadDash() {
                  lastLoad = System.currentTimeMillis()
                  pending = false
                  wv?.loadUrl(Prefs.DASH)
              }

              private val loop = object : Runnable {
                  override fun run() {
                      try { tick() } catch (_: Throwable) {}
                      h.postDelayed(this, Prefs.interval(this@UpdateService) * 1000L)
                  }
              }

              private fun tick() {
                  val now = System.currentTimeMillis()
                  val reloadMs = when {
                      State.login -> 60_000L
                      State.src == "api" -> 15 * 60_000L
                      else -> Prefs.reload(this) * 1000L
                  }
                  if (now - lastLoad > reloadMs) loadDash()
                  else if (!pending || now - pendingAt > 20_000) {
                      pending = true; pendingAt = now
                      wv?.evaluateJavascript(CALL) { v ->
                          if (v != null && v.contains("noinit")) { pending = false; if (probe.isNotEmpty()) wv?.evaluateJavascript(probe, null) }
                      }
                  }
                  checkStale(now)
                  render()
              }

              private fun handle(json: String) {
                  val o = JSONObject(json)
                  val now = System.currentTimeMillis()
                  State.href = o.optString("href")
                  if (o.optBoolean("login")) {
                      State.login = true
                      State.note = "Logged out - open the app and log in"
                      if (!loginAlerted && Prefs.alerts(this)) {
                          loginAlerted = true
                          alert(4, "Tradetron logged out", "TT Status can't see your strategies. Open TT Status and log in again.", true)
                      }
                      render(); return
                  }
                  if (o.has("err")) { State.note = o.optString("err").take(120); render(); return }
                  State.login = false
                  loginAlerted = false
                  val arr = o.optJSONArray("rows") ?: JSONArray()
                  val seen = HashSet<String>()
                  val rows = ArrayList<Row>()
                  for (k in 0 until arr.length()) {
                      val r = arr.optJSONObject(k) ?: continue
                      val row = Row(r.optString("n").trim(), r.optString("s").trim(), r.optString("id").trim())
                      if (row.status.isEmpty() || !seen.add(row.key + "|" + row.status)) continue
                      rows.add(row)
                  }
                  State.src = o.optString("src")
                  State.api = o.optString("api")
                  State.note = o.optString("apiErr")
                  if (rows.isEmpty()) {
                      if (State.note.isEmpty()) State.note = "page open, no strategies read yet"
                  } else {
                      State.rows = rows
                      State.lastOk = now
                      staleAlerted = false
                      checkAlerts(rows, now)
                  }
                  render()
              }

              // ---------------------------------------------------------------- alerts

              private fun checkAlerts(rows: List<Row>, now: Long) {
                  val bad = ArrayList<String>()
                  val changes = ArrayList<String>()
                  for (r in rows) {
                      val k = r.key
                      val st = Status.norm(r.status)
                      val old = prev[k]
                      if (old != st) {
                          since[k] = now
                          prev[k] = st
                          if (old != null) changes.add("${r.name.ifEmpty { r.id }}: ${r.status}")
                      }
                      val dur = now - (since[k] ?: now)
                      val trigger = when {
                          Status.level(r.status) == Level.BAD -> true
                          st == "awaitingoneclick" -> true
                          st == "exitpending" && dur > 30_000 -> true
                          st == "livetranching" && dur > 60_000 -> true
                          else -> false
                      }
                      if (trigger) {
                          if (alerted[k] != st) { alerted[k] = st; bad.add("${r.name.ifEmpty { r.id }}: ${r.status}") }
                      } else alerted.remove(k)
                  }
                  if (!Prefs.alerts(this)) return
                  if (bad.isNotEmpty()) alert(2, "⚠ Tradetron: ${bad.size} need attention", bad.joinToString("\n"), true)
                  else if (changes.isNotEmpty() && Prefs.changeBeep(this)) alert(6, "Tradetron status changed", changes.joinToString("\n"), false)
              }

              private fun checkStale(now: Long) {
                  if (State.login || !Prefs.alerts(this)) return
                  val ref = if (State.lastOk > 0) State.lastOk else startedAt
                  if (now - ref > 180_000 && !staleAlerted) {
                      staleAlerted = true
                      alert(5, "TT Status not updating", "No fresh Tradetron status for 3 minutes. Check internet, or open TT Status and log in.", true)
                  }
              }

              private fun openPi(code: Int): PendingIntent = PendingIntent.getActivity(this, code,
                  Intent(this, OpenActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                  PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)

              private fun alert(id: Int, title: String, text: String, loud: Boolean) {
                  val stop = PendingIntent.getService(this, 90 + id,
                      Intent(this, UpdateService::class.java).setAction(ACT_STOP_SOUND), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(this, "alert")
                      .setContentTitle(title).setContentText(text)
                      .setStyle(Notification.BigTextStyle().bigText(text))
                      .setSmallIcon(android.R.drawable.stat_sys_warning)
                      .setCategory(Notification.CATEGORY_ALARM)
                      .setAutoCancel(true)
                      .setContentIntent(openPi(70 + id))
                      .setDeleteIntent(stop)
                      .build()
                  getSystemService(NotificationManager::class.java).notify(id, n)
                  if (loud && Prefs.alarm(this)) playAlarm()
              }

              private fun playAlarm() {
                  stopSound()
                  try {
                      val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                          ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION) ?: return
                      val p = MediaPlayer()
                      p.setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build())
                      p.setDataSource(this, uri)
                      p.isLooping = true
                      p.prepare()
                      p.start()
                      player = p
                      h.postDelayed({ stopSound() }, 20_000)
                  } catch (_: Exception) {}
              }

              private fun stopSound() {
                  try { player?.stop() } catch (_: Exception) {}
                  try { player?.release() } catch (_: Exception) {}
                  player = null
              }

              // ---------------------------------------------------------------- widget

              private fun ids() = AppWidgetManager.getInstance(this)
                  .getAppWidgetIds(ComponentName(this, WidgetProvider::class.java))

              private fun initWidget() {
                  val rv = RemoteViews(packageName, R.layout.widget)
                  rv.setOnClickPendingIntent(R.id.root, openPi(1))
                  rv.setOnClickPendingIntent(R.id.web, PendingIntent.getActivity(this, 2,
                      Intent(this, WebActivity::class.java).putExtra("url", Prefs.DASH).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT))
                  rv.setOnClickPendingIntent(R.id.gear, PendingIntent.getActivity(this, 3,
                      Intent(this, SettingsActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK), PendingIntent.FLAG_IMMUTABLE))
                  AppWidgetManager.getInstance(this).updateAppWidget(ids(), rv)
              }

              private fun age(ms: Long): String {
                  val s = ms / 1000
                  return if (s < 60) "${s}s" else if (s < 3600) "${s / 60}m" else "${s / 3600}h"
              }

              private fun render() {
                  val rv = RemoteViews(packageName, R.layout.widget)
                  val now = System.currentTimeMillis()
                  val ts = Prefs.tsize(this).toFloat()
                  rv.setInt(R.id.bg, "setImageAlpha", Prefs.alpha(this))
                  val order = listOf(Level.BAD, Level.WARN, Level.LIVE, Level.IDLE, Level.DONE)
                  var rows = State.rows
                  if (Prefs.hideExited(this)) rows = rows.filter { Status.level(it.status) != Level.DONE }
                  rows = rows.sortedBy { order.indexOf(Status.level(it.status)) }
                  val nBad = rows.count { Status.level(it.status) == Level.BAD }
                  val nWarn = rows.count { Status.level(it.status) == Level.WARN }
                  val stale = State.lastOk > 0 && now - State.lastOk > 60_000
                  val (head, col) = when {
                      State.login -> "TT  LOGIN NEEDED" to Status.color(Level.BAD)
                      State.lastOk == 0L -> "TT  connecting…" to Status.color(Level.IDLE)
                      stale -> "TT  NOT UPDATING" to Status.color(Level.BAD)
                      nBad > 0 -> "TT  ⚠ $nBad ERROR" to Status.color(Level.BAD)
                      nWarn > 0 -> "TT  ! $nWarn to check" to Status.color(Level.WARN)
                      else -> "TT  ✓ all OK" to Status.color(Level.LIVE)
                  }
                  rv.setTextViewText(R.id.head, head)
                  rv.setTextColor(R.id.head, col)
                  rv.setTextViewTextSize(R.id.head, TypedValue.COMPLEX_UNIT_SP, ts + 2f)
                  rv.setTextViewText(R.id.upd, if (State.lastOk == 0L) "" else age(now - State.lastOk))
                  rv.setTextViewTextSize(R.id.upd, TypedValue.COMPLEX_UNIT_SP, ts - 2f)
                  for (i in rowIds.indices) {
                      val id = rowIds[i]
                      if (i >= rows.size) { rv.setViewVisibility(id, View.GONE); continue }
                      rv.setViewVisibility(id, View.VISIBLE)
                      rv.setTextViewTextSize(id, TypedValue.COMPLEX_UNIT_SP, ts)
                      if (i == rowIds.size - 1 && rows.size > rowIds.size) {
                          rv.setTextViewText(id, "+${rows.size - rowIds.size + 1} more…")
                          rv.setTextColor(id, Status.color(Level.IDLE))
                          continue
                      }
                      val r = rows[i]
                      val lv = Status.level(r.status)
                      val sb = SpannableStringBuilder()
                      sb.append(r.status)
                      sb.setSpan(ForegroundColorSpan(Status.color(lv)), 0, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      if (lv == Level.BAD || lv == Level.WARN) sb.setSpan(StyleSpan(Typeface.BOLD), 0, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      sb.append("  ")
                      sb.append(r.name.ifEmpty { r.id.ifEmpty { "?" } })
                      rv.setTextColor(id, 0xFFFFFFFF.toInt())
                      rv.setTextViewText(id, sb)
                  }
                  rv.setViewVisibility(R.id.empty, if (rows.isEmpty() && State.lastOk > 0) View.VISIBLE else View.GONE)
                  AppWidgetManager.getInstance(this).partiallyUpdateAppWidget(ids(), rv)
              }

              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  stopSound()
                  try { wv?.destroy() } catch (_: Exception) {}
                  super.onDestroy()
              }
          }
          END_OF_FILE_X

          mkdir -p 'app/src/main/java/com/ttstatus'
          cat > 'app/src/main/java/com/ttstatus/Screens.kt' <<'END_OF_FILE_X'
          package com.ttstatus

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.webkit.CookieManager
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class WidgetProvider : AppWidgetProvider() {
              override fun onUpdate(c: Context, m: AppWidgetManager, ids: IntArray) = start(c)
              override fun onEnabled(c: Context) = start(c)

              companion object {
                  fun start(c: Context, action: String? = null) {
                      try {
                          val i = Intent(c, UpdateService::class.java)
                          if (action != null) i.action = action
                          c.startForegroundService(i)
                      } catch (_: Exception) {}
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) = WidgetProvider.start(c)
          }

          /** Invisible screen behind a widget or alert tap: silences the alarm, then opens the Tradetron app. */
          class OpenActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  WidgetProvider.start(this, UpdateService.ACT_STOP_SOUND)
                  val pkg = Prefs.ttPkg(this)
                  val launch = if (pkg.isEmpty()) null else packageManager.getLaunchIntentForPackage(pkg)
                  try {
                      startActivity(launch?.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          ?: Intent(this, WebActivity::class.java).putExtra("url", Prefs.DASH).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (_: Exception) {}
                  finish()
              }
          }

          /** Tradetron website inside the app: used to log in (the watcher shares this login) and as a full control panel. */
          class WebActivity : Activity() {
              private lateinit var w: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  title = "Tradetron"
                  w = WebView(this)
                  val s = w.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.builtInZoomControls = true
                  s.displayZoomControls = false
                  s.userAgentString = s.userAgentString.replace("; wv", "")
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, true)
                  w.webViewClient = WebViewClient()
                  setContentView(w)
                  w.loadUrl(intent.getStringExtra("url") ?: Prefs.DASH)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (w.canGoBack()) w.goBack() else super.onBackPressed()
              }

              override fun onPause() {
                  super.onPause()
                  CookieManager.getInstance().flush()
              }

              override fun onDestroy() {
                  CookieManager.getInstance().flush()
                  WidgetProvider.start(this, UpdateService.ACT_RELOAD)
                  try { w.destroy() } catch (_: Exception) {}
                  super.onDestroy()
              }
          }
          END_OF_FILE_X

